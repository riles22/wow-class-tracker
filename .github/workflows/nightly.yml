name: Nightly tracker refresh
run-name: "Nightly tracker refresh (${{ inputs.agent_model || 'claude-opus-5' }})"

# Machine-off nightly automation. Isolated stages (2026-07-14 security audit + same-day
# re-audit; agent-resilience pass 2026-07-16/17 after six consecutive incomplete runs):
#
#   1. Deterministic WCL fetch — the ONLY step holding WCL_CLIENT_ID/WCL_CLIENT_SECRET
#      (step-scoped env). Runs src/fetch-wcl.mjs, writes wcl-fetch/evidence.json, and
#      uploads it as its own artifact BEFORE any agent runs — the agents' only WCL
#      input, and tamper-evident for the publish gate.
#   2. Primary agent (DE-PRIVILEGED) — Claude Code fetches untrusted web content on a
#      contents:read token with no persisted checkout credentials and NO WCL secrets;
#      its only secret is its own OAuth token. Leaves edits in the working tree and
#      rebuilds data/run-manifest.json.
#   3. Recovery agent — runs only when the primary ended without satisfying the
#      deterministic completion check (the recurring failure shape: agents ending
#      after minutes with no manifest).
#   4. Final deterministic completion gate — manifest rewritten + npm test + build +
#      check-refresh + WCL-credential health, so an incomplete refresh fails HERE
#      with the real reason.
#   5. publish (deterministic, PRIVILEGED) — no AI. Downloads the artifacts, re-runs
#      every gate (cross-checking WCL manifest rows against the pre-agent evidence
#      artifact), snapshots, stages explicit paths, commits, pushes, dispatches the
#      Pages deploy. The anomaly gate's override is HUMAN-ONLY via the anomaly_ack
#      workflow_dispatch input — the agent-written manifest can only propose.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token` (Pro/Max; valid ~1 year — renew!)
#   WCL_CLIENT_ID           — Warcraft Logs v2 API client UUID
#   WCL_CLIENT_SECRET       — Warcraft Logs v2 API client secret

on:
  schedule:
    # 10:37 UTC — deliberately an odd minute; :00–:10 congestion drops scheduled runs.
    - cron: "37 10 * * *"
  workflow_dispatch: # manual runs; also the ONLY way to approve an anomaly
    inputs:
      anomaly_ack:
        description: >-
          Human approval for a mass tier-movement anomaly (reason + citation, e.g.
          "Blizzard 12.1 mass retune, forum post #19"). Leave empty for normal runs —
          only set it when re-running after the anomaly gate blocked a REAL, citable
          Blizzard mass retune. Scheduled runs can never carry an ack.
        required: false
        default: ""
      value_move_ack:
        description: >-
          Human approval for a large METRIC-VALUE move (reason + citation, e.g. "Archon
          column parse corrected, 47 rows rescaled"). Separate from anomaly_ack on
          purpose: one token approving both would let a reviewed tier retune silently
          waive every unrelated value finding in the same run. Leave empty for normal
          runs; scheduled runs can never carry an ack.
        required: false
        default: ""
      agent_model:
        description: >-
          Claude model for BOTH refresh agents, this run only (one-off trials, e.g.
          claude-fable-5 or claude-sonnet-5). Scheduled runs always use the default.
        required: false
        default: "claude-opus-5"

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110   # 90 left the recovery path ~6 min of headroom (audit A7)
    permissions:
      contents: read # the agent job holds NO write scopes — publication happens in `publish`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config: the agents' shells have no ambient push credential.
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # yt-dlp at the version pinned in requirements.txt — the agents must never
      # install or upgrade packages themselves.
      - name: Install pinned yt-dlp
        run: pipx install "yt-dlp==$(sed -n 's/^yt-dlp==//p' requirements.txt)"

      # Deterministic WCL stage (re-audit 2026-07-14): the ONLY step holding the WCL
      # credentials — step-scoped env, gone before any agent starts. Always exits 0
      # when evidence was written; bad verdicts go red in the final gate.
      - name: Deterministic WCL fetch (only step with WCL credentials)
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: node src/fetch-wcl.mjs

      # Uploaded BEFORE the agents run: the publish gate cross-checks WCL manifest
      # rows against THIS copy, so an agent (which can edit the working-tree copy)
      # has no window to tamper with what the gate reads.
      - name: Publish WCL fetch evidence (pre-agent, tamper-evident)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wcl-evidence
          retention-days: 7
          path: wcl-fetch/

      - name: Deterministic public-source availability evidence
        run: node src/fetch-source-health.mjs

      - name: Save public-source availability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-health
          retention-days: 7
          path: source-health/

      - name: Deterministic Murlok and Mythicstats collection
        run: node src/fetch-stable-metrics.mjs

      - name: Save stable metric receipts before the agents run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-metrics
          retention-days: 7
          if-no-files-found: error
          path: metrics-fetch/

      - name: Collect official note revisions and changed class sections
        run: node src/fetch-official-notes.mjs

      - name: Save official note receipts before the agents run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-notes
          retention-days: 7
          if-no-files-found: error
          path: official-notes/

      # Deterministic transcript stage (owner-approved 2026-07-17): the ONLY step
      # holding TRANSCRIPT_API_KEY (Supadata; mode=native = YouTube's own captions,
      # the same source yt-dlp read before the datacenter bot-wall). Drains the
      # agent-maintained data/pending-transcripts.json queue into transcript-fetch/
      # for the agents to distill. A missing secret is a CLEAN skip (verdict
      # no-credentials) — the lane activates the run after the owner adds the secret.
      - name: Deterministic transcript fetch (only step with the transcript API key)
        env:
          TRANSCRIPT_API_KEY: ${{ secrets.TRANSCRIPT_API_KEY }}
        run: node src/fetch-transcripts.mjs

      # Deterministic published-date evidence (docs/published-gate-scope.md): reads each
      # published-bearing registry page and records what the page says about its OWN
      # update date, BEFORE any agent runs — the publish gate cross-checks stored
      # `published` values against this copy, so a stale re-read can no longer claim
      # success unchallenged (the 08-02 icyveins-ptr incident). No credentials; always
      # exits 0 once evidence is written — an unreachable page is a recorded
      # degradation the gate works around, never a red night caused by our own fetch.
      - name: Deterministic published-date evidence
        run: node src/fetch-published.mjs

      - name: Publish published-date evidence (pre-agent, tamper-evident)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-evidence
          retention-days: 7
          path: published-evidence/

      # First-party action pinned to the v1-tag commit (unpinned mutable tags are a
      # supply-chain risk in an unattended secret-bearing job); Dependabot proposes
      # reviewed bumps. NOTE: no WCL_* env on either agent step — their only secret
      # is the Claude OAuth token (their own auth).
      - name: Primary full refresh (Claude Code, read-only token)
        id: primary_agent
        continue-on-error: true
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0 # v1
        timeout-minutes: 55    # the 07-24 primary ran 39m05s against the old 42 (audit A7)
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --permission-mode bypassPermissions
            --max-turns 250
            --model ${{ inputs.agent_model || 'claude-opus-5' }}
            --disallowedTools "Agent,Task"
          prompt: |
            Maintain the WoW Midnight tracker in this checked-out repository. You are the
            unprivileged fetch-and-distill stage: never commit, push, tag, dispatch a workflow,
            print a secret, or write outside this working tree.

            data/required-sources.json and data/scales.json are the GATE CONTRACT — never
            edit them. If check-refresh reports a missing manifest row, the fix is to write
            that row, never to delete the requirement: publish diffs the contract against
            master and fails the night red either way.

            CLAUDE.md is ALREADY LOADED into your context — do not Read it, that is a
            duplicate 73KB copy. Read the four refresh skills before acting:
            .claude/skills/ptr-watch/SKILL.md
            .claude/skills/watch-creators/SKILL.md
            .claude/skills/refresh-tiers/SKILL.md
            .claude/skills/refresh-metrics/SKILL.md

            Complete ALL four skills in this run. Attempt every key in
            data/required-sources.json even when stored data is already fresh (policy
            2026-07-08: no staleness gate). Fetch game data live; never substitute model
            memory or guesses. Expected source degradation must leave existing data
            unchanged and be recorded honestly.

            MURLOK / MYTHICSTATS: read metrics-fetch/evidence.json and apply only
            metrics-fetch/updates.json through src/apply-metrics.mjs. These tested
            collectors are the only input for these two metric families; never parse
            a second copy yourself. A source's update date is not the fetch date.
            Preserve unchanged undated observations and failed sources exactly.
            Run node src/check-stable-metrics.mjs before finishing; publish checks
            against the separate pre-agent artifact, not your working-tree copy.

            OFFICIAL NOTES: read official-notes/evidence.json and pending.json.
            Reconcile data/official-notes.json per ptr-watch: every changed class
            section needs an applied reference, an explicit irrelevant reason, or
            an unresolved disposition. Unresolved sections block publication until
            handled. This includes edits to older posts. The 12.1.5 PTR lane is
            NOTES ONLY: never change PHASES, write 12.1.5 material into ptr-builds
            or ptr verdicts, reopen forecasts, or relabel archived 12.1 PTR metrics.
            Run node src/check-official-notes.mjs before finishing.

            WARCRAFT LOGS: you hold NO WCL credentials. A deterministic step already ran
            src/fetch-wcl.mjs and wrote wcl-fetch/evidence.json — your ONLY WCL input.
            The live S2 zones are 53 (raid, The Venomous Abyss) and 55 (M+); the PTR
            zones (52/54/56) belong to the CLOSED 12.1 cycle and are no longer fetched.
            Write the two WCL manifest rows (wcl-live-raid, wcl-live-mplus) from the
            evidence honestly. A WCL row may claim success ONLY when
            evidence.landed[key] shows rows — currently none do (the transport outage
            is an OWNER-ACCEPTED standing red; see the rows' labels in
            data/required-sources.json), so both rows normally record the evidence
            verdict as their degradation detail. Historically the three *-raw keys, whose
            raw-DPS medians the fetch step merges into specs.json ITSELF before you start
            (never re-fetch, recompute, or edit those rows; if a landed entry is absent,
            report that key partial/unreachable/parse_error with the evidence's
            rawRecipes[key] detail — an empty PTR zone between testing windows is
            "partial", not an error). While the evidence reports verdict "rdps-broken",
            the five frozen rDPS/normalized cuts are unreachable with that detail and
            their stored data stays unchanged — the publish gate cross-checks an evidence
            artifact uploaded before you started, which you cannot modify. If the verdict
            is "rdps-restored", put "WCL RDPS RESTORED — owner decision needed on the
            median recipe" at the TOP of the summary; if it is "no-credentials" or
            "oauth-failed", surface that at the top too. Do NOT fetch anything from
            warcraftlogs.com yourself, by any means — no API, no HTML scraping, no workarounds.

            PTR watch must check the official forum thread and the Wowhead news RSS for new
            builds (the WCL zone-54/52 parts are evidence-only, per above). Creator watch must
            poll every configured YouTube feed; use the already-installed yt-dlp (never
            install, upgrade, or replace it or any other package), back off from datacenter
            blocking, and record pending videos rather than hammering. Creator opinions never
            move tiers.

            YOUTUBE TRANSCRIPTS: you hold NO transcript credentials. A deterministic step may
            have pre-fetched queued videos into transcript-fetch/ (summary.json + one
            <videoId>.json per video; chunk offsets are MILLISECONDS). Distill takes/metaNotes
            from those files per the watch-creators skill, and maintain
            data/pending-transcripts.json honestly: remove ONLY videos you distilled or
            transcript-verified-skipped, append new in-scope videos that have no fetched
            transcript. Never fetch transcripts from YouTube or any transcript API yourself.
            summary.json verdict "no-credentials" = the optional key isn't configured yet;
            keep queueing pending as before. Verdict "unauthorized" or "limit-exceeded" =
            put "TRANSCRIPT API KEY problem: <verdict>" near the top of the manifest summary.

            SEASON NOTE: the live season is S2. ARCHON RETENTION (owner-confirmed
            2026-09-05): its last verified S2 letters still contribute to consensus during
            the access wall; an outage does not remove a source. Earlier three-source
            claims were wrong. Read source-health/evidence.json for this run's ordinary
            public-route diagnostics before attempting Archon; never solve/replay a human
            verification challenge. Availability is not verified game data or a new date.
            Report each requirement honestly, keep failed-fetch dates unchanged, and parse
            source data only if actually accessible. Read encounter-tiers.json itself for
            its season/date; its S1 archive remains quarantined until S2 observations land.

            Rebuild data/run-manifest.json from scratch for THIS run — the committed copy is
            the PREVIOUS run's record and never excuses skipping work. It must contain today's
            UTC run date, a current full UTC startedAt instant, a <=180-character summary, and
            exactly one source row per requirement key, each with previousAsOf/newAsOf (the
            stored dates before/after this run — copy them from the actual data files, never
            fabricate) and an honest result: "success" ONLY when this run verified the
            source and its stored coverage date is no more than one day old, matching
            checkManifest. A same-day recheck may confirm unchanged fresh data; it must
            not advance a source-owned date. Failed or stale verification is partial/unreachable/blocked/
            parse_error WITH the reason; "skipped" without a detail fails the publish. NEVER
            write an "anomalyAck" field — the gate rejects any manifest carrying it. If a mass
            tier shift looks like a REAL Blizzard retune (not a parse artifact), set
            "anomalyAckProposal": "<reason + citation>" — it does NOT bypass the anomaly gate
            (only a human re-running this workflow with the anomaly_ack input can); it is your
            evidence for that human.

            Run `npm run test:quiet` and npm run build before finishing (test:quiet is the
            same suite through a compact reporter — it reports the pass/fail/skip counts and
            full diagnostics for anything red; the deterministic gate re-runs the verbose
            `npm test` after you, so use the quiet one). If a source edit cannot be made
            valid, revert only that source's edits (git checkout -- <files>) and record
            parse_error with a useful reason. Do not stop after PTR/creator work; tiers,
            metrics, tests, build, and the fresh manifest are mandatory.

            SINGLE-SHOT SESSION — the proven cause of every lost night since 07-15: this is
            a one-shot headless run. The moment you end your turn, the workflow moves on and
            you are NEVER woken again. Do NOT run anything in the background to "wait" for —
            no background agents or tasks, no completion notifications, no deferred polling
            (the 07-17 recovery agent finished every source, then ended its turn "waiting for
            the async creators poll to complete", and the whole night was discarded with the
            manifest unwritten). Subagent tools are disabled in this run; do ALL work inline
            in the foreground, slow feed polls included.

            COMPLETION CONTRACT: the run is NOT COMPLETE until data/run-manifest.json is
            REWRITTEN with this run's outcomes and `node src/check-refresh.mjs --manifest`
            passes — with ONE exception: if the gate fails ONLY on its mass-movement
            anomaly check for movement you did not cause (a season transition recomposing
            the consensus is the known case), record the evidence in "anomalyAckProposal",
            leave every observation exactly as you verified it, and finish — the
            publish-side gates and the human ack decide from there. NEVER buy a green
            gate by editing observations (e.g. reverting a seasonVerified value you
            verified tonight): that is the one dishonest lever no gate catches, and it
            corrupts the season machinery. Before ending, run `git diff --stat -- data/run-manifest.json` and
            confirm it shows a change. If you must stop early for ANY reason — degraded
            sources, nothing new anywhere, errors you cannot fix — write the manifest FIRST,
            with honest rows for exactly what you attempted and what you did not get to,
            then stop. Ending without a rewritten manifest wastes the entire night no matter
            how much else you did.

      # The action writes its execution log to $RUNNER_TEMP/claude-execution-output.json
      # and the recovery pass OVERWRITES it — preserve the primary's copy first. These
      # transcripts are the only way to see WHY an agent ended early (the recurring
      # failure is model-independent: sonnet and opus both do it).
      - name: Preserve primary agent transcript
        if: always()
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/agent-primary.json" 2>/dev/null || true

      - name: Check primary agent completion
        id: primary_check
        continue-on-error: true
        env:
          ANOMALY_ACK: ${{ inputs.anomaly_ack }}
          VALUE_MOVE_ACK: ${{ inputs.value_move_ack }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/run-manifest.json; then
            echo "::error::Primary agent did not rewrite data/run-manifest.json"
            exit 1
          fi
          node src/check-refresh.mjs --manifest
          node src/check-stable-metrics.mjs --manifest data/run-manifest.json
          node src/check-official-notes.mjs

      - name: Recovery pass for incomplete refresh
        if: steps.primary_agent.outcome != 'success' || steps.primary_check.outcome != 'success'
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0 # v1
        timeout-minutes: 35
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --permission-mode bypassPermissions
            --max-turns 180
            --model ${{ inputs.agent_model || 'claude-opus-5' }}
            --disallowedTools "Agent,Task"
          prompt: |
            The primary nightly agent exited without satisfying the deterministic refresh
            contract. Resume from the CURRENT working tree; preserve valid completed work and
            inspect git diff plus all four skill logs to identify what is missing.

            CLAUDE.md is ALREADY LOADED — do not Read it. Read the ptr-watch, watch-creators,
            refresh-tiers, and refresh-metrics
            SKILL.md files. Finish every missing skill and attempt every requirement in
            data/required-sources.json. The common failure is stopping after PTR/creator work, so
            explicitly complete tiers and metrics before finalizing. Use only live fetched data.
            Never guess, commit, push, dispatch, or expose secrets.

            data/required-sources.json and data/scales.json are the GATE CONTRACT — never
            edit them. If check-refresh reports a missing manifest row, write that row; do
            not delete the requirement. Publish diffs the contract against master and fails
            the night red either way, so removing a requirement only wastes the run.

            WARCRAFT LOGS: you hold NO WCL credentials — wcl-fetch/evidence.json (written by the
            deterministic pre-agent step) is your only WCL input; write the two WCL manifest
            rows (wcl-live-raid, wcl-live-mplus) from it honestly. Success is allowed ONLY where
            evidence.landed[key] shows rows — currently none do (owner-accepted standing red
            while the S2 transport outage lasts; the PTR *-raw recipes were retired at the
            2026-08-18 flip and their stored rows in specs.json are final receipts — never
            re-fetch or edit those rows); both rows stay degraded with the
            evidence's verdict detail (the publish gate cross-checks a
            pre-agent artifact copy you cannot modify). Do not fetch warcraftlogs.com yourself,
            by any means. Same for YouTube transcripts: distill only from the pre-fetched
            transcript-fetch/ files (offsets in ms), maintain data/pending-transcripts.json
            honestly, and never fetch transcripts yourself.

            ARCHON: read source-health/evidence.json for this run's public-route checks.
            Never bypass a verification challenge or turn a successful HTTP response into
            fresh data without parsing/era verification. Retain last verified S2 letters
            with their original dates; they still contribute to consensus during outages.
            Read encounter-tiers.json's actual season/date rather than copying old run prose.

            STABLE METRICS: use only the deterministic metrics-fetch/evidence.json
            and updates.json for Murlok/Mythicstats; apply the prepared updates,
            preserve unchanged/failed observations and their source dates, and run
            node src/check-stable-metrics.mjs. Do not reparse these sites yourself.

            OFFICIAL NOTES: reconcile official-notes/evidence.json and pending.json
            into data/official-notes.json per ptr-watch. Resolve each changed class
            section with a verifiable applied reference or an irrelevant reason;
            unresolved sections block publication. Keep 12.1.5 notes in the separate
            preview lane only, with PHASES and the frozen forecasts unchanged.
            Run node src/check-official-notes.mjs before finishing.

            Rebuild data/run-manifest.json from scratch with a current UTC startedAt and one
            honest row per required source, each with previousAsOf/newAsOf copied from the real
            stored data. NEVER write an "anomalyAck" field (the gate rejects it); a real mass
            retune goes in "anomalyAckProposal" with a citation, for human review. Run
            `npm run test:quiet` (same suite, compact reporter — counts plus full diagnostics
            on red) and npm run build, repair or narrowly revert invalid source edits, and do not finish
            until both commands pass and `node src/check-refresh.mjs --manifest` either passes
            or fails ONLY on its mass-movement anomaly check for movement you did not cause (a
            season transition recomposing the consensus is the known case) — in that one case
            record the evidence in "anomalyAckProposal", leave every observation exactly as you
            verified it, and finish; the publish-side gates and the human ack decide from there.
            NEVER buy a green gate by editing observations (e.g. reverting a seasonVerified
            value you verified tonight) — the one dishonest lever no gate catches.

            SINGLE-SHOT SESSION — the proven cause of every lost night: the moment you end
            your turn, this session is over and you are NEVER woken again. Do NOT run
            anything in the background to "wait" for (background agents/tasks, completion
            notifications, deferred polls) — that is exactly how the previous runs died,
            finishing every source and then yielding while a creators poll ran in the
            background. Subagent tools are disabled; do ALL work inline in the foreground,
            and never end your turn until the manifest is rewritten and the completion
            contract above is met.

      - name: Final deterministic completion gate
        if: always() && !cancelled()
        env:
          ANOMALY_ACK: ${{ inputs.anomaly_ack }}
          VALUE_MOVE_ACK: ${{ inputs.value_move_ack }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/run-manifest.json; then
            echo "::error::data/run-manifest.json is unchanged; no complete refresh was produced"
            exit 1
          fi
          npm test
          npm run build
          node src/check-refresh.mjs --manifest
          node src/check-stable-metrics.mjs --manifest data/run-manifest.json
          node src/check-official-notes.mjs
          # WCL credential/config rot is invisible to the agents (they never hold the
          # secrets) — surface it deterministically as a red refresh job.
          verdict="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("wcl-fetch/evidence.json","utf8")).verdict ?? "")' 2>/dev/null || echo unreadable)"
          case "$verdict" in
            no-credentials|oauth-failed|unreadable)
              echo "::error::WCL fetch step could not authenticate (verdict: $verdict) — check WCL_CLIENT_ID/WCL_CLIENT_SECRET"
              exit 1;;
          esac

      # When the night failed, put the agents' final moves where remote diagnosis can
      # read them (the job log) — artifacts alone need an interactive download.
      - name: Dump agent transcript tails (failure diagnosis)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/agent-primary.json" "$RUNNER_TEMP/claude-execution-output.json"; do
            [ -f "$f" ] || continue
            echo "===== tail of ${f##*/} ====="
            tail -c 16000 "$f" || true
            echo
          done

      # Full transcripts for interactive download, on EVERY run. S5 briefly narrowed this
      # to `if: failure()` on the theory that only red nights need post-mortems — which is
      # wrong in the shape that actually bites: on 2026-07-25 the refresh job was GREEN and
      # `publish` failed, so a refresh-scoped failure() condition would have uploaded
      # nothing for the one night anyone needed to read. Transcripts also found the
      # 07-15..17 root cause. The agents hold no credentials, so the residual is a public
      # repo carrying the agents' reasoning over already-public pages — accepted.
      - name: Upload agent transcripts (diagnosis)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-transcripts
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/agent-primary.json
            ${{ runner.temp }}/claude-execution-output.json

      # Everything the publish job may commit travels here — data/ (incl. the run
      # manifest) and the skill logs. dist/ is deliberately NOT transferred: publish
      # rebuilds it from source, so a tampered build artifact can't ride along.
      - name: Upload refresh output for publication or debugging
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-refresh
          include-hidden-files: true
          retention-days: 7
          path: |
            data/
            .claude/skills/*/log.md

  publish:
    # Deterministic publication — no AI, no untrusted fetches. Runs even when the
    # refresh job failed: the gates below, not the agents' exit codes, decide
    # publishability, and they re-run from scratch on the downloaded artifacts.
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write # dispatches the Pages deploy workflow
      issues: write # posts the per-run digest comment (owner's daily email)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CURRENT master, not the trigger-time sha: commits that land on master while
          # the ~30-min refresh job runs (2026-07-17: a template feature) otherwise
          # guarantee a dist/index.html conflict on push. The artifact still supplies
          # data/, and Gate 2 rebuilds dist/ from the freshest code either way.
          ref: master
          fetch-depth: 0 # movement baselines + row-drop baseline + refresh-base ancestry check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Git identity
        run: |
          git config user.name "Riley"
          git config user.email "120138825+riles22@users.noreply.github.com"

      # Overlays the agents' data/ + skill logs onto the fresh checkout.
      - name: Refuse stale refresh output before overlay
        env:
          REFRESH_BASE_SHA: ${{ github.sha }}
        run: node src/check-refresh-base.mjs

      - name: Download refresh output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-refresh
          path: .

      # The evidence copy the gate trusts: uploaded by the deterministic fetch step
      # BEFORE any agent ran (the agents' working-tree copy travels nowhere). A
      # missing artifact fails this step — and therefore the publish — by design.
      - name: Download WCL fetch evidence (pre-agent artifact)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wcl-evidence
          path: wcl-fetch

      # Same trust construction as the WCL evidence: the gate reads the pre-agent copy,
      # not the working tree the agents could edit. A missing artifact fails the publish
      # by design — the fetch step always writes evidence, so absence means the step
      # itself was skipped or broke.
      - name: Download published-date evidence (pre-agent artifact)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-evidence
          path: published-evidence

      # Download these AFTER untrusted refresh output, from fixed pre-agent producers.
      - name: Download trusted stable metric receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-metrics
          path: metrics-fetch

      - name: Download trusted official note receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: official-notes
          path: official-notes

      # Gate 0 (2026-07-18 portfolio audit): the refresh artifact may deliver VALUES,
      # never the rules that judge them. Before this guard, the agent-overlaid working
      # tree was also where check-refresh read its own contract — so a compromised or
      # confused agent could rewrite the gate's thresholds (or the tier scales, or
      # registry membership) in the same run those changes would excuse. Registry
      # files may change only in their agent-updatable fields; contract/scale changes
      # ship via reviewed commits to master and fail the night RED here. Agent-shipped
      # history snapshots are RESET, not failed (CLAUDE.md tells refreshes to snapshot,
      # so an agent doing that is compliant, not hostile) — the movement/anomaly
      # baseline must come from committed history, and publish derives its own
      # snapshot after the gates either way.
      - name: "Gate 0: agent output stays inside its boundaries"
        run: |
          set -euo pipefail
          # Apply community overrides FIRST, so the community.json this gate inspects is
          # the effective post-override file. Gate 1's prevalidate and Gate 2's prebuild
          # both run this applier, and it injects creators — so before this line an agent
          # could edit the (unchecked) overrides registry and have membership changes
          # land in community.json *after* the boundary check had already passed
          # (audit 2026-07-24, A2). On a normal night this is a no-op: the committed
          # community.json already has the owner's reviewed overrides applied.
          node src/apply-community-overrides.mjs
          # data/season-final.json is a DERIVED, APPEND-ONLY record: each source's last
          # letters about the live season, lifted from the commit that still described it.
          # It feeds the published consensus directly (normalize.mjs's frozen lane), so an
          # agent able to write it could change any published letter while every other gate
          # stayed green. It is produced by the deterministic freeze step BELOW this gate,
          # never by the refresh agent — so at this point it must be byte-identical to HEAD.
          # data/forecasts/ holds the IMMUTABLE frozen-forecast artifacts — the record a
          # post-launch audit re-derives the grade from (git SHA, data hash, all 80 cells with
          # their component values). Written once by `snapshot.mjs --frozen`, an owner action,
          # and read by the report card. Publish stages `git add data/` wholesale, so without
          # this line an agent-written file under data/forecasts/ would be committed silently
          # and the graded forecast could be rewritten after the fact — the one corruption
          # nothing downstream can detect. No automated path writes it today; this is the
          # boundary made explicit rather than an observed defect.
          # data/season-archive/ holds the frozen per-season FINAL STANDINGS records
          # (src/freeze-season-archive.mjs, one-shot owner action; DECISION 6) — each is
          # rendered verbatim as a public archive page every build, so an agent able to
          # write one could rewrite a finished season's published record.
          if ! git diff --quiet HEAD -- data/required-sources.json data/scales.json data/season-final.json data/forecasts/ data/season-archive/; then
            git --no-pager diff HEAD -- data/required-sources.json data/scales.json data/season-final.json data/forecasts/ data/season-archive/
            echo "::error::refresh artifact modified the gate contract, tier scales, the frozen-season archive, a frozen forecast or a season-archive record — these ship only via reviewed commits or the deterministic freeze step"
            exit 1
          fi
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const changedBeyond = (file, volatile) => {
              const strip = (d) => JSON.parse(JSON.stringify(d, (k, v) => (volatile.includes(k) ? undefined : v)));
              const head = JSON.parse(execSync(`git show HEAD:${file}`, { encoding: "utf8" }));
              const now = JSON.parse(fs.readFileSync(file, "utf8"));
              return JSON.stringify(strip(head)) !== JSON.stringify(strip(now));
            };
            const bad = [];
            // Page OBSERVATIONS the refresh is supposed to record, vs registry STRUCTURE it is not.
            // `snapshot` = when we fetched. `published` = the date the page states about itself
            // (docs/published-gate-scope.md). `seasonVerified` = which season the page described at
            // refresh, the era-verify observation (S2 transition, DECISION 1). All three are written
            // by the era-verify/fetch steps, validated in src/validate.mjs (published: ISO and never
            // newer than snapshot; seasonVerified: "s1"|"s2", a typo fails red), and none of them can
            // add or remove a source. Membership, urls, kind, scale and era stay owner-only.
            // Added 2026-08-05: seasonVerified was unwritable, so 0 of 55 pages carried it and the
            // transition-window consensus rule (sourceSeasonOk) had no data to act on — it would have
            // silently no-opped at the S2 flip, exactly the failure it exists to prevent.
            if (changedBeyond("data/sources.json", ["snapshot", "published", "seasonVerified"])) bad.push("data/sources.json (beyond page snapshot/published/seasonVerified)");
            if (changedBeyond("data/community.json", ["latest", "verifiedDate"])) bad.push("data/community.json (membership/links, beyond latest+verifiedDate)");
            if (bad.length) { console.error(`::error::refresh artifact changed ${bad.join(" and ")} — registry edits ship only via reviewed commits to master`); process.exit(1); }
          '
          # SKILL-LOG CHURN — a WARNING, deliberately not a gate (audit 2026-08-14).
          # `.claude/skills/*/log.md` is staged and committed by publish, but Gate 0 only ever
          # looked at data/ — so the one class of agent output nothing checked is the prose every
          # FUTURE agent reads as precedent. A wrong standing note ("source X is unreachable,
          # skip it") steers every later run and, unlike a data edit, leaves no validation trace.
          #
          # It is NOT an error, and the reason is measured rather than cautious. Three things the
          # logs legitimately do would each trip a strict gate: entries are inserted NEWEST-FIRST
          # under a header (so "append-only as a prefix" is simply the wrong shape — it fails on
          # 7 of the last 56 real transitions), old entries are PRUNED by design ("keep the newest
          # ~20 entries"), and entries are occasionally REVISED with a dated correction, which is
          # honest self-correction and the behaviour we want.
          #
          # THRESHOLD RECALIBRATED 2026-08-15, because the first real prune falsified the first
          # calibration. The original 50% was justified with "the logs hold 32-40 entries, so a
          # prune drops near half" — that entry count was simply WRONG (a `^- 20` grep undercounted;
          # they held 64-78), and the 08-15 prune retained 42% on watch-creators/log.md. So the
          # rule fired on precisely the operation it was written to tolerate, and it will do so on
          # every future prune, not once.
          # Re-measured across all 336 real log transitions in history: the lowest legitimate
          # all-lines retention is the prune's 42%, while a wholesale rewrite scores ~0%. 20% sits
          # between with margin on both sides.
          # A "newest-K lines" variant was tried FIRST and is REFUTED — do not re-propose it. The
          # idea was sound (a prune removes the OLDEST entries, a rewrite alters the NEWEST) but
          # the 08-15 prune also RE-SORTED the files (refresh-tiers was chronologically scrambled),
          # so the old file's leading lines were not its newest: newest-120 retention fell to 1%
          # for refresh-tiers and 16% for ptr-watch, destroying the separation the whole idea
          # depended on. Measured, not argued.
          # Filename admission is strict even though content churn only warns. The
          # helper passes literal argv to Git and admits only HEAD's existing logs.
          node src/check-skill-logs.mjs
          # Gate 0 diffs files it knows about; anything the artifact ADDS under data/ was
          # invisible to it and would be committed unreviewed (audit 2026-07-24, S6).
          # history/ is reset just below, so nothing legitimate trips this.
          if git status --porcelain -- data/ | grep -E '^\?\?' | grep -v ' data/history/' | grep -q .; then
            git status --porcelain -- data/ | grep -E '^\?\?' | grep -v ' data/history/'
            echo "::error::refresh artifact added new file(s) under data/ — new data files ship via reviewed commits to master"
            exit 1
          fi
          if git status --porcelain -- data/history/ | grep -q .; then
            echo "Resetting agent-supplied data/history/ changes — the baseline must be committed history, and publish snapshots after the gates:"
            git status --porcelain -- data/history/
            git checkout HEAD -- data/history/
            git clean -fdq -- data/history/
          fi

      # Freeze any outlet that moved to the next season TONIGHT, before the build reads it.
      # Runs after Gate 0 (so the seasonVerified observations it keys on have already
      # cleared the boundary check) and before Gate 1 (so the tests and the build see the
      # frozen letters, not a consensus that has silently lost a contributor).
      #
      # Deterministic and append-only: it derives the freeze point from git history — the
      # newest commit whose own data/sources.json still verified that page at the live
      # season — and never rewrites an existing record. Without it, an outlet flipping
      # mid-window drops out of the mean, which publishes as spec movement nobody wrote
      # (16 cells the night Wowhead flipped) and, if every outlet flips before the phase
      # flip, blanks the column entirely (measured: 80 of 80 cells null).
      #
      # This needs real history, which is why it lives in publish (fetch-depth 0) and not
      # in the refresh job (fetch-depth 1). A shallow checkout cannot answer the question
      # at all, so fail loudly rather than write a wrong or empty record.
      - name: Freeze final-season letters for any outlet that moved ahead
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count HEAD)" -le 5 ]; then
            echo "::error::shallow checkout — freeze-season needs full history to derive a freeze point"
            exit 1
          fi
          node src/freeze-season.mjs
          if ! git diff --quiet -- data/season-final.json; then
            echo "::notice::froze final-season letters for an outlet that moved ahead this run"
            git --no-pager diff --stat -- data/season-final.json
          fi

      - name: Show what the refresh changed
        run: git status --porcelain && git --no-pager diff --stat || true

      # Local consistency only: preserves original weapon/armor/fallback source dates.
      # Runs in the trusted publish stage, never accepts gearing files from an agent.
      - name: Synchronize gearing capabilities from verified local inputs
        run: |
          node gearing/src/harvest-specs.mjs
          node gearing/src/harvest-specs.mjs --check
          npm run gearing:build

      - name: "Gate 1: validate + unit tests"
        run: npm test

      - name: Verify collected metrics and complete official note intake
        run: |
          node src/check-stable-metrics.mjs --manifest data/run-manifest.json
          node src/check-official-notes.mjs

      - name: "Gate 2: build"
        run: npm run build

      - name: "Gate 3: refresh contract (manifest · completeness · anomaly · WCL evidence)"
        env:
          # HUMAN-ONLY overrides: empty on scheduled runs; a person supplies them
          # via Run workflow after reviewing what the gate blocked. The agent-written
          # manifest can only PROPOSE (anomalyAckProposal), which check-refresh prints
          # for that person — it never satisfies either gate. The two are separate
          # inputs so approving a tier retune cannot waive unrelated value findings.
          ANOMALY_ACK: ${{ inputs.anomaly_ack }}
          VALUE_MOVE_ACK: ${{ inputs.value_move_ack }}
        run: |
          # The agents must have REWRITTEN the manifest this run. An unchanged file
          # means the run free-rode on the previous record instead of doing
          # verifiable work (first shakeout, 2026-07-14).
          if git diff --quiet -- data/run-manifest.json; then
            echo "::error::data/run-manifest.json is unchanged from the committed copy"
            exit 1
          fi
          node src/check-refresh.mjs --manifest

      - name: Snapshot movement baseline
        id: snap
        run: |
          if git status --porcelain -- data/ | grep -v "data/run-manifest.json" | grep -q .; then
            node src/snapshot.mjs
            echo "wrote=1" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes beyond the run manifest — no snapshot"
          fi

      # Gate 2 built dist BEFORE the snapshot above existed, so the dist we were about to
      # commit always stopped one day short in the drawer Timeline — a permanent lag, since
      # every night repeats it. Rebuilding here picks the new point up.
      #
      # This cannot move anything else: pickBaseline deliberately SKIPS snapshots identical
      # to the present state (that is what it was written for — post-refresh snapshots), and
      # a snapshot written seconds ago from this very data IS the present state. So the
      # baseline, every tier arrow, every rank delta and the whole projection lane are
      # unchanged; only `history` gains its missing point.
      #
      # It must stay AFTER the gates, not before: Gate 3's anomaly check compares the current
      # consensus against the newest committed snapshot, so gating after snapshotting would
      # compare tonight's data against itself and could never fire.
      - name: Rebuild dist so the Timeline includes tonight's snapshot
        if: steps.snap.outputs.wrote == '1'
        run: npm run build

      - name: Commit and push explicit paths
        id: commit
        run: |
          set -euo pipefail
          node src/check-skill-logs.mjs --stage
          git add -- gearing/data/specs.json gearing/wow-s2-gearing.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --quiet -- data/ dist/ ':(exclude)data/run-manifest.json'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
          # Commit title comes from the agent-written manifest summary — sanitized to
          # one printable ASCII line, hard-capped (it originated from untrusted web content).
          SUMMARY="$(node -e 'const m=JSON.parse(require("fs").readFileSync("data/run-manifest.json","utf8")); console.log(String(m.summary??"refresh").replace(/[^\x20-\x7E]/g," ").replace(/\s+/g," ").trim().slice(0,180))')"
          git commit -m "Nightly refresh $(date -u +%F): ${SUMMARY}" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          if ! git push origin master; then
            # A manual update can change source code or gearing inputs after our gates.
            # Replaying only the HTML build after a rebase would publish an untested tree.
            echo "::error::Publish push rejected; re-run the full refresh against current master. No force push or partial revalidation."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes don't auto-trigger `on: push` workflows (GitHub loop
      # protection), so dispatch the deploy explicitly when site inputs changed.
      - name: Trigger Pages deploy when site inputs changed
        if: steps.commit.outputs.pushed == 'true' && steps.commit.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master

      # Same reason, different gap: the 26 UI invariants in test/ui-invariants.test.mjs are
      # the only tests that execute template.html's client JS, and they need Playwright,
      # which this job deliberately does not have — so `npm test` above passed them as
      # SKIPPED and exit 0. Combined with the no-auto-trigger rule that meant no nightly
      # commit had ever been checked against them. Dispatched here rather than gated on:
      # ci.yml states that the browser lives nowhere near the release path, and the owner
      # chose (2026-08-23) to keep that and accept finding out after the push instead.
      # continue-on-error because a dispatch hiccup must never redden a good publish — the
      # ci.yml run reddens on its own if the invariants actually fail.
      - name: Run the UI invariants against what we just pushed
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref master

      # Owner-facing change digest (owner-requested 2026-07-17): deterministic diff
      # of the just-pushed commit vs its parent (same derivation the site uses),
      # posted as a comment on the pinned "Nightly digest" issue — GitHub's own
      # notification mail delivers each comment to issue subscribers. No AI, no
      # credentials beyond GITHUB_TOKEN; a digest hiccup never reddens a good publish.
      - name: Post run digest to the pinned issue
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node src/digest.mjs HEAD^ HEAD > "$RUNNER_TEMP/digest.md"
          num="$(gh issue list --state open --search "in:title \"Nightly digest\"" --json number --jq '.[0].number // empty')" || num=""
          if [ -z "$num" ]; then
            url="$(gh issue create --title "Nightly digest — per-run change summaries" \
              --body "Automated per-run change digests (tier moves, new creator takes, new PTR builds, health) land as comments here — @riles22 stay subscribed to this issue to receive each one by email. Closing it just rotates the thread (the next publish opens a fresh one); to stop digests entirely, remove the 'Post run digest' step from nightly.yml, or use this issue's Unsubscribe button to silence the emails.")"
            num="${url##*/}"
          fi
          gh issue comment "$num" --body-file "$RUNNER_TEMP/digest.md"

      # A failed publish used to reach the owner as a bare "workflow failed" email, with
      # the actual reason only in job logs that need an interactive download. The gates
      # already print their real reason to stdout; capture it and post it where the
      # digest goes, so a red night explains itself in the same inbox as a green one.
      #
      # SCOPE, precisely (audit 2026-07-25): this is a STEP-level `if: failure()`, so it
      # covers a gate failing inside this job, and a `refresh` job that fails or times out
      # (publish is `if: !cancelled()`, so it still starts and its first step fails).
      # It does NOT cover the 2026-07-25 incident itself — a publish job GitHub never
      # assigned a runner to. No step in a job that never started can report anything, so
      # that mode is covered by the freshness heartbeat instead: `maxRunAgeHours: 28` turns
      # a missed night into a red run plus an alert issue roughly 5h later. Run-level
      # coverage would need a separate `workflow_run`-triggered workflow.
      - name: Report a failed publish to the pinned issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          {
            echo "### ❌ Nightly publish failed"
            echo
            echo "The nightly publish job failed. The full log records whether a commit"
            echo "or deployment completed before the failure."
            echo
            echo "[Full job log]($RUN_URL)"
            echo
            echo "Re-running each gate here so the reason is in this thread:"
            echo
            echo '```'
            echo "--- Gate 0 (boundary): files the artifact changed ---"
            git status --porcelain -- data/ 2>&1 | head -40 || true
            echo
            echo "--- Gate 1 (validate + tests) ---"
            npm test 2>&1 | tail -25 || true
            echo
            echo "--- Gate 2 (build) ---"
            npm run build 2>&1 | tail -8 || true
            echo
            echo "--- Gate 3 (refresh contract) ---"
            node src/check-refresh.mjs --manifest --wcl-evidence=wcl-fetch/evidence.json 2>&1 | tail -30 || true
            echo
            echo "--- Deterministic numeric collection ---"
            node src/check-stable-metrics.mjs --manifest data/run-manifest.json 2>&1 | tail -20 || true
            echo
            echo "--- Official-note revision intake ---"
            node src/check-official-notes.mjs 2>&1 | tail -20 || true
            echo '```'
          } > "$RUNNER_TEMP/failure.md"
          num="$(gh issue list --state open --search "in:title \"Nightly digest\"" --json number --jq '.[0].number // empty')" || num=""
          [ -n "$num" ] && gh issue comment "$num" --body-file "$RUNNER_TEMP/failure.md" || true
