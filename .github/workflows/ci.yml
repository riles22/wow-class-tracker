name: Tests

# Validate every push and pull request with the same plain-Node test/build path
# used by the Pages deployment. This catches schema, integration, and generated
# artifact failures before changes reach master.

on:
  push:
  pull_request:
  # Dispatchable so the nightly can run this AFTER its own push. A GITHUB_TOKEN push does
  # not trigger `on: push` (GitHub loop protection), so without this the 26 UI invariants
  # never ran on a nightly commit — and they skip themselves silently when playwright is
  # absent, so the nightly's own `npm test` went green with 27 skipped. Owner decision
  # 2026-08-23: dispatch after publish rather than gating publish on a browser, which keeps
  # the deliberate posture that Playwright lives nowhere near the release path.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact published commit to test (defaults to the triggering commit)"
        required: false
        type: string

env:
  CI_SHA: ${{ inputs.commit_sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10    # backstop: the job takes about a minute, and GitHub's default is 6 hours
    steps:
      - name: Validate test commit
        run: |
          if ! [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Test commit must be a full 40-character SHA."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SHA }}
      - name: Confirm test checkout
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$CI_SHA"
          printf 'Test checkout commit: `%s`\n\nWorkflow trigger commit: `%s`\n' "$ACTUAL_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate and test
        run: npm test
      - name: Build production artifact
        run: npm run build
      - name: Sanity-check generated site
        run: |
          test -s dist/index.html
          git diff --check

  # The client half of the product — ~1,400 lines of JavaScript in src/template.html —
  # has no coverage in the job above, because `npm test` is deliberately dependency-free
  # (zero npm deps, nothing to poison) and the nightly publish gate runs it on a clock.
  # Playwright therefore lives HERE and nowhere else: a separate, non-publishing job that
  # installs it fresh, so the invariants get exercised on every push without putting a
  # browser download or a dependency tree anywhere near the release path.
  # test/ui-invariants.test.mjs skips itself when playwright is absent, so the job above
  # stays green and fast.
  ui-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30    # backstop: the install steps bound themselves, and a healthy job takes 1 to 3 minutes
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Validate test commit
        run: |
          if ! [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Test commit must be a full 40-character SHA."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SHA }}
      - name: Confirm browser test checkout
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$CI_SHA"
          printf 'Browser test checkout commit: `%s`\n\nWorkflow trigger commit: `%s`\n' "$ACTUAL_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the artifact under test
        run: npm run build
      - name: Install Playwright (not saved — never becomes a repo dependency)
        run: npm install --no-save playwright@1.61.1
      # apt fetches the browser's system packages, and the runner's mirror sometimes trickles
      # them for a whole job: on 2026-10-26 azure.archive.ubuntu.com sent WebKit's 107 MB in
      # 49m46s (35.8 kB/s) while other runners in the same runs took seconds. The image falls
      # back to archive.ubuntu.com only when a fetch fails, and a trickle never fails. So the
      # downloads run in bounded attempts, with apt in download-only mode so a kill can never
      # interrupt dpkg. Each retry keeps the files earlier attempts finished and drops the
      # Azure mirror from the image's list. The install then runs once, from apt's cache.
      # The attempts run as root so the kill reaches apt-get. As the runner user, Playwright
      # starts apt-get through its own sudo, and a kill from outside that sudo left apt-get
      # running and holding apt's lock against the retry.
      - name: Install the browser's system packages (downloads bounded and retried)
        timeout-minutes: 14
        run: |
          only=/etc/apt/apt.conf.d/zz-ci-download-only
          echo 'APT::Get::Download-Only "true";' | sudo tee "$only" > /dev/null
          for attempt in 1 2 3; do
            rc=0
            sudo env "PATH=$PATH" timeout --kill-after=10s "$([ "$attempt" = 1 ] && echo 8s || echo 3m)" npx playwright install-deps "$PLAYWRIGHT_BROWSER" || rc=$?
            if [ "$rc" = 0 ]; then break; fi
            case "$rc" in 124|137) why="ran past 3 minutes";; *) why="failed with exit $rc";; esac
            echo "::warning::Attempt $attempt of 3 to download the $PLAYWRIGHT_BROWSER system packages $why."
            sleep 1; pgrep -a apt-get || echo "TEMP: no apt-get left after attempt $attempt"
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not download the $PLAYWRIGHT_BROWSER system packages in three attempts."
              exit 1
            fi
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || echo "::notice::No apt mirror list to change; the retry uses the same mirrors."
          done
          sudo rm "$only"
          npx playwright install-deps "$PLAYWRIGHT_BROWSER"
      # Playwright's CDN has sent every browser in seconds so far. The bound and one retry keep
      # a stalled download from holding the job.
      - name: Download the browser (bounded and retried)
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            rc=0
            timeout --kill-after=10s "$([ "$attempt" = 1 ] && echo 2s || echo 3m)" npx playwright install "$PLAYWRIGHT_BROWSER" || rc=$?
            if [ "$rc" = 0 ]; then exit 0; fi
            case "$rc" in 124|137) why="ran past 3 minutes";; *) why="failed with exit $rc";; esac
            echo "::warning::Attempt $attempt of 2 to download $PLAYWRIGHT_BROWSER $why."
          done
          echo "::error::Could not download $PLAYWRIGHT_BROWSER in two attempts."
          exit 1
      - name: UI invariants
        run: node --test test/ui-invariants.test.mjs test/forecast-report-ui.test.mjs test/season-archive-ui.test.mjs gearing/test/ui-invariants.test.mjs

  # The publishers dispatch this workflow as github-actions[bot] after each push, and
  # GitHub emails nobody when such a run fails. This last job comments on issue 15
  # instead. dispatched-run-alert.yml explains the gate and why it is not workflow_run.
  dispatched-run-alert:
    needs: [test, ui-invariants]
    if: ${{ !cancelled() && github.triggering_actor == 'github-actions[bot]' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      issues: write
    uses: ./.github/workflows/dispatched-run-alert.yml
    with:
      needs_json: ${{ toJSON(needs) }}
      commit_sha: ${{ inputs.commit_sha || github.sha }}
