name: Build & deploy tracker to GitHub Pages

# The site is data/*.json compiled by src/build.mjs into a single self-contained
# dist/index.html. This workflow rebuilds from source on every push to master (so the
# nightly wow-ptr-watch refresh, which commits + pushes, auto-deploys) and can be run
# by hand. No dependencies to install — the build is plain Node.
# Actions are pinned to commit SHAs (tag comments alongside) — supply-chain hygiene for
# a workflow that runs unattended nightly.

on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
      # The gearing subproject is part of the deployed site (its artifact ships as
      # dist/gearing.html), but this filter predated the 2026-08-04 merge — so a
      # gearing-only change (e.g. the 08-05 trinket disclaimer, PR #46) silently never
      # redeployed and had to be dispatched by hand. Found 2026-08-05 while verifying
      # that deploy on the live site.
      - "gearing/**"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact published commit to build and verify (defaults to the triggering commit)"
        required: false
        type: string

# A branch dispatch immediately after a push can resolve an older event SHA.
# Publishers provide their exact committed SHA; push events use their own SHA.
env:
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

# One deploy at a time; per GitHub's Pages guidance, let in-flight deploys finish
# rather than cancelling them mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate deployment commit
        run: |
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment commit must be a full 40-character SHA."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Confirm build checkout
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$DEPLOY_SHA"
          printf 'Build commit: `%s`\n\nWorkflow trigger commit: `%s`\n' "$ACTUAL_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate + test data
        run: npm test
      - name: Build dist/index.html
        run: npm run build
      - name: Sanity-check the artifact exists
        run: test -s dist/index.html
      - name: Record expected page hashes for this build commit
        run: node src/verify-deployment.mjs --create --dist dist --manifest "$RUNNER_TEMP/deployment-expected.json" --sha "$DEPLOY_SHA"
      - name: Preserve trusted verification manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-expected-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment-expected.json
          retention-days: 7
          if-no-files-found: error
      - name: Warn if the committed dist drifted from the rebuilt one (non-fatal)
        run: |
          if ! git diff --quiet -- dist/index.html; then
            echo "::warning::committed dist/index.html differs from the CI rebuild — it was likely committed from stale data or never rebuilt; the DEPLOYED site uses the fresh build, but the committed copy is misleading."
          fi
      - name: Configure Pages (auto-enables on first run)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      # GitHub Pages' deploy API occasionally returns a transient "Deployment failed, try
      # again later" even though the build + artifact upload succeeded. Retry up to 3 times
      # with backoff before failing the run; the first success short-circuits the rest.
      - name: Deploy to GitHub Pages (attempt 1)
        id: d1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - name: Back off before retry
        if: steps.d1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - name: Back off before final retry
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 40
      - name: Deploy to GitHub Pages (attempt 3, final)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # This plain-Node job remains inside the workflow-wide Pages concurrency lock,
  # so a newer deployment cannot replace the site while these hashes are checked.
  # Expected hashes come from THIS run's trusted build artifact, never the website.
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate deployment commit
        run: |
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment commit must be a full 40-character SHA."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Confirm verification checkout
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Download this build's expected hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployment-expected-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment-verification
      - name: Verify all three public pages match this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node src/verify-deployment.mjs --manifest "$RUNNER_TEMP/deployment-verification/deployment-expected.json" --sha "$DEPLOY_SHA" --url "$PAGE_URL"
          printf 'Verified public deployment commit: `%s`\n\nWorkflow trigger commit: `%s`\n' "$DEPLOY_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
