name: Data freshness heartbeat

# The 2026-07-09→07-12 nightly gap and the quietly-stale sources the external audit
# flagged were only findable by reading workflow logs. This heartbeat makes absence
# itself visible: once a day (after the nightly window) it checks the COMMITTED
# state — how old the last refresh signal is (manifest startedAt at full-timestamp
# precision), and every required source's data age against
# data/required-sources.json — and on any violation maintains ONE alert issue.
# Issue lifecycle (re-audit 2026-07-14, unchanged): body refreshed daily while stale,
# comment only when the violating set changes (fingerprint), auto-close on recovery.
# Staleness alerts fire even when the nightly EXPLAINED the staleness (e.g. WCL
# unreachable from runner IPs): the alert is visibility, not blame, and maps to the
# audit's "alert when a high-value source exceeds its age".
#
# RUN COLOUR (owner decision 2026-09-25, "red on new problems + weekly"). Until then the
# run went red on EVERY stale day. A failed scheduled run is what emails the owner, so
# standing accepted conditions kept it red daily and a genuinely new problem arrived
# inside an already-red signal. The issue still lists every stale key every day; the RUN
# is red only when one of these rules fires, and its last step names which:
#   new keys     a fingerprint key absent from the previous fingerprint (the marker in
#                the open issue). No open issue or no readable marker = every key is new.
#   pipeline     PIPELINE_KEYS below is present — red every day it stays present.
#   fail-closed  check-refresh crashed or exited without a usable report, or reported
#                stale with an empty or "clean" fingerprint.
#   weekly       a Monday (UTC, `date -u +%u` = 1) run with any key outside
#                ACCEPTED_KEYS below. The weekday is read when the run EXECUTES, not
#                for its cron slot: 2 of this heartbeat's 74 scheduled runs since
#                2026-07-14 (the 08-27 and 08-28 slots) started 8h09m and 7h37m late,
#                which from 19:23 crosses UTC midnight, and Monday 08-31 started 4h33m
#                late. A Monday run delayed past midnight skips that week's reminder.
# Otherwise a stale run SUCCEEDS with a ::warning:: and the full report in its log.

on:
  schedule:
    # 19:23 UTC, moved from 17:23 on 2026-09-25 so a late nightly has published before
    # this reads the committed state. Measured: the nightly's 17 scheduled runs among its
    # last 20 (2026-09-09..09-25) started 13:43-16:34 UTC against a 10:37 cron and all
    # finished by 16:54; GitHub started this heartbeat's last 20 runs (2026-09-06..09-25)
    # 1h54m-3h45m after its 17:23 cron. Odd minute for the same congestion reason as the
    # nightly. The single-miss margin arithmetic lives in CLAUDE.md.
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # ACCEPTED standing conditions: the ONE place they are defined. Each is still listed in
  # the alert issue every day, and still turns the run red on the day it is NEW; only the
  # Monday reminder skips them. An anchored ERE matched against each key.
  #   archon-*         Archon's human-verification wall. Its last verified letters stay in
  #                    the consensus under the owner-confirmed 2026-09-05 retention policy
  #                    (refresh-tiers SKILL.md).
  #   wcl-live-raid    No verified sanctioned WCL endpoint serves exact aggregate medians;
  #   wcl-live-mplus   both stay honestly unreachable (CLAUDE.md, WCL correction 2026-09-05).
  # Deliberately NOT accepted: wowmeta (owner note 2026-08-21 on its row in
  # data/required-sources.json: do not ack it away, do not raise maxAgeDays) and every
  # other key.
  ACCEPTED_KEYS: "^(archon-.+|wcl-live-raid|wcl-live-mplus)$"
  # Keys that mean the pipeline itself is down or an owner deadline has passed (pushed by
  # checkFreshness in src/check-refresh.mjs): a missed nightly, the phase-flip gate, the
  # minSuccessfulSources restore gate, the in-season patch-label gate (2026-09-26).
  PIPELINE_KEYS: "^(run-age|snapshot-phase|min-sources-floor|live-patch-label)$"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # bash -eo pipefail. Every pipeline below is written for it: readers consume all
        # of their input, and grep's no-match status is handled explicitly.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check committed-data freshness
        id: check
        run: |
          rc=0
          node src/check-refresh.mjs --age > freshness-report.txt 2>&1 || rc=$?
          cat freshness-report.txt
          # Stable violation fingerprint (sorted keys) — the alert issue comments only
          # when THIS changes, not on every daily re-check (re-audit: no unbounded
          # daily comments on one standing issue).
          fp="$(sed -n 's/^fingerprint=//p' freshness-report.txt | tail -n 1)"
          # Usable = check-refresh's own contract for a stale result: exit 1 AND a
          # non-empty key list. A crash (also exit 1, but no fingerprint line), a usage
          # error (exit 2) or a stale exit whose fingerprint is empty or "clean" is not
          # usable, and the colour step fails closed on it.
          usable=false
          if [ "$rc" -eq 1 ] && [ "$fp" != clean ] && [[ "$fp" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]]; then
            usable=true
          fi
          if [ "$rc" -eq 0 ]; then stale=false; else stale=true; fi
          {
            echo "stale=${stale}"
            echo "rc=${rc}"
            echo "usable=${usable}"
            echo "fingerprint=${fp}"
          } >> "$GITHUB_OUTPUT"

      # One standing alert issue while stale: created on the first violation, body
      # refreshed (not commented) on unchanged staleness, a comment added only when
      # the violating set changes, and auto-closed by the step below on recovery.
      - name: Open or update the alert issue
        id: issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FP: ${{ steps.check.outputs.fingerprint }}
        run: |
          title="Data freshness alert (automated heartbeat)"
          marker="<!-- freshness-fingerprint: ${FP} -->"
          body="$(printf '%s\nThe freshness heartbeat found stale state at %s:\n\n```\n%s\n```\n\nSource: .github/workflows/freshness.yml → src/check-refresh.mjs --age (thresholds in data/required-sources.json). While staleness persists the body above is refreshed daily; a comment is added only when the set of stale sources changes. The heartbeat closes this automatically once everything is back within thresholds.' "$marker" "$(date -u +%FT%TZ)" "$(cat freshness-report.txt)")"
          num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" || num=""
          prev=""
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "$body"
          else
            # `sed -n 1p`, not `head -1`: it reads to EOF, so nothing upstream can take a
            # SIGPIPE under pipefail.
            prev="$(gh issue view "$num" --json body --jq .body | sed -n 's/^<!-- freshness-fingerprint: \(.*\) -->$/\1/p' | sed -n 1p)"
            gh issue edit "$num" --body "$body"
            if [ "$prev" != "$FP" ]; then
              gh issue comment "$num" --body "Stale-source set changed: \`${prev:-unknown}\` → \`${FP}\` — see the refreshed issue body for the current report."
            fi
          fi
          # The fingerprint the issue carried BEFORE this run, for the colour step. Empty
          # (no open issue, or no readable marker) means unknown: every key counts as new.
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"

      - name: Close the alert issue on recovery
        if: steps.check.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Data freshness alert (automated heartbeat)"
          num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" || num=""
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Recovered: the $(date -u +%FT%TZ) heartbeat found every source back within thresholds. Auto-closing."
            gh issue close "$num"
          fi

      # The run's colour (rules in the header). This `if:` names no status function, so
      # it carries an implicit success(): the step runs only when every earlier step
      # succeeded. The check step writes `stale` as its last command, so `stale` is
      # missing only when that step failed. That failure already reds the run, but this
      # step is then skipped and prints no rule line. When the step does run, an `rc` or
      # fingerprint that is not usable fails closed below.
      - name: Decide the run colour
        if: steps.check.outputs.stale != 'false'
        env:
          FP: ${{ steps.check.outputs.fingerprint }}
          RC: ${{ steps.check.outputs.rc }}
          USABLE: ${{ steps.check.outputs.usable }}
          PREV: ${{ steps.issue.outputs.prev }}
        run: |
          export LC_ALL=C # one collation for sort and comm
          # grep with "no match" as success and a real error (a malformed ACCEPTED_KEYS or
          # PIPELINE_KEYS) still a failure, so a broken pattern reds the run rather than
          # silently matching nothing.
          match() { local s=0; grep "$@" || s=$?; [ "$s" -le 1 ]; }
          keys_of() { tr ',' '\n' <<<"$1" | match -v '^$' | sort -u; }
          esc() { local s="${1//\%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }

          cat freshness-report.txt
          fired=()
          added="" pipeline="" unaccepted=""
          dow="$(date -u +%u)"
          if [ "$USABLE" != true ]; then
            fired+=("fail-closed: check-refresh --age exited ${RC:-?} without a usable report (fingerprint '${FP}'), so nothing about the stale set can be trusted")
          else
            keys="$(keys_of "$FP")"
            prev_keys="$(keys_of "$PREV")"
            added="$(comm -13 <(printf '%s\n' "$prev_keys") <(printf '%s\n' "$keys") | match -v '^$' | paste -sd, -)"
            pipeline="$(printf '%s\n' "$keys" | match -E "$PIPELINE_KEYS" | paste -sd, -)"
            unaccepted="$(printf '%s\n' "$keys" | match -v '^$' | match -vE "$ACCEPTED_KEYS" | paste -sd, -)"
            if [ -n "$added" ]; then fired+=("new keys: ${added}"); fi
            if [ -n "$pipeline" ]; then fired+=("pipeline keys: ${pipeline}"); fi
            if [ "$dow" = 1 ] && [ -n "$unaccepted" ]; then
              fired+=("weekly (Monday) reminder, keys outside ACCEPTED_KEYS: ${unaccepted}")
            fi
            if [[ ",${pipeline}," == *",run-age,"* ]]; then
              signal="$(sed -n 's/^ *last refresh signal: //p' freshness-report.txt | sed -n 1p)"
              echo "::error title=NIGHTLY MISSED::$(esc "run-age: the newest committed refresh signal (${signal:-none found}) is older than maxRunAgeHours in data/required-sources.json. The nightly has not published; check its workflow runs.")"
            fi
          fi

          echo "--- run colour (owner decision 2026-09-25)"
          echo "fingerprint before this run: ${PREV:-<unknown: every key counts as new>}"
          echo "fingerprint now:             ${FP:-<none>}"
          echo "new keys:                    ${added:-none}"
          echo "pipeline keys:               ${pipeline:-none}"
          echo "keys outside ACCEPTED_KEYS:  ${unaccepted:-none} (weekly rule on Mondays; ISO weekday today: ${dow})"
          if [ "${#fired[@]}" -gt 0 ]; then
            reason="$(printf '%s; ' "${fired[@]}")"
            echo "::error title=Freshness heartbeat RED::$(esc "Rule(s) fired: ${reason%; }")"
            exit 1
          fi
          echo "::warning title=Standing staleness (no rule fired)::$(esc "Every stale key was already in the previous fingerprint and none is pipeline-level (weekly rule: $([ "$dow" = 1 ] && echo 'Monday, only accepted keys remain' || echo 'not Monday')). They stay listed in the open Data freshness alert issue.")"
