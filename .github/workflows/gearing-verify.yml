name: Weekly gearing source verification

on:
  schedule:
    - cron: "37 8 * * 4" # Thursday 08:37 UTC; independent of Tuesday guide refresh.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Verify tier bonuses, Catalyst sources and loot in scratch
        id: sources
        continue-on-error: true
        timeout-minutes: 27
        run: node gearing/src/verify-sources.mjs --out "$RUNNER_TEMP/gearing-verification"
      - name: Preserve raw receipts and proposed source differences
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gearing-source-evidence
          path: ${{ runner.temp }}/gearing-verification/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish verification status without replacing game facts
        run: |
          cp "$RUNNER_TEMP/gearing-verification/report.json" gearing/data/source-verification.json
          cat "$RUNNER_TEMP/gearing-verification/summary.md" >> "$GITHUB_STEP_SUMMARY"
          npm run gearing:build
          npm test
          npm run build
          git diff --check
      - name: Commit validated source status
        id: publish
        run: |
          set -euo pipefail
          git config user.name "Riley"
          git config user.email "120138825+riles22@users.noreply.github.com"
          git add -- gearing/data/source-verification.json gearing/wow-s2-gearing.html dist/
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Verify gearing sources $(date -u +%F)"
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy and test published commit
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref master
          gh workflow run ci.yml --ref master
      - name: Surface source changes and unavailable evidence
        if: always() && steps.sources.outcome != 'success'
        run: |
          echo "::error::One or more gearing sources require review. Previous game facts and dates are retained; inspect the evidence artifact and published status."
          exit 1
