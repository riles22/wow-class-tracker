<script>WH.markup.printHtml("Gear represents one of the most important avenues towards strengthening your Beast Mastery Hunter by providing the majority of your stats, armor, and other gameplay elements such as procs and set bonuses.\r\n\r\nThis guide explains how to obtain the best gear for your Beast Mastery Hunter in [b]Midnight Season 2[/b] and how to determine whether an item is Best-in-Slot, an upgrade, or outright bad. It will help you identify the best pieces of gear from dungeons and raids in Midnight, whether they be weapons, trinkets, or armor. \r\n[center][wrapper width=80%]\r\n[nav]\r\n[nav-item=guide/classes/hunter/beast-mastery/overview-pve-dps]Overview[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/bis-gear]BiS Gear[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/rotation-cooldowns-pve-dps]Rotation[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/talent-builds-pve-dps]Talent Builds[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/enchants-gems-pve-dps]Consumables[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/stat-priority-pve-dps]Stats[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/basics icon=Inv_misc_groupneedmore]Basics[/nav-item]\r\n[/nav][/wrapper][/center]\r\nFor other Hunter specs, you can check our [url=guide/classes/hunter/marksmanship/bis-gear]Marksmanship Hunter BiS[/url] and [url=guide/classes/hunter/survival/bis-gear]Survival Hunter BiS[/url] pages for the most up-to-date information across the entire class.\r\n\r\n[toc]\r\n\r\n[h2 type=bar toc=\"Recommended Gear\"][icon name=inv_misc_orb_blue color=c3 inline=true size=medium type=round][/icon] Recommended Gear for Beast Mastery Hunter in Midnight Season 2[/h2]\r\nGearing and itemization are one of the most important aspects towards improving your character. Gear mainly comes from [url guide=33180]Raids[/url] on a weekly lockout, [url guide=33272]Mythic+ Dungeons[/url], or the [url guide=17592]Vault System[/url].\r\n[h3 toc=\"BiS Gear\"]What is the BiS Beast Mastery Hunter gear?[/h3]\r\nWhile raid drops are generally the most reliable way to obtain high item level gear, items from other sources can be just as good, if not better. As such, you should reference the [url=guide/classes/hunter/beast-mastery/stat-priority-pve-dps]stat priorities for Beast Mastery Hunter[/url] to help determine your own upgrade path based on what is available to you. [html]<a href=\"https://www.archon.gg/wow/builds/classes-and-specs\"><img\r\n       alt=\"\"\r\n       height=\"15\"\r\n       src=\"https://assets.rpglogs.com/img/archon/logo-64.svg\"\r\n       class=\"archon-logo-inline\"/> Archon</a>[/html] is a tool that can help determine which alternative gear options are available in any given slot, especially if you're unable to obtain a best-in-slot piece.\r\n\r\n\r\n\r\nAs [symbol=wow-hero-talent-pack-leader] [color=orange-gem]Pack Leader[/color], you want [b]Weapon Damage[/b], followed by [b]Agility[/b], then [b]Mastery[/b], [b]Critical Strike[/b], [b]Haste[/b] and finally [b]Versatility[/b] in every situation. Gear from [url guide=34252]Ula'tek[/url] provide a large amount of [b]Critical Strike[/b] and impact our other choices.\r\n\r\n[tabs uniform=true name=bis_items]\r\n\t[tab name=\"Overall BiS\" icon=8039569]\r\n\t[h3 toc=false][color=c3]Best in Slot Gear for Beast Mastery Hunter [/color][/h3]\r\n\r\nThis BiS list is based off a single-target situation. If building for the best Mythic+ setup, you'd want to swap a few of the [b]Haste/Mastery[/b] pieces with [b]Crit/Mastery[/b], for instance on the crafted gear.\r\n\r\n\t\t[center]\r\n\t\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c3][b]Slot[/b][/td]\r\n\t\t\t[td background=c3][b]Item[/b][/td]\r\n\t\t\t[td background=c3][b]Source[/b][/td]\r\n\t\t[/tr]\r\n\t\t[tr][td]Weapon[/td][td][item=268207 bonus=13848:13708][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[tr][td]Head[/td][td][item=271492 ][/td][td][url guide=34250]The Twin Fangs[/url][/td][/tr]\r\n\t\t[tr][td]Neck[/td][td][item=268265 bonus=13848:13708][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[tr][td]Shoulders[/td][td][item=271490 original-item=268231][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Cloak[/td][td][item=268253][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Chest[/td][td][item=271495 original-item=271876 bonus=13848:13708][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[tr][td]Wrist[/td][td][item=244584 bonus=13751:12497:13836:12384:8793][/td][td][skill=165][/td][/tr]\r\n\t\t[tr][td]Gloves[/td][td][item=271493 original-item=160213][/td][td][url guide=34260]King's Rest[/url][/td][/tr]\r\n\t\t[tr][td]Belt[/td][td][item=244581 bonus=13751:12497:13836:12384:8793][/td][td][skill=165][/td][/tr]\r\n\t\t[tr][td]Legs[/td][td][item=271491 original-item=268237][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Boots[/td][td][item=268233][/td][td][url guide=34249]Sszorak[/url][/td][/tr]\r\n\t\t[tr][td]Ring[/td][td][item=268249][/td][td][url guide=34248]Vashnik the Malignant[/url][/td][/tr]\r\n\t\t[tr][td]Ring[/td][td][color=q4][item=252258][/color][/td][td][url guide=33183]Voidscar Arena[/url][/td][/tr]\r\n\t\t[tr][td]Trinket (Raid only)[/td][td][item=270173][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Trinket (Alternative)[/td][td][item=270175][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[tr][td]Trinket (Alternative)[/td][td][item=270164][/td][td][url guide=34247]The Lost Explorers[/url][/td][/tr]\r\n\t\t[/table]\r\n\t\t[/center]\r\n\t\t[h3 toc=false][color=c3]Best Gear to Catalyze for Beast Mastery Hunter [/color][/h3]\r\nThe Matrix Catalyst is a powerful in-game system that converts non-tier set armor pieces into tier set armor pieces of the same type. In Season 2, catalyzed items will retain their stats, allowing players to target specific pieces of gear to catalyze. Below are the best items to catalyze for Beast Mastery Hunter:\r\n\t\t[grid align=centered no-margin=true column-width=300]\r\n[p]\r\n[large][b][color=c3]Head[/color][/b][/large]\r\n[center][icon-badge=270916 quality=4 tooltip=\"Cata_1_Tooltip\"][url guide=34250][large][b]The Twin Fangs[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c3]Shoulder[/color][/b][/large]\r\n[center][icon-badge=268231 quality=4 tooltip=\"Cata_2_Tooltip\"][url guide=34251][large][b]The Coiled Altar[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c3]Chest[/color][/b][/large]\r\n[center][icon-badge=271876 quality=4 tooltip=\"Cata_3_Tooltip\"][url guide=34252][large][b]Ula'tek[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c3]Gloves[/color][/b][/large]\r\n[center][icon-badge=160213 quality=4 tooltip=\"Cata_4_Tooltip\"][url guide=34260][large][b]King's Rest[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c3]Legs[/color][/b][/large]\r\n[center][icon-badge=268237 quality=4 tooltip=\"Cata_5_Tooltip\"][url guide=34251][large][b]The Coiled Altar[/b][/large][/url][/center]\r\n[/p]\r\n\r\n\r\n[/grid]\r\n\t[/tab]\r\n[/tabs]\r\n[pad]\r\nWondering which Enchants you should apply to your gear? Check out our Enchants & Consumables page for Beast Mastery Hunter.\r\n\r\n[center][cta-button=guide/classes/hunter/beast-mastery/enchants-gems-pve-dps color=c3 colortext icon=ui_profession_enchanting]Enchants and Consumables[/cta-button][/center]\r\n[html]<style>.archon-logo-inline {\r\n   width: 20px;\r\n   height: 20px;\r\n   display: inline;\r\n   margin-bottom: -3px;\r\n}\r\n\r\n\r\n.archon-section__banner {\r\n   position: relative;\r\n   width: 100%;\r\n   height: 90px;\r\n   border: 1px solid #242424;\r\n   background: linear-gradient(140deg, #060606 0%, #141414 100%);\r\n   font-size: 1.25rem;\r\n   font-weight: 700;\r\n   text-align: center;\r\n   text-wrap: balance;\r\n   text-shadow: rgba(0, 0, 0, 0) 0px 0px 1px, rgba(0, 0, 0, 0.8) 0px 1px 2px;\r\n   text-decoration: underline;\r\n   text-underline-offset: 5px;\r\n   text-decoration-thickness: 1px;\r\n   display: flex;\r\n   align-items: center;\r\n   justify-content: center;\r\n}\r\n\r\n\r\n@media (min-width: 1024px) {\r\n   .archon-section__banner {\r\n       font-size: 1.75rem;\r\n   }\r\n}\r\n\r\n\r\n.archon-section__banner-bg-1, .archon-section__banner-bg-2 {\r\n   position: absolute;\r\n   top: 0;\r\n   left: 0;\r\n   bottom: 0;\r\n   right: 0;\r\n   background-position: center;\r\n}\r\n\r\n\r\n.archon-section__banner-bg-1 {\r\n   mask-image: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(0, 0, 0, 1));\r\n   right: 70%;\r\n   background-position-x: 20px;\r\n   background-size: auto;\r\n   background-repeat: no-repeat;\r\n}\r\n\r\n\r\n.archon-section__banner-bg-2 {\r\n   background-size: cover;\r\n   transform: scaleX(-1);\r\n   mask-image: linear-gradient(to left, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 1));\r\n   filter: blur(4px);\r\n   left: 10%;\r\n}\r\n\r\n\r\n.archon-section__banner-content {\r\n   z-index: 1;\r\n   padding: 0 50px;\r\n}</style>\r\n[/html]\r\n\r\n[h3 type=bar toc=false]Learn About Popular Gear With Archon[/h3]\r\n\r\nGearing is a process that takes time and effort, even with powerful items being available from multiple sources. Over the course of acquiring gear, you may not have the best item available for every slot. [html]<a href=\"https://www.archon.gg\"><img\r\n       alt=\"\"\r\n       src=\"https://assets.rpglogs.com/img/archon/logo-64.svg\"\r\n       class=\"archon-logo-inline\"/> Archon</a>[/html] is a tool that compiles log data from thousands of players and shows [url=https://www.archon.gg/wow/builds/beast-mastery/hunter/raid/overview/mythic/all-bosses]the most popular builds and alternatives[/url]. At a glance, you can see what other players have done for different types of content.\r\n\r\n[html]\r\n<a href=\"https://www.archon.gg/wow/builds/beast-mastery/hunter/raid/gear-and-tier-set/mythic/all-bosses\"\r\n  target=\"_blank\">\r\n   <div class=\"archon-section__banner\">\r\n       <div class=\"archon-section__banner-bg-1\"\r\n            style=\"background-image: url('https://assets.rpglogs.com/img/archon/logo-64.svg');\"></div>\r\n       <div class=\"archon-section__banner-bg-2\"\r\n            style=\"background-image: url('https://www.archon.gg/_next/image?url=https%3A%2F%2Fassets.rpglogs.com%2Fimg%2Fwarcraft%2Fbuilds%2Fspecs%2Fhunter-3.jpg&amp;w=1080&amp;q=75');\"></div>\r\n       <div class=\"archon-section__banner-content\">Beast Mastery Hunter Popular Gear on Archon\r\n       </div>\r\n   </div>\r\n</a>\r\n[/html]\r\n\r\n[h2 toc=\"Raid Drops\" type=bar][icon name=Achievement_zone_frostfire color=c3 inline=true size=medium type=round][/icon] Best Gear from Raids for Beast Mastery Hunter in Midnight Season 2[/h2]\r\nRaids feature several powerful drops for Beast Mastery Hunter in Midnight Midnight Season 2 due to either having special item effects or being a powerful best-in-slot option. Below are the best items to target when entering [url guide=34224]The Venomous Abyss[/url] and [url guide=34240]The Tidebound Grotto[/url]:\r\n\r\n\t[center]\r\n\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c3][b][icon-badge=268207 quality=4 tooltip=\"Raid_1_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c3][b][icon-badge=270173 quality=4 tooltip=\"Raid_2_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c3][b][icon-badge=271876 quality=4 tooltip=\"Raid_3_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c3][b][icon-badge=268265 quality=4 tooltip=\"Raid_4_Tooltip\"][/b][/td]\r\n\t\t[/tr]\r\n\t[/table]\r\n\t[/center]\r\n[h2 toc=\"Mythic+ Drops\" type=bar][icon name=Inv_arathordungeon_fragment_color6 color=c3 inline=true size=medium type=round][/icon] Best Gear from Mythic+ for Beast Mastery Hunter in Midnight Season 2[/h2]\r\nMythic+ dungeons offer a method of target farming specific pieces of gear for Beast Mastery Hunter freely without a weekly lockout. Below are the best items to get from Mythic+:\r\n\r\n\t[center]\r\n\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c3][b][icon-badge=273784 quality=3 tooltip=\"Dung_1_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c3][b][icon-badge=252258 quality=3 tooltip=\"Dung_2_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c3][b][icon-badge=158366 quality=3 tooltip=\"Dung_3_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c3][b][icon-badge=159617 quality=3 tooltip=\"Dung_4_Tooltip\"][/b][/td]\r\n\t\t[/tr]\r\n\t[/table]\r\n\t[/center]\r\n[h2 toc=\"Trinkets\" type=bar][icon name=inv_10_dungeonjewelry_dragon_trinket_5_green color=c3 inline=true size=medium type=round][/icon] Best Beast Mastery Hunter Trinkets in Midnight Season 2[/h2]\r\n\r\nIn general, Beast Mastery has no specific preferences in terms of trinkets, it mostly enjoy the ones that provide the largest quantity of secondary stats, whether that be passive trinkets or on-use trinkets.\r\n\r\n\r\n\t[center][box][color=c3]Hover over trinkets to see notes on complex interactions![/color][/box][/center]\r\n\t[center]\r\n\t[h3 toc=false type=bar][color=c3] Trinket Tier List[/color][/h3]\r\n\r\n\t[wrapper width=95%]\r\n\t[grid width=95% align=centered]\r\n\t\t[display-option=raid icon=8039569 checked color=4]Raid[/display-option]\r\n\t\t[display-option=dungeon icon=inv_relics_hourglass checked color=3]Mythic Plus[/display-option]\r\n\t\t[display-option=delves icon=ui_delves checked color=2]Delves[/display-option]\r\n\t\t[display-option=crafting icon=inv_10_blacksmithing_consumable_repairhammer_color2 checked color=5]Crafting[/display-option]\r\n\t[/grid]\r\n\t[pad]\r\n\t[tier-list=rows grid]\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q5]S[/tier-label]\r\n\t\t\t[tier-content]\r\n[icon-badge=270173 quality=4 display-options=raid tooltip=axe]\r\n[icon-badge=270164 quality=4 display-options=raid tooltip=bag]\r\n[icon-badge=270175 quality=4 display-options=raid tooltip=heart]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q4]A[/tier-label]\r\n\t\t\t[tier-content]\r\n[icon-badge=159617 quality=3 display-options=dungeon tooltip=plumage]\r\n[icon-badge=273796 quality=3 display-options=dungeon tooltip=venom]\r\n[icon-badge=270165 quality=4 display-options=raid tooltip=core]\r\n[icon-badge=250215 quality=3 display-options=dungeon]\r\n\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q3]B[/tier-label]\r\n\t\t\t[tier-content]\r\n[icon-badge=270166 quality=4 display-options=raid]\r\n[icon-badge=250228 quality=3 display-options=dungeon]\r\n[icon-badge=193757 quality=3 display-options=dungeon tooltip=whelp]\r\n[icon-badge=246304 quality=5 display-options=crafting tooltip=darkmoon]\r\n\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q2]C[/tier-label]\r\n\t\t\t[tier-content]\r\n[icon-badge=274493 quality=2 display-options=delves]\r\n[icon-badge=273797 quality=3 display-options=dungeon]\r\n[icon-badge=250214 quality=3 display-options=dungeon tooltip=core]\r\n[icon-badge=250259 quality=3 display-options=dungeon]\r\n[icon-badge=250225 quality=3 display-options=dungeon]\r\n[icon-badge=158374 quality=3 display-options=dungeon]\r\n[icon-badge=246305 quality=5 display-options=crafting]\r\n[icon-badge=246307 quality=5 display-options=crafting]\r\n[icon-badge=274496 quality=2 display-options=delves]\r\n[icon-badge=274497 quality=2 display-options=delves]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q1]D[/tier-label]\r\n\t\t\t[tier-content]\r\n\r\n[icon-badge=241340 quality=5 display-options=crafting]\r\n[icon-badge=270168 quality=4 display-options=raid]\r\n[icon-badge=246306 quality=5 display-options=crafting]\r\n[icon-badge=280123 quality=2 display-options=delves]\r\n\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\t[/tier-list]\r\n\t[/wrapper]\r\n\t[/center]\r\n\r\n\r\n\r\n[h2 toc=\"Set Bonuses\" type=bar][icon name=Inv_chest_leather_draenorquest90_b_01 color=c3 inline=true size=medium type=round][/icon] Midnight Season 2 Tier Set Bonuses for Beast Mastery Hunter[/h2]\r\n\r\nThe 2-set bonus makes it so every [spell=199530] you trigger via [spell=217200] triggers a secondary Stomp at 50% effectiveness. This does not include the Stomp from [spell=459693] but will include your [spell=267116], causing a total of four Stomps with every Barbed Shot. This is worth 1.5% on Single-target and 4% on AoE. \r\n\r\nThe 4-set bonus makes it so that your Stomps cause your [spell=193455] to either benefit from [spell=115939] at 20% effectiveness, or deal 15% increased damage, depending on whether Beast Cleave is active or not. These effects increase stacks up to 4 times. This is worth 3% on Single-target and 7% on AoE.\r\n\r\nThis tier set bonus causes a minor rotational difference whenever your 4-set damage increase is active, causing you to prioritize Cobra Shot slightly higher than before. For more information, see the [url guide=3154]Rotation Page[/url].\r\n\r\n\r\n[pad]\r\n[quote type=box]\r\n[large]Skulking Viper's Ambush[/large]\r\n[ul][li][spell=1296631] - [spell=1296631 desc][/li]\r\n[li][spell=1296632] - [spell=1296632 desc][/li][/ul]\r\n[/quote]\r\n\r\n[center][h3 toc=false][color=c3][toggler id=\"appearances-1\" hidden] Season 2 Tier Set Appearances[/toggler][/color][/h3][/center]\r\n[div id=\"appearances-1\" hidden]\r\n[center]\r\n[h4 type=bar]PvE[/h4][grid column-width=300 align=centered]\r\n[div][screenshot id=1291066 width=300 size=normal alt=\"Hunter Season 1 Tier Set Raid Finder\"][/screenshot][br][center][b]Raid Finder[/b][/center][/div]\r\n[div][screenshot id=1291067 width=300 size=normal alt=\"Hunter Season 1 Tier Set Normal\"][/screenshot][br][center][b]Normal[/b][/center][/div]\r\n[div][screenshot id=1291068 width=300 size=normal alt=\"Hunter Season 1 Tier Set Heroic\"][/screenshot][br][center][b]Heroic[/b][/center][/div]\r\n[div][screenshot id=1291069 width=300 size=normal alt=\"Hunter Season 1 Tier Set Mythic\"][/screenshot][br][center][b]Mythic[/b][/center][/div]\r\n[/grid]\r\n[/center]\r\n[hr]\r\n[/div]\r\n[pad]\r\n[pad]\r\n\r\n\r\n\r\n[h2 type=bar toc=\"Crafted Gear\"][icon name=inv_12_profession_questandcrafting_sparkwhole_green size=medium type=round inline=true color=c3][/icon] Best Crafted Gear for Beast Mastery Hunter[/h2]\r\n[item=274476] is a weekly-gated resource that is required for crafting some of the most powerful equipment available from professions. You should spend them wisely, aiming to craft items that you intend to use long-term. You can use the [url guide=18537]recrafting system[/url] to further enhance these pieces later, so there's no need to hoard Sparks if there's a noteworthy item that you can obtain now. You generally want to craft these with [b]Mastery and Haste[/b] with a [item=245784] if crafting for raid, and [b]Mastery and Critical Strike[/b] with a [item=245789] if crafting for Mythic+.\r\n\r\n[center][box]\r\n[h3 toc=\"Crafting Order\"][color=c3] Recommended Crafting Order for Beast Mastery Hunter [/color][/h3]\r\n[tabs uniform=true name=crafted_gear]\r\n\t[tab name=\"Early Crafts\" icon=inv_tailoring_modifiedcraftingreagent_yellow]\r\n\t\tAt the start of the season, resources and gear are very limited, and the first few crafted pieces are crucial for progressing efficiently. Here is the best early crafting order for Beast Mastery Hunter using [item=274476], targetting the quickest power gains:\r\n\r\n\t\t[ol]\r\n\t\t\t[li]Craft [item=265337 bonus=13751:12497:13836:12693:8793] with [item=245875] [toggler id=CRAFT_ORDER_1 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c3 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_1 hidden]\r\n\t\t\tYou can wait with crafting this until after you've spend your first bonus roll or two, in case you hit a weapon. Otherwise, this is the most impactful early craft you can make.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Craft [item=244581 bonus=13751:12497:13836:12384:8793] or [item=244582 bonus=13751:12497:13836:12384:8793] with [item=240166] [toggler id=CRAFT_ORDER_2 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c3 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_2 hidden]\r\n\t\t\tThis is the highest impact slots that doesn't have any kind of canttrip effect or similar. The legs are more impactful but might be taken up by a tier piece early on, but the belt gives you an easy slot to put a socket into. Head is also an option but is taken up by an early mythic drop.\r\n\r\n\t\t\t[/div][/li]\r\n\r\n\r\n\t\t\t[li]Replace low item level pieces.\r\n\t\t\t[/li]\r\n\t\t[/ol]\r\n\t[/tab]\r\n\r\n\t[tab name=\"Best In Slot Crafts\" icon=ui_profession_blacksmithing]\r\n\t\tHere is the best crafting order for Beast Mastery Hunter using [item=274476], especially when Sparks are no longer a limiting resource and more gear is available late in the Season:\r\n\r\n\t\t[ol]\r\n\t\t\t[li]Craft [item=244581 bonus=13751:12497:13836:12384:8793] with [item=240166] [toggler id=CRAFT_ORDER_4 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c3 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_4 hidden]\r\nThis is the slot that has the second least amount of impact from being slightly lower item level from the rest of your gear. Cloak is not an option this tier as [url guide=34251]The Coiled Altar[/url] drops one at higher item level.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Craft [item=244584 bonus=13751:12497:13836:12384:8793] with [item=240166] [toggler id=CRAFT_ORDER_5 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c3 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_5 hidden]\r\nThis is the slot that has the least amount of impact from being slightly lower item level from the rest of your gear. Cloak is not an option this tier as [url guide=34251]The Coiled Altar[/url] drops one at higher item level.\r\n\t\t\t[/div][/li]\r\n\r\n\r\n\t\t\t[li]Replace Low Item Level Pieces.\r\n\t\t\t[/li]\r\n\t\t[/ol]\r\n\t[/tab]\r\n[/tabs]\r\n\r\n[pad]\r\n[h3 toc=\"Embellishments\"][color=c3]Best Embellishments for Beast Mastery Hunter[/color][/h3]\r\n[pad]\r\nFor Beast Mastery Hunter, the best Embellishments are:\r\n[ul]\r\n\r\n\t[li][item=240166][/li]\r\n\t[li][item=245875][/li]\r\n[/ul]\r\n\r\n[item=273062] is also on par with [item=245875], but is slightly more RNG, whereas the former will provide you Mastery most of the time.\r\n\r\n[/box][/center]\r\n\r\nFor more information about crafting, recrafting, and modifying crafted items with embellishments, check out our Profession Recrafting Guide below.\r\n\r\n[center][cta-button guide=18537 icon=ability_repair]Recrafting Items in Midnight[/cta-button][/center] \r\n\r\n[h2 type=bar toc=\"Upgrading Gear\"][icon name=inv_121_crest_myth size=medium type=round inline=true color=c3][/icon] Gear Upgrade Priorities for Beast Mastery Hunter in Midnight[/h2]\r\nSeason 2 of Midnight features multiple ways to upgrade and obtain gear, including Dawn Crests and Bonus Rolls that can be used to obtain powerful gear for your Beast Mastery Hunter.\r\n\r\n[pad]\r\n[tabs uniform=true name=upgrade_systems]\r\n[tab name=\"Mistcrests\" icon=inv_121_crest_myth]\r\n[h3 toc=\"Crest Upgrades\"][color=c3]Upgrading With Mistcrests[/color][/h3]\r\n\r\n[b]Mistcrests[/b] are used to both upgrade and craft gear, with a weekly cap on their acquisition. Because of the Crest cap, making good choices with your Crests is key to getting the most out of your gear. For precise recommendations based on your current situation, we recommend using [url=https://www.raidbots.com/simbot/topgear]Raidbots Top Gear[/url] to simulate your character.\r\n\r\nBelow are the best upgrade priorities for Beast Mastery Hunter, providing a general overview of the most impactful items to focus on to maximize output.\r\n\r\n\r\n[ol]\r\n\t[li][b]Weapon[/b]\r\n\t[ul][li icon=inv_bow_1h_amani_c_01]While you might craft one as your first craft, if you decide not to, upgrading your weapon is almost assuredly the most powerful choice you can make.[/li][/ul][/li]\r\n\r\n\t[li][b]Strong Trinkets[/b]\r\n\t[ul][li icon=none]Your strongest trinkets are generally [item=270173], [item=270175] and [item=270164], so these are safe to upgrade at a high priority. [/li][/ul][/li]\r\n\r\n\t[li][b]Canttrip items[/b]\r\n\t[ul][li icon=none]Uniquely powerful items you are unlikely to replace such as [item=268265 bonus=13848:13708] and [item=271495 original-item=271876 bonus=13848:13708] are safe investments for your crests. [/li][/ul][/li]\r\n\r\n\t[li][b]Lowest Item Level Pieces[/b]\r\n\t[ul][li icon=none]If you have nothing else notable left to upgrade, you should upgrade your current least upgraded item, as it will be the cheapest, and therefore the most efficient overall.[/li][/ul][/li]\r\n[/ol]\r\n\r\nFor more information about upgrading items in Midnight, check out our dedicated guides.\r\n\r\n[center][cta-button guide=33253 icon=inv_121_crest_myth]Upgrading Items in Midnight[/cta-button] [/center]\r\n[/tab]\r\n[tab name=\"Bonus Rolls\" icon=inv_1205_voidforge_fluctuatingvoidcores_cosmicvoid]\r\n\r\n[h3 toc=\"Bonus Rolls\"]Bonus Rolling with Nebulous Voidcores[/h3]\r\nIn Season 2, players will be able to use [currency=3418] to target specific equipment via Bonus Loot rolls. Usable after Midnight Season 2 Raid Bosses, Mythic+ Dungeons, Bountiful Delves, and Nightmare Prey Hunts, this will be a key way to obtain best-in-slot pieces slowly over the rest of the Season. Using a Bonus Roll will reward an item level equivalent to Great Vault rewards from that content, making it possible to obtain items at Myth track from completing dungeons at Keystone level +10 or Heroic Raid Bosses.\r\n\r\nThe first priority here is [b]if you expect to kill The Lost Explorers by the end of the second reset of the season[/b]. If you've already acquired a crafted weapon or similar, you can chose to roll the boss in survival loot spec to remove the weapon from the pool.\r\n\r\n\t[center]\r\n\t[table class=grid width=400px]\r\n\t\t[tr][td width=50px][center][b][large]1[/large][/b][/center][/td][td background=c3][b][icon-badge=268200 quality=4 tooltip=\"Bonus_1_Tooltip\"][/b][/td][/tr]\r\n\t\t[tr][td width=50px][center][b][large]2[/large][/b][/center][/td][td background=c3][b][icon-badge=270164 quality=4 tooltip=\"Bonus_2_Tooltip\"][/b][/td][/tr]\r\n\t\t[tr][td width=50px][center][b][large]3[/large][/b][/center][/td][td background=c3][b][icon-badge=271490 quality=4 tooltip=\"Bonus_3_Tooltip\"][/b][/td][/tr]\r\n\t[/table]\r\n\t[/center]\r\n\r\n[b]If you do not expect to kill The Lost Explorers by the end of the second week[/b] , you should instead look to Bonus Roll the final boss of Heroic,\r\n\t[center]\r\n\t[table class=grid width=400px]\r\n\t\t[tr][td width=50px][center][b][large]1[/large][/b][/center][/td][td background=c3][b][icon-badge=268207 quality=4 tooltip=\"Bonus_4_Tooltip\"][/b][/td][/tr]\r\n\t\t[tr][td width=50px][center][b][large]2[/large][/b][/center][/td][td background=c3][b][icon-badge=270175 quality=4 tooltip=\"Bonus_5_Tooltip\"][/b][/td][/tr]\r\n\t\t[tr][td width=50px][center][b][large]3[/large][/b][/center][/td][td background=c3][b][icon-badge=271495 quality=4 tooltip=\"Bonus_6_Tooltip\"][/b][/td][/tr]\r\n\t[/table]\r\n\t[/center]\r\nFor more information about Bonus Rolls and the Great Vault, check out our dedicated guide.\r\n\r\n[center][cta-button guide=17592 icon=Inv_cape_special_treasure_c_01]The Great Vault System[/cta-button][/center]\r\n[tooltip name=Bonus_1_Tooltip]A good early weapon at high item level.[/tooltip]\r\n[tooltip name=Bonus_2_Tooltip]A best-in-slot trinket available at high item level from an early boss.[/tooltip]\r\n[tooltip name=Bonus_3_Tooltip]A well-statted high value item.[/tooltip]\r\n[tooltip name=Bonus_4_Tooltip]Your best-in-slot weapon, although you will not acquire this at high item level for a while.[/tooltip]\r\n[tooltip name=Bonus_5_Tooltip]A best-in-slot trinket, although at a lower item level for a while.[/tooltip]\r\n[tooltip name=Bonus_6_Tooltip]A well-statted high value item with a cantrip effect.[/tooltip]\r\n[/tab]\r\n[/tabs]\r\n\r\n\r\n[h2 type=bar toc=\"Omnium Folio\"][icon name=ui_majorfaction_-sky_256 size=medium type=round inline=true color=c3][/icon] Omnium Folio Powers for Beast Mastery Hunter in Midnight[/h2]\r\nThe [b]Omnium Folio[/b] is a system available to players throughout the rest of the [i]Midnight[/i] expansion, granting additional power through repeated enhancements to a Core Rune. Available as an icon on the mini-map, this ancient artifact will accompany you everywhere you go, and is able to be changed at any time outside of combat. Upgrades are earned weekly through a quest from Magister Umbric and Grand Magister Rommath. \r\n\r\nFor Beast Mastery Hunter, the best Omnium Folio setup is:\r\n[rotation-timeline]\r\n[rt-step=1279599 text=\"Rune 1\"]\r\n[rt-step=1279603 text=\"Rune 2\"]\r\n[rt-step=1287555 text=\"Rune 3\"]\r\n[rt-step=1279612 text=\"Rune 4\"]\r\n[rt-step=1279614 text=\"Rune 5\"]\r\n[/rotation-timeline]\r\nFor more information about the Omnium Folio, check out our dedicated guide.\r\n\r\n[center][cta-button guide=34036 icon=ability_priest_halo_shadow]The Omnium Folio Guide[/cta-button][/center]\r\n[hr]\r\nOur Beast Mastery Hunter guides are always updated with the latest information from in-game experience, simulations, and logs. Make sure to check our changelog for this page by clicking on [b]View Changelog[/b] in the Quick Facts column or on the book icon at the top of the page. If you are interested in more in-depth Beast Mastery Hunter guides for [b]Midnight Season 2[/b], make sure to browse the [i]Navigation Bar[/i] at the top of the page, along with our list of [b]Related Guides[/b] just beneath the [i]Table of Contents[/i].\r\n\r\n\r\n[tooltip name=Raid_1_Tooltip]This is your overall BiS weapon, with a raised item level and unique cantrip.[/tooltip]\r\n[tooltip name=Raid_2_Tooltip]Your best overall trinket.[/tooltip]\r\n[tooltip name=Raid_3_Tooltip]Highly impactful itemslot, with a raised item level, a unique canttrip, and can be catalyzed for tier.[/tooltip]\r\n[tooltip name=Raid_4_Tooltip]Jewelry with unique cantrip effect.[/tooltip]\r\n[tooltip name=Dung_1_Tooltip]The best weapon option available from Mythic+.[/tooltip]\r\n[tooltip name=Dung_2_Tooltip]Complements existing rings from raid well, although mostly for raiding rather than Mythic+.[/tooltip]\r\n[tooltip name=Dung_3_Tooltip]A ring more well-suited for Mythic+.[/tooltip]\r\n[tooltip name=Dung_4_Tooltip]Probably your best trinket available from Mythic+[/tooltip]\r\n\r\n[tooltip name=axe]Very strong trinket in single-target in spite of not being able to utilize the set bonus, but falls off in Mythic+.[/tooltip]\r\n[tooltip name=heart]Best-in-slot for Mythic+ and one of the best options in raid. Provides solid burst. The main downside is you're not gonna have this available at max item level for a while. [/tooltip]\r\n[tooltip name=bag]This is the best trinket for AoE and is tied for best raid trinket. It is easily available early in Mythic. [/tooltip]\r\n[tooltip name=plumage]This is generally gonna be your best option from Mythic+, as it provides solid burst on top of a de facto damage reduciton. [/tooltip]\r\n[tooltip name=venom]Performs better if you can get your versatility to zero. [/tooltip]\r\n[tooltip name=core]This trinket is a good bit better in single-target rather than AoE due to the stat it provides.[/tooltip]\r\n[tooltip name=whelp]This trinket works the best if trained for the Crit buff. See its item page for more details.[/tooltip]\r\n[tooltip name=darkmoon]While we generally do not recommend crafting trinkets due to them costing an embellishment slots, this sims relatively well. [/tooltip]\r\n[tooltip name=core]This trinket will force you to stand in random areas at random times. It is generally not recommended due to this. It overperforms in simulations.[/tooltip]\r\n\r\n[tooltip name=Cata_1_Tooltip]We don't use a catalyst here for single-target as the default option already gives us our best choice of stats.[/tooltip]\r\n[tooltip name=Cata_2_Tooltip]These are the only shoulders available at 344 item level, which makes them automatically the best option for catalyst.[/tooltip]\r\n[tooltip name=Cata_3_Tooltip]This is the only chest available at 344 item level, which makes it automatically the best option for catalyst. It keeps the Crit proc, which helps further.[/tooltip]\r\n[tooltip name=Cata_4_Tooltip]Good stats. We pick ones with haste for single-target as we already get so much crit from other sources. For Mythic+ You'd prefer ones with Crit and Mastery like [item=193752]. [/tooltip]\r\n[tooltip name=Cata_5_Tooltip]These are the only Pants available at 344 item level, which makes them automatically the best option for catalyst.[/tooltip]", "guide-body", { allow: WH.markup.CLASS_GUIDE });</script>
