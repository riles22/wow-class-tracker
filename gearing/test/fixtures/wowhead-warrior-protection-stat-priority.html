<script>WH.markup.printHtml("[db=live]Stats are a key component of customizing your Protection Warrior in Midnight. Having the right distribution of stats on your gear can be critical towards optimizing your performance. \r\n\r\nThis guide details the best stat priority for your Protection Warrior, as well as covering how to determine Protection Warrior stat priorities personalized for your character in [b]Midnight Season 2[/b], as well as how to check whether an item Best-in-Slot, an upgrade, or outright bad.\r\n\r\nIt also covers Protection Warrior's preferred stats in-depth, accounting for nuances and synergies for niche situations that go beyond a generic priority.\r\n\r\n[pad]\r\n[center][wrapper width=80%]\r\n[nav]\r\n[nav-item=guide/classes/warrior/protection/overview-pve-tank]Overview[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/bis-gear]BiS Gear[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/rotation-cooldowns-pve-tank]Rotation[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/talent-builds-pve-tank]Talent Builds[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/enchants-gems-pve-tank]Consumables[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/stat-priority-pve-tank][color=white]Stats[/color][/nav-item]\r\n[nav-item=guide/classes/warrior/protection/basics icon=Inv_misc_groupneedmore]Basics[/nav-item]\r\n[/nav][/wrapper][/center]\r\n[pad]\r\n[toc]\r\n[pad]\r\n\r\n[h2 toc=\"Stat Recommendations\" type=bar][icon name=achievement_guildperk_fasttrack_rank2 color=c1 inline=true size=medium type=round][/icon] Best Stats for Protection Warrior[/h2]\r\n[pad]\r\n\r\nDefensively, Protection prefers Haste and Crit with a good balance of Vers and Mastery. Haste speeds up your rotation and Rage generation, while Crit grants a ton of parry for large pulls, which heavily reduces damage taken.\r\nOffensively, all 4 Secondary stats are fairly close, and your preferred stats can vary heavily based on your current stat allocation. If you have exceptionally low amounts of Critical Strike or an exceptionally high amount of Haste, Critical Strike may be stronger than Haste for you.\r\n[center]\r\n\r\n[table class=responsive-table]\r\n[tr]\r\n[td width=50%]\r\n[box border=true]\r\n[center][b][color=q9]Survivability[/color] Stat Priority[/b][/center]\r\n[hr]\r\n[ol]\r\n[li][b]Strength[/b][/li]\r\n[li][b]Haste[/b][/li]\r\n[li][b]Critical Strike[/b][/li]\r\n[li][b]Versatility[/b][/li]\r\n[li][b]Mastery[/b][/li]\r\n\r\n\r\n[/ol]\r\n[/box]\r\n\r\n[/td]\r\n[td width=50%]\r\n[box border=true]\r\n[center][b][color=venthyr]DPS[/color] Stat Priority[/b][/center]\r\n[hr]\r\n[ol]\r\n[li][b]Strength[/b][/li]\r\n[li][b]Haste[/b][/li]\r\n[li][b]Critical Strike[/b][/li]\r\n[li][b]Versatility[/b][/li]\r\n[li][b]Mastery[/b][/li]\r\n[/ol]\r\n\r\n[/box]\r\n\r\n[/td]\r\n[/tr]\r\n[/table]\r\n[/center]\r\n\r\n\r\nWhile not unlimited, gearing provides considerable freedom when customizing stats. Following the suggestions below, we've tailored recommendations of best-in-slot gear to seek during [b]Midnight Season 2[/b] for Protection Warrior in our Gearing Guide. \r\n[pad]\r\n[center][cta-button=guide/classes/warrior/protection/bis-gear color=warrior icon=inv_chest_chain_03]Protection Warrior Gearing Guide[/cta-button][/center]\r\n\r\n[h2 type=bar][icon name=ability_warrior_defensivestance color=c1 inline=true size=medium type=round][/icon] Stats Explained[/h2]\r\n\r\n[pad]\r\nThere are many important stats for Protection Warriors. All gear has an item level that dictates the \"power\" of the item. As the item level increases, they get more powerful. Item-level requirements for content usually increase as content becomes more difficult.\r\n\r\n[h3] Item Level Summary[/h3]\r\n\r\nThe following stats are increased with item level:\r\n\r\n[ul]\r\n\r\n\r\n[li][b]Strength[/b] gives parry chance against melee swings, increases the armor gain from [spell=71], and attack power, which scales the power of abilities. [/li]\r\n[li][b]Armor[/b] reduces the damage you take from most physical non-bleed damage sources. Protection Warrior has several armor multipliers that make armor from gear more effective.[/li]\r\n[li][b]Stamina[/b] increases your raw health pool.[/li]\r\n[li][b]Block[/b] reduces the damage you take from attacks that you blocked. The only place to find this stat is the Shield slot.[/li]\r\n[li][b]Secondary stats[/b] - most items have two secondary stats, but there are exceptions.[/li]\r\n\r\n[/ul]\r\n\r\n\r\n[h3] Secondary Stats Summary[/h3]\r\n\r\nFor secondary stats, each stat does the following. Every stat has offensive and defensive value, which will be described below.\r\n[ul]\r\n[li][b]Haste[/b] reduces the global cooldown, which increases Rage generation, DPS, and damage reduction with [spell=190456]. It also increases the availability of [spell=2565]. It is the best secondary stat, hands-down.[/li]\r\n[ul][li]#1 stat overall.[/li][/ul]\r\n[li][b]Versatility[/b] is a plain increase in damage done and damage reduction. It increases Equipment damage, including Trinkets and special weapons! A good stat all around.[/li]\r\n[li][b]Critical Strike[/b] is a great DPS stat. In M+ specifically, it gets a lot of traction defensively because of the sheer amount of melee attacks being thrown at you, and oftentimes can parry dangerous tank busters or prevent certain debuff applications entirely. You should, however, not plan around this happening. As only a fool relies on chance. [/li]\r\n[li][b]Mastery[/b] increases both the chance to critically block and base block chance. This increases overall damage mitigation. The main shortcoming is that it doesn't directly improve your damage reduction against unblockable sources (such as spell damage or DoTs/Bleeds) -- although it does increase your Attack Power, which makes [spell=190456] stronger.[/li]\r\n[/ul]\r\n\r\n\r\n\r\n[h2 toc=\"Simulations\" type=bar][icon name=inv_worserobot color=c1 inline=true size=medium type=round][/icon] Sim Your Protection Warrior[/h2]\r\nThe suggestions for stat priorities mentioned above are generic; exact values will change based on your gear. To gain a proper understanding of your optimal stats, we recommend [b]simming your character[/b] using various tools available in the community, such as [url guide=4885]SimulationCraft[/url]. You can easily sim your character and identify your stat priority with Raidbots, an online platform! Explore more about Raidbots in our [url guide=6050]comprehensive guide[/url]. \r\n\r\nNote that simming your character is only appropriate for obtaining offensive information. There are far too many variables and differing metrics to take into account to obtain useful recommendations from simming for survivability. Therefore, [b]it is recommended that you do not sim for defensive purposes[/b].\r\n[pad]\r\n[h4]Simulate Your Character Now[/h4]\r\n[center][raid-bots-form=gear][/center]\r\n[pad]\r\nComplete the fields above to go to [url=https://www.raidbots.com]Raidbots[/url] and find out the best stats for your character right now!\r\n\r\n[h2 toc=\"Diminishing Returns\" type=bar][icon name=spell_chargenegative color=c1 inline=true size=medium type=round][/icon] Diminishing Returns in Midnight[/h2]\r\n[pad]\r\nAccumulating too much of one Secondary stat from your gear leads to diminishing returns. This means that adding more of the same stat beyond certain thresholds results in reduced benefits. These thresholds are fixed and reduce the amount gained from more of that stat rating by 10% per breakpoint. Each stat has a different rating threshold where the reduction begins:\r\n\r\n[ul]\r\n[li][b]Critical Strike[/b] - Above 1380 rating[/li]\r\n[li][b]Haste[/b] - Above 1320 rating[/li]\r\n[li][b]Mastery[/b] - Above 1380 rating[/li]\r\n[li][b]Versatility[/b] - Above 1620 rating[/li]\r\n[/ul]\r\n[pad]\r\n\r\n[quote]\r\n[b]Example[/b]\r\nLet's assume you gain 1% Haste for 10 Haste Rating. When above the diminishing return breakpoint, 10 Haste Rating would give you 0.9% Haste instead, resulting in a 10% reduction from what you gained previously.\r\n[/quote]\r\n\r\nNote that this system [b]only counts stat rating[/b], meaning that percentage-based procs and effects like [spell=2825] aren't factored in and will always grant their full benefit.\r\n\r\nYou can learn more about stat diminishing returns in our detailed guide: [br][pad][br][center][cta-button guide=11052]What are Stat Diminishing Returns[/cta-button][/center]\r\n\r\n[hr]\r\nOur Protection Warrior guides are always updated with the latest information from in-game experience, simulations, and logs. Make sure to check our changelog for this page by clicking on [b]View Changelog[/b] in the Quick Facts column or on the book icon at the top of the page. If you are interested in more in-depth Protection Warrior guides for [b]Midnight Season 2[/b], make sure to browse the [i]Navigation Bar[/i] at the top of the page.\r\n[pad]\r\n\r\n\r\n[ul]\r\n\r\n[minibox float=left][url=https://www.wowhead.com/protection-warrior-rotation-guide]Previous Page:\r\nRotation, Priority, and Abilities[/url][/minibox]\r\n[minibox float=right][url=https://www.wowhead.com/protection-warrior-gear-guide]Next Page:\r\nGear[/url][/minibox]\r\n[/ul]\r\n[br]\r\n[br]\r\n[pad]\r\n[hr]\r\n[h2 toc=false]Feedback[/h2]\r\n\r\nThanks for reading our class guides! If you have any feedback, feel free to leave a comment in the section below, and we will reply as quickly as possible. If you'd like to talk with any of our writers directly, you can do so by joining our [url=http://discord.gg/wowhead]Discord server[/url] and finding them there!\r\n\r\n[pad][br][pad]", "guide-body", { allow: WH.markup.CLASS_GUIDE });</script>
</body></html>
