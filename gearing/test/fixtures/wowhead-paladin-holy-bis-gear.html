<script>WH.markup.printHtml("[db=live]\r\nGear represents one of the most important avenues towards strengthening your Holy Paladin by providing the majority of your stats, armor, and other gameplay elements such as procs and set bonuses.\r\n\r\nThis guide explains how to obtain the best gear for your Holy Paladin in [b]Midnight Season 2[/b] and how to determine whether an item is Best-in-Slot, an upgrade, or outright bad. It will help you identify the best pieces of gear from dungeons and raids in Midnight, whether they be weapons, trinkets, or armor. \r\n[center][wrapper width=80%]\r\n[nav]\r\n[nav-item=guide/classes/paladin/holy/overview-pve-healer]Overview[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/bis-gear]BiS Gear[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/rotation-cooldowns-pve-healer]Rotation[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/talent-builds-pve-healer]Talent Builds[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/enchants-gems-pve-healer]Consumables[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/stat-priority-pve-healer]Stats[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/basics icon=Inv_misc_groupneedmore]Basics[/nav-item]\r\n[/nav][/wrapper][/center]\r\nFor other Paladin specs, you can check our [url=guide/classes/paladin/retribution/bis-gear]Retribution Paladin BiS[/url] and [url=guide/classes/paladin/protection/bis-gear]Protection Paladin BiS[/url] pages for the most up-to-date information across the entire class.\r\n[toc]\r\n\r\n[h2 type=bar toc=\"Recommended Gear\"][icon name=inv_sword_1h_ulatek_d_01 color=c2 inline=true size=medium type=round][/icon] Recommended Gear for Holy Paladin in Midnight Season 2[/h2]\r\nGearing and itemization are one of the most important aspects towards improving your character. Gear mainly comes from [url guide=33180]Raids[/url] on a weekly lockout, [url guide=33272]Mythic+ Dungeons[/url], or the [url guide=17592]Vault System[/url].\r\n[h3 toc=\"BiS Gear\"]What is the BiS Holy Paladin gear?[/h3]\r\nWhile raid drops are generally the most reliable way to obtain high item level gear, items from other sources can be just as good, if not better. As such, you should reference the [url=guide/classes/paladin/holy/stat-priority-pve-healer]stat priorities for Holy Paladin[/url] to help determine your own upgrade path based on what is available to you. [html]<a href=\"https://www.archon.gg/wow/builds/classes-and-specs\"><img\r\n       alt=\"\"\r\n       height=\"15\"\r\n       src=\"https://assets.rpglogs.com/img/archon/logo-64.svg\"\r\n       class=\"archon-logo-inline\"/> Archon</a>[/html] is a tool that can help determine which alternative gear options are available in any given slot, especially if you're unable to obtain a best-in-slot piece.\r\n\r\n\r\n\r\nAs a rough guideline, follow the stat priority of: [b]Intellect >> Mastery > Haste = Critical Strike > Versatility[/b]. Don't neglect the value of [b]Intellect[/b], as am increase in item level is generally worth it compared to optimized stats. It is always recommended that you use [url=https://questionablyepic.com/live/topgear]Questionably Epic[/url] to find the best gear available to you.\r\n\r\n[tabs uniform=true name=bis_items]\r\n\t[tab name=\"Overall BiS\" icon=8039569]\r\n\t[h3 toc=false][color=c2]Best in Slot Gear for Holy Paladin [/color][/h3]\r\nBiS lists in retail World of Warcraft will never be fully accurate for everyone, and outside of specific items like trinkets, it is not smart to follow them blindly. This list simply serves to point you to where good items drop, and is not supposed to be the end goal for your gear setup.\r\nYou should always use [url=https://questionablyepic.com/live/topgear]Questionably Epic[/url] to confirm something is an upgrade for you.\r\n\r\n\r\n\t\t[center]\r\n\t\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c2][b]Slot[/b][/td]\r\n\t\t\t[td background=c2][b]Item[/b][/td]\r\n\t\t\t[td background=c2][b]Source[/b][/td]\r\n\t\t[/tr]\r\n\t\t[tr][td]Weapon[/td][td][item=268211][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Shield[/td][td][item=268262][/td][td][url guide=34240]Nymrissa Wavecaller[/url][/td][/tr]\r\n\t\t[tr][td]Head[/td][td][item=271465 original-item=268229] [span class=tip tooltip=Bis_Cata_Helm_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34244]Nek'zali the Soulcoiler[/url][/td][/tr]\r\n\t\t[tr][td]Neck[/td][td][item=268265][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[tr][td]Shoulders[/td][td][item=271463 original-item=251138] [span class=tip tooltip=Bis_Cata_Shoulder_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=33189]Murder Row[/url][/td][/tr]\r\n\t\t[tr][td]Cloak[/td][td][item=268253][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Chest[/td][td][item=271468 original-item=268222] [span class=tip tooltip=Bis_Cata_Chest_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Wrist[/td][td][item=268239][/td][td][url guide=34247]The Lost Explorers[/url][/td][/tr]\r\n\t\t[tr][td]Gloves[/td][td][item=271466] [span class=tip tooltip=Bis_Cata_Gloves_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34245]Entombed Sentinels[/url][/td][/tr]\r\n\t\t[tr][td]Belt[/td][td][item=268259][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Legs[/td][td][item=271464 original-item=271878] [span class=tip tooltip=Bis_Cata_Legs_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[tr][td]Boots[/td][td][item=268260][/td][td][url guide=34248]Vashnik the Malignant[/url][/td][/tr]\r\n\t\t[tr][td]Ring[/td][td][item=268249][/td][td][url guide=34248]Vashnik the Malignant[/url][/td][/tr]\r\n\t\t[tr][td]Ring[/td][td][item=252258][/td][td][url guide=33183]Voidscar Arena[/url][/td][/tr]\r\n\t\t[tr][td]Trinket[/td][td][item=270162][/td][td][url guide=34244]Nek'zali the Soulcoiler[/url][/td][/tr]\r\n\t\t[tr][td]Trinket[/td][td][item=270164][/td][td][url guide=34247]The Lost Explorers[/url][/td][/tr]\r\n\t\t[/table]\r\n\t\t[/center]\r\n\t\t[h3 toc=false][color=c2]Best Gear to Catalyze for Holy Paladin [/color][/h3]\r\nThe Matrix Catalyst is a powerful in-game system that converts non-tier set armor pieces into tier set armor pieces of the same type. In Season 2, catalyzed items will retain their stats, allowing players to target specific pieces of gear to catalyze. Below are the best items to catalyze for Holy Paladin:\r\n\t\t[grid align=centered no-margin=true column-width=300]\r\n[p]\r\n[large][b][color=c2]Head[/color][/b][/large]\r\n[center][icon-badge=268229 quality=4 tooltip=\"Cata_1_Tooltip\"][url guide=34244][large][b]Nek'zali[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c2]Shoulders[/color][/b][/large]\r\n[center][icon-badge=251138 quality=4 tooltip=\"Cata_2_Tooltip\"][url guide=33189][large][b]Murder Row[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c2]Chest[/color][/b][/large]\r\n[center][icon-badge=268222 quality=4 tooltip=\"Cata_3_Tooltip\"][url guide=34251][large][b]The Coiled Altar[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c2]Gloves[/color][/b][/large]\r\n[center][icon-badge=271466 quality=4 tooltip=\"Cata_4_Tooltip\"][url guide=34245][large][b]Entombed Sentinels[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c2]Legs[/color][/b][/large]\r\n[center][icon-badge=271878 quality=4 tooltip=\"Cata_5_Tooltip\"][url guide=34252][large][b]Ula'tek[/b][/large][/url][/center]\r\n[/p]\r\n\r\n\r\n[/grid]\r\n\t[/tab]\r\n[/tabs]\r\n[pad]\r\nWondering which Enchants you should apply to your gear? Check out our Enchants & Consumables page for Holy Paladin\r\n\r\n[center][cta-button=guide/classes/paladin/holy/enchants-gems-pve-healer color=c2 colortext icon=ui_profession_enchanting]Enchants and Consumables[/cta-button][/center]\r\n[html]<style>.archon-logo-inline {\r\n   width: 20px;\r\n   height: 20px;\r\n   display: inline;\r\n   margin-bottom: -3px;\r\n}\r\n\r\n\r\n.archon-section__banner {\r\n   position: relative;\r\n   width: 100%;\r\n   height: 90px;\r\n   border: 1px solid #242424;\r\n   background: linear-gradient(140deg, #060606 0%, #141414 100%);\r\n   font-size: 1.25rem;\r\n   font-weight: 700;\r\n   text-align: center;\r\n   text-wrap: balance;\r\n   text-shadow: rgba(0, 0, 0, 0) 0px 0px 1px, rgba(0, 0, 0, 0.8) 0px 1px 2px;\r\n   text-decoration: underline;\r\n   text-underline-offset: 5px;\r\n   text-decoration-thickness: 1px;\r\n   display: flex;\r\n   align-items: center;\r\n   justify-content: center;\r\n}\r\n\r\n\r\n@media (min-width: 1024px) {\r\n   .archon-section__banner {\r\n       font-size: 1.75rem;\r\n   }\r\n}\r\n\r\n\r\n.archon-section__banner-bg-1, .archon-section__banner-bg-2 {\r\n   position: absolute;\r\n   top: 0;\r\n   left: 0;\r\n   bottom: 0;\r\n   right: 0;\r\n   background-position: center;\r\n}\r\n\r\n\r\n.archon-section__banner-bg-1 {\r\n   mask-image: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(0, 0, 0, 1));\r\n   right: 70%;\r\n   background-position-x: 20px;\r\n   background-size: auto;\r\n   background-repeat: no-repeat;\r\n}\r\n\r\n\r\n.archon-section__banner-bg-2 {\r\n   background-size: cover;\r\n   transform: scaleX(-1);\r\n   mask-image: linear-gradient(to left, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 1));\r\n   filter: blur(4px);\r\n   left: 10%;\r\n}\r\n\r\n\r\n.archon-section__banner-content {\r\n   z-index: 1;\r\n   padding: 0 50px;\r\n}</style>\r\n[/html]\r\n\r\n[h3 type=bar toc=false]Learn About Popular Gear With Archon[/h3]\r\n\r\nGearing is a process that takes time and effort, even with powerful items being available from multiple sources. Over the course of acquiring gear, you may not have the best item available for every slot. [html]<a href=\"https://www.archon.gg\"><img\r\n       alt=\"\"\r\n       src=\"https://assets.rpglogs.com/img/archon/logo-64.svg\"\r\n       class=\"archon-logo-inline\"/> Archon</a>[/html] is a tool that compiles log data from thousands of players and shows [url=https://www.archon.gg/wow/builds/holy/paladin/raid/overview/mythic/all-bosses]the most popular builds and alternatives[/url]. At a glance, you can see what other players have done for different types of content.\r\n\r\n[html]\r\n<a href=\"https://www.archon.gg/wow/builds/holy/paladin/raid/gear-and-tier-set/mythic/all-bosses\"\r\n  target=\"_blank\">\r\n   <div class=\"archon-section__banner\">\r\n       <div class=\"archon-section__banner-bg-1\"\r\n            style=\"background-image: url('https://assets.rpglogs.com/img/archon/logo-64.svg');\"></div>\r\n       <div class=\"archon-section__banner-bg-2\"\r\n            style=\"background-image: url('https://www.archon.gg/_next/image?url=https%3A%2F%2Fassets.rpglogs.com%2Fimg%2Fwarcraft%2Fbuilds%2Fspecs%2Fpaladin-3.jpg&amp;w=1080&amp;q=75');\"></div>\r\n       <div class=\"archon-section__banner-content\">Holy Paladin Popular Gear on Archon\r\n       </div>\r\n   </div>\r\n</a>\r\n[/html]\r\n\r\n[h2 toc=\"Raid Drops\" type=bar][icon name=8039569 color=c2 inline=true size=medium type=round][/icon] Best Gear from Raids for Holy Paladin in Midnight Season 2[/h2]\r\nRaids feature several powerful drops for Holy Paladin in Midnight Midnight Season 2 due to either having special item effects or being a powerful best-in-slot option. Below are the best items to target when entering [url guide=34224]The Venomous Abyss[/url] and [url guide=34240]The Tidebound Grotto[/url]:\r\n\r\n\t[center]\r\n\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c2][b][icon-badge=271878 quality=4 tooltip=\"Raid_1_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c2][b][icon-badge=268265 quality=4 tooltip=\"Raid_2_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c2][b][icon-badge=268211 quality=4 tooltip=\"Raid_3_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c2][b][icon-badge=270162 quality=4 tooltip=\"Raid_4_Tooltip\"][/b][/td]\r\n\t\t[/tr]\r\n\t[/table]\r\n\t[/center]\r\n[h2 toc=\"Mythic+ Drops\" type=bar][icon name=Inv_arathordungeon_fragment_color6 color=c2 inline=true size=medium type=round][/icon] Best Gear from Mythic+ for Holy Paladinin Midnight Season 2[/h2]\r\nMythic+ dungeons offer a method of target farming specific pieces of gear for Holy Paladin freely without a weekly lockout. Below are the best items to get from Mythic+:\r\n\r\n\t[center]\r\n\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c2][b][icon-badge=252258 quality=3 tooltip=\"Dung_1_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c2][b][icon-badge=273780 quality=3 tooltip=\"Dung_2_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c2][b][icon-badge=251150 quality=3 tooltip=\"Dung_3_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c2][b][icon-badge=273792 quality=3 tooltip=\"Dung_4_Tooltip\"][/b][/td]\r\n\t\t[/tr]\r\n\t[/table]\r\n\t[/center]\r\n[h2 toc=\"Trinkets\" type=bar][icon name=inv_121_trinket_raid_ulatek_ritualvessel color=c2 inline=true size=medium type=round][/icon] Best Holy Paladin Trinkets in Midnight Season 2[/h2]\r\n\r\nDue to Holy Paladin's lack of large throughput cooldowns to pair on-use trinkets with, we tend to prefer so called stat-stick trinkets that simply give us as many stats as possible. This season our best trinket, [item=270162 bonus=13335:12854], is actually an on-use one, but not one that gives you stats so you should not pair it with your cooldowns.\r\n\r\n\r\n\t[center][box][color=c2]Hover over trinkets to see notes on complex interactions![/color][/box][/center]\r\n\t[center]\r\n\t[h3 toc=false type=bar][color=c2] Trinket Tier List[/color][/h3]\r\n\r\n\t[wrapper width=95%]\r\n\t[grid width=95% align=centered]\r\n\t\t[display-option=raid icon=8039569 checked color=4]Raid[/display-option]\r\n\t\t[display-option=dungeon icon=inv_relics_hourglass checked color=3]Mythic Plus[/display-option]\r\n\t\t[display-option=delves icon=ui_delves checked color=2]Delves[/display-option]\r\n\t\t[display-option=crafting icon=inv_10_blacksmithing_consumable_repairhammer_color2 checked color=5]Crafting[/display-option]\r\n\t[/grid]\r\n\t[pad]\r\n[tier-list=rows grid]\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q5]S[/tier-label]\r\n\t\t\t[tier-content]\r\n\t\t\t\t[icon-badge=270162 quality=4 display-options=raid tooltip=soul-trink]\r\n\t\t[icon-badge=270164 quality=4 display-options=raid]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q4]A[/tier-label]\r\n\t\t\t[tier-content]\r\n\t\t\t\t[icon-badge=270167 quality=4 display-options=raid]\r\n                [icon-badge=250215 quality=3 display-options=dungeon tooltip=flask-trink]\r\n                [icon-badge=250214 quality=3 display-options=dungeon tooltip=core-trink]\r\n\t\t\t\t[icon-badge=249343 quality=4 display-options=raid tooltip=gaze-trink]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q3]B[/tier-label]\r\n\t\t\t[tier-content]\r\n                [icon-badge=273796 quality=3 display-options=dungeon]\r\n                [icon-badge=248583 quality=2 display-options=delves]\r\n                [icon-badge=251792 quality=2 display-options=delves]\r\n                [icon-badge=273649 quality=3 display-options=dungeon]\r\n\t\t\t\t[icon-badge=270169 quality=4 display-options=raid]\r\n                [icon-badge=250248 quality=3 display-options=dungeon]\r\n\r\n[icon-badge=241340 quality=5 display-options=crafting]\r\n[icon-badge=245829  quality=5 display-options=crafting]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q2]C[/tier-label]\r\n\t\t\t[tier-content]\r\n                [icon-badge=250254 quality=3 display-options=dungeon]\r\n                [icon-badge=193757 quality=3 display-options=dungeon]\r\n                [icon-badge=250255 quality=3 display-options=dungeon]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q1]D[/tier-label]\r\n\t\t\t[tier-content]\r\n\t\t\t\t[icon-badge=270171 quality=4 display-options=raid]\r\n\t\t\t\t[icon-badge=193748 quality=3 display-options=dungeon]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\t[/tier-list]\r\n\t[/wrapper]\r\n\t[/center]\r\n\r\n[h2 toc=\"Set Bonuses\" type=bar][icon name=inv_helm_plate_raidpaladinulatek_d_01 color=c2 inline=true size=medium type=round][/icon] Midnight Season 2 Tier Set Bonuses for Holy Paladin[/h2]\r\n\r\nHoly Paladin's Season 2 tier set focuses on enchancing our [spell=54149] procs and giving us more of them. The [url=https://www.wowhead.com/spell=1296656/paladin-holy-12-1-class-set-2pc]2-Set[/url] significantly increases how much [spell=19750] and [spell=20271] gets buffed by [spell=54149], and the [url=https://www.wowhead.com/spell=1296657/paladin-holy-12-1-class-set-4pc]4-Set[/url] grants [spell=82326] 100% and [spell=20271] 20% chance to proc [spell=54149]. It additionally increases [spell=82326]'s mana cost by 50%.\r\n\r\nThe most important part is the 100% chance for [spell=82326] to proc [spell=54149]. This makes it a very useful spell to fall back on to force procs when you have no Holy Power, Holy Shock charges, nor Infusion procs already. Overall, it is not that strong of a tier set from a throughput perspective, but it helps a lot when you actually need it.\r\n[pad]\r\n[quote type=box]\r\n[large]Radiance of the Consecrated Flame[/large]\r\n[ul][li][spell=1296656] - Infusion of Light increases the healing of Flash of Light by an additional 100% and the absorb from Greater Judgment by an additional 100%.[/li]\r\n[li][spell=1296657] - Judgment now has a 20% chance to grant Infusion of Light. Holy Light now has a 100% chance to grant Infusion of Light, but its mana cost is increased by 50%.[/li][/ul]\r\n[/quote]\r\n\r\n\r\n\r\n[center]\r\n[img src=https://wow.zamimg.com/uploads/guide/images/32935.jpg]\r\n[/center]\r\n[br]\r\n\r\n[h2 type=bar toc=\"Crafted Gear\"][icon name=inv_12_profession_questandcrafting_sparkwhole_green size=medium type=round inline=true color=c2][/icon] Best Crafted Gear for Holy Paladin[/h2]\r\n[item=274476] is a weekly-gated resource that is required for crafting some of the most powerful equipment available from professions. You should spend them wisely, aiming to craft items that you intend to use long-term. You can use the [url guide=18537]recrafting system[/url] to further enhance these pieces later, so there's no need to hoard Sparks if there's a noteworthy item that you can obtain now.\r\n\r\n[center][box]\r\n[h3 toc=\"Crafting Order\"][color=c2] Recommended Crafting Order for Holy Paladin[/color][/h3]\r\n[tabs uniform=true name=crafted_gear]\r\n\t[tab name=\"Early Crafts\" icon=inv_tailoring_modifiedcraftingreagent_yellow]\r\n\t\tAt the start of the season, resources and gear are very limited, and the first few crafted pieces are crucial for progressing efficiently. Here is the best early crafting order for Holy Paladin using [item=274476], targetting the quickest power gains:\r\n\r\n\t\t[ol]\r\n\t\t\t[li]Craft [item=237843] with [item=245876] [toggler id=CRAFT_ORDER_1 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c2 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_1 hidden]\r\n\t\t\tCrafting a Weapon always a great idea as it is the biggest immediate upgrade. It will last you through most, if not all, of the Season. [item=245876] is the best embellishment to put on Weapons for us. [item=268211] on Mythic, will be the best in slot weapon once you are able to get that from Coiled Altar.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Craft [item=237831] with [item=240167] [toggler id=CRAFT_ORDER_2 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c2 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_2 hidden]\r\n\t\t\tCrafting a Shield early is smart for the same reasons as crafting a Weapon is. It is significant boost in power and will last you a long time.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Replace Low Item Level Pieces that you know will not be replaced by things like Tier pieces.\r\n\t\t\t[/li]\r\n\t\t[/ol]\r\nNote that since we are one of the few specs who does not have access to a Cantrip weapon, we should have very little competion for other weapons. If you are in a Mythic raiding guild, you should inquire whether you will have priority on getting the [item=268210] from Mythic [url guide=34247]The Lost Explorers[/url] if it drops. If so, you can consider skipping the Weapon craft.\r\n\t[/tab]\r\n\r\n\t[tab name=\"Best In Slot Crafts\" icon=ui_profession_blacksmithing]\r\nWhen worrying about BiS gear, it is assumed that you already have Mythic items in every slot, so because crafted items have a lower maximum item level than regular gear, your BiS crafted items will be the ones that loses you the least stats.\r\n\r\nThis is why Bracers and a Cloak are usually the best late stage crafted items as they have fewer stats than other slots, but since [item=268253] drops at 344, your BiS craft will be bracers + boots instead of a cloak.\r\n\t\r\n\tHere is the best crafting order for Holy Paladin using [item=274476], especially when Sparks are no longer a limiting resource and more gear is available late in the Season:\r\n\r\n\t\t[ol]\r\n\t\t\t[li]Craft [item=237834] with [item=240167][/li]\r\n\r\n\t\t\t[li]Craft [item=237828] with [item=240167][/li]\r\n\t\t[/ol]\r\n\t[/tab]\r\n[/tabs]\r\n\r\n[pad]\r\n[h3 toc=\"Embellishments\"][color=c2]Best Embellishments for Holy Paladin[/color][/h3]\r\n[pad]\r\nFor Holy Paladin, the best Embellishments are:\r\n[ul]\r\n[li][item=245876] is the best embellishment, but can only be put on weapons. Like previous expansions, embellishments are only minor throughput gains, and you will eventually replace your crafted weapon with a Mythic one and instead craft a second item with the second best embellishment.[/li]\r\n\t[li][item=240167] is our second best embellishment.[/li]\r\n\r\n[/ul]\r\n\r\n[/box][/center]\r\n\r\nFor more information about crafting, recrafting, and modifying crafted items with embellishments, check out our Profession Recrafting Guide below.\r\n\r\n[center][cta-button guide=18537 icon=ability_repair]Recrafting Items in Midnight[/cta-button][/center] \r\n\r\n[h2 type=bar toc=\"Upgrading Gear\"][icon name=inv_121_crest_myth size=medium type=round inline=true color=c2][/icon] Gear Upgrade Priorities for Holy Paladin in Midnight[/h2]\r\nSeason 2 of Midnight features multiple ways to upgrade and obtain gear, including Mistcrests and Bonus Rolls that can be used to obtain powerful gear for your Holy Paladin.\r\n\r\n[pad]\r\n[tabs uniform=true name=upgrade_systems]\r\n[tab name=\"Mistcrests\" icon=inv_121_crest_myth]\r\n[h3 toc=\"Crest Upgrades\"][color=c2]Upgrading With Mistcrests[/color][/h3]\r\n\r\n[b]Mistcrests[/b] are used to both upgrade and craft gear, with a weekly cap on their acquisition. Because of the Crest cap, making good choices with your Crests is key to getting the most out of your gear. For precise recommendations based on your current situation, we recommend using [url=https://questionablyepic.com/live/]Questionably Epic[/url] to simulate your character.\r\n\r\nBelow are the best upgrade priorities for Holy Paladin, providing a general overview of the most impactful items to focus on to maximize output.\r\n[ol]\r\n\t[li][b]Weapon and Shield[/b]\r\n\t[ul][li icon=none]Weapon and Shield will always be your best item to prioritize getting to a high item level. However, since you can also craft weapons and may choose this option, it might be better to focus on upgrading strong trinkets first. [b]Do not upgrade these if you're planning on crafting them![/b][/li][/ul][/li]\r\n\r\n\t[li][b]Strong Trinkets[/b]\r\n\t[ul][li icon=none]Good trinkets are also always going to be great to upgrade, as they tend to scale well with item level and will not be replaced easily or at all.[/li][/ul][/li]\r\n\r\n\t[li][b]High Stat Pieces[/b]\r\n\t[ul][li icon=none]Following weapons, shield, and trinkets, you should simply begin upgrading your high stat pieces such as Chests, Legs, and Helmets.[/li][/ul][/li]\r\n[/ol]\r\n\r\nFor more information about upgrading items in Midnight, check out our dedicated guides.\r\n\r\n[center][cta-button guide=33253 icon=inv_121_crest_myth]Upgrading Items in Midnight[/cta-button] [/center]\r\n[/tab]\r\n[tab name=\"Bonus Rolls\" icon=inv_1205_voidforge_fluctuatingvoidcores_cosmicvoid]\r\n\r\n[h3 toc=\"Bonus Rolls\"]Bonus Rolling with Nebulous Voidcores[/h3]\r\nIn Season 2, players will be able to use [currency=3418] to target specific equipment via Bonus Loot rolls. Usable after Midnight Season 2 Raid Bosses, Mythic+ Dungeons, Bountiful Delves, and Nightmare Prey Hunts, this will be a key way to obtain best-in-slot pieces slowly over the rest of the Season. Using a Bonus Roll will reward an item level equivalent to Great Vault rewards from that content, making it possible to obtain items at Myth track from completing dungeons at Keystone level +10 or Heroic Raid Bosses.\r\n\r\n\t[center]\r\n\t[table class=grid width=400px]\r\n\t\t[tr][td width=50px][center][b][large]1[/large][/b][/center][/td][td background=c2][b][url guide=34252]Ula'tek[/url][/b] - Until you get to Mythic Ula'tek, your top priority is to get the two cantrip items on Myth track by bonus rolling Heroic.\r\n\r\nThere are only two items on our loot table, [item=268265] and [item=271878], and we want both of them.[/td][/tr]\r\n\t\t[tr][td width=50px][center][b][large]2[/large][/b][/center][/td][td background=c2][b][url guide=34247]The Lost Explorers[/url][/b] - These Turtles have an excellent loot table for us, including weapon, shield, and a decent trinket.[/td][/tr]\r\n\t\t[tr][td width=50px][center][b][large]3[/large][/b][/center][/td][td background=c2][b][url guide=34244]Nek'zali the Soulcoiler[/url][/b] - I recommend bonus rolling this boss until you get [item=270162].[/td][/tr]\r\n\t[/table]\r\n\t[/center]\r\nFor more information about Bonus Rolls and the Great Vault, check out our dedicated guide.\r\n\r\n[center][cta-button guide=17592 icon=Inv_cape_special_treasure_c_01]The Great Vault System[/cta-button][/center]\r\n[tooltip name=Bonus_1_Tooltip]The extra effect on these legs is very powerful. I recommend bonus rolling this boss on Heroic (obviously Mythic is better when you get to it) as a priority.\r\n\r\nDrops from Ula'Tek.[/tooltip]\r\n[tooltip name=Bonus_2_Tooltip]Just as with the legs, the bonus effect on this necklace is amazing, and it also drops from Ula'Tek. These two items are infact the only items on Ula'Tek's loottable, so you are guaranteed to get a good item.[/tooltip]\r\n[tooltip name=Bonus_3_Tooltip]The best trinket available to us this season. Since it drops from the 1st boss of the Raid, I recommend you should try to only bonus roll this boss on Mythic.[/tooltip]\r\n[/tab]\r\n[/tabs]\r\n\r\n\r\n[h2 type=bar toc=\"Omnium Folio\"][icon name=ui_majorfaction_-sky_256 size=medium type=round inline=true color=c2][/icon] Omnium Folio Powers for Holy Paladin in Midnight[/h2]\r\nThe [b]Omnium Folio[/b] is a system available to players throughout the rest of the [i]Midnight[/i] expansion, granting additional power through repeated enhancements to a Core Rune. Available as an icon on the mini-map, this ancient artifact will accompany you everywhere you go, and is able to be changed at any time outside of combat. Upgrades are earned weekly through a quest from Magister Umbric and Grand Magister Rommath. \r\n\r\nFor Holy Paladin, the best Omnium Folio setup is:\r\n[rotation-timeline]\r\n[rt-step=1279599 text=\"Rune 1\"]\r\n[rt-step=1279603 text=\"Rune 2\"]\r\n[rt-step=1287555 text=\"Rune 3\"]\r\n[rt-step=1279612 text=\"Rune 4\"]\r\n[rt-step=1279614 text=\"Rune 5\"]\r\n[/rotation-timeline]\r\nFor more information about the Omnium Folio, check out our dedicated guide.\r\n\r\n[center][cta-button guide=34036 icon=ability_priest_halo_shadow]The Omnium Folio Guide[/cta-button][/center]\r\n[hr]\r\n\r\nOur Holy Paladin guides are always updated with the latest information from in-game experience, simulations, and logs. Make sure to check our changelog for this page by clicking on [b]View Changelog[/b] in the Quick Facts column or on the book icon at the top of the page. If you are interested in more in-depth Holy Paladin guides for [b]Midnight Season 2[/b], make sure to browse the [i]Navigation Bar[/i] at the top of the page, along with our list of [b]Related Guides[/b] just beneath the [i]Table of Contents[/i].\r\n\r\n\r\n[tooltip name=Raid_1_Tooltip]These legs drop at a higher Item Level and have special effect, so they will be your best legs.[/tooltip]\r\n[tooltip name=Raid_2_Tooltip]This necklace drops at a higher Item Level and has a special effect, so it will be your best necklace.[/tooltip]\r\n[tooltip name=Raid_3_Tooltip]This sword is the highest item level weapon available to use and will thus be your best weapon.[/tooltip]\r\n[tooltip name=Raid_4_Tooltip]The on-use effect of this trinket is very powerful in both raid and mythic+. It is the best trinket of Season 2.[/tooltip]\r\n[tooltip name=Dung_1_Tooltip]This is our second best ring based on its stats. What else would it be based on?[/tooltip]\r\n[tooltip name=Dung_2_Tooltip]Not our best weapon, but getting a weapon is always nice, unless you already crafted one I suppose.[/tooltip]\r\n[tooltip name=Dung_3_Tooltip]A good shield with good stats. Can't go wrong with that.[/tooltip]\r\n[tooltip name=Dung_4_Tooltip]A decent ring because it has decent stats.[/tooltip]\r\n\r\n[tooltip name=soul-trink]Applies large shields. 2 second channel, but you can move during it. \r\nUse close to on cooldown, ideally before damage happens.[/tooltip]\r\n[tooltip name=flask-trink]Use with Divine Toll on cooldown.[/tooltip]\r\n[tooltip name=core-trink]Occasionally spawns a beam of light you should try to stand in as much as possible.[/tooltip]\r\n[tooltip name=gaze-trink]This Season 1 Trinket is still really good in Season 2. Expect it to get nerfed, or other trinkets buffed.[/tooltip]\r\n\r\n[tooltip name=Cata_1_Tooltip]The \"best\" helm you can catalyse is [item=268229] from Murder Row.[/tooltip]\r\n[tooltip name=Cata_2_Tooltip]The \"best\" shoulders you can catalyse are the [item=251138] from Murder Row.[/tooltip]\r\n[tooltip name=Cata_3_Tooltip]The best chest you can catalyse is [item=268222] from The Coiled Altar, because it has the highest Item Level of any chest in the game.[/tooltip]\r\n[tooltip name=Cata_4_Tooltip]The actual tier gloves themself are your \"best\" available gloves option.[/tooltip]\r\n[tooltip name=Cata_5_Tooltip]The best legs you can catalyse are the [item=271878] from Ula'tek, because they are higer Item Level and have a special effect.[/tooltip]\r\n\r\n[tooltip name=Bis_Cata_Helm_Tooltip]The \"best\" helm you can catalyse is [item=268229] from Nek'zali the Soulcoiler.[/tooltip]\r\n[tooltip name=Bis_Cata_Shoulder_Tooltip]The \"best\" shoulders you can catalyse are the [item=251138] from Murder Row.[/tooltip]\r\n[tooltip name=Bis_Cata_Chest_Tooltip]The best chest you can catalyse is [item=268222] from The Coiled Altar, because it has the highest Item Level of any chest in the game.[/tooltip]\r\n[tooltip name=Bis_Cata_Gloves_Tooltip]The actual tier gloves themself are your \"best\" available gloves option.[/tooltip]\r\n[tooltip name=Bis_Cata_Legs_Tooltip]The best legs you can catalyse are the [item=271878] from Ula'tek, because they are higer Item Level and have a special effect.[/tooltip]", "guide-body", { allow: WH.markup.CLASS_GUIDE });</script>
