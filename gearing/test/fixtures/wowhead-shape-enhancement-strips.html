<script>WH.markup.printHtml("[h3 toc=false type=bar][color=c7]Best Gear to use in the Catalyst as Enhancement[/color][/h3]\r\n[pad]\r\nThe Matrix Catalyst offers a way to create Tier Set pieces from items of the same item slot. New in Season 2, when converted they will [i]also [b]retain their prior secondary stats and cantrip effects[/b][/i], meaning that specific pieces of gear are now ideal to catalyze in the best setups. Below are the absolute best items to use:\r\n[pad]\r\n[hr]\r\n[center]\r\n[table class=responsive-table width=1000px]\r\n[tr]\r\n[td align=center width=200px]\r\n[large][b][color=c7]Head[/color][/b][/large]\r\n[icon-badge=251220;12854 quality=4 tooltip=\"Cata_1\"][url=\"guide=33183\"][icon name=inv_achievement_dungeon_voidscararena][/icon] [large][b]Voidscar Arena[/b][/large][/url]\r\n[/td]\r\n[td align=center width=200px]\r\n[large][b][color=c7]Shoulders[/color][/b][/large]\r\n[icon-badge=268231;13848 quality=4 tooltip=\"Cata_2\"][url=\"guide=34251\"][icon name=inv_121_raid_achievement_zuljinmalacrass][/icon] [large][b]Coiled Altar[/b][/large][/url]\r\n[/td]\r\n[td align=center width=200px]\r\n[large][b][color=c7]Chest[/color][/b][/large]\r\n[icon-badge=271876;13848:13708 quality=4 tooltip=\"Cata_3\"][url=\"guide=34252\"][icon name=inv_121_raid_achievement_ulatek][/icon] [large][b]Ula'tek[/b][/large][/url]\r\n[/td]\r\n[td align=center width=200px]\r\n[large][b][color=c7]Gloves[/color][/b][/large]\r\n[icon-badge=160213;12854 quality=4 tooltip=\"Cata_4\"][url=\"guide=33219\"][icon name=achievement_dungeon_kingsrest][/icon] [large][b]King's Rest[/b][/large][/url]\r\n[/td]\r\n[td align=center width=200px]\r\n[large][b][color=c7]Legs[/color][/b][/large]\r\n[icon-badge=268237;13848 quality=4 tooltip=\"Cata_5\"][url=\"guide=34251\"][icon name=inv_121_raid_achievement_zuljinmalacrass][/icon] [large][b]Coiled Altar[/b][/large][/url]\r\n[/td]\r\n[/tr]\r\n[/table]\r\n[/center]\r\n[hr]\r\n[wrapper width=95%]\r\n[span style=\"background-color: #181818; color: #ededed; position: relative; top: 12px; left: 25px; padding: 2px 6px; line-height: 1; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px;\"]\r\n  [symbol=wow-atlas-quest-important-available][large][color=q6]Season 2 Catalyst Changes & Off-Pieces[/color][/large][/span]\r\n[center]\r\n[div style=\"border:2px solid #2788e6; padding:14px; border-radius:10px;\"]\r\n[pad]\r\nDue to the Catalyst now converting the stats of any item you use in it, there's [b]no longer an ideal off-piece[/b]. Instead, it matters [i]what[/i] item you put in the Catalyst to create Tier Set pieces with desirable stats. Due to the [achievement=62871] achievement existing once again in Season 2, unlock this through any combination of four Tier pieces, and then start looking for ideal items to convert to maintain your set bonus.\r\n\r\n[/div]\r\n[/center]\r\n[/wrapper]\r\n[pad]\r\n\r\n[tooltip name=\"Cata_1\"]The endgame gearset is overloaded with Critical Strike, and desperate for Haste and Mastery. This is the only Helm available that offers both while not being in an elevated item level slot.[/tooltip]\r\n\r\n[tooltip name=\"Cata_2\"]Drops at 344 Item Level, giving it an Agility advantage over any alternative.[/tooltip]\r\n\r\n[tooltip name=\"Cata_3\"]Not only has an Item Level advantage dropping at 344, but the cantrip effect is [i]extremely[/i] strong. We always want to use this piece.[/tooltip]\r\n\r\n[tooltip name=\"Cata_4\"]The endgame gearset is overloaded with Critical Strike, and desperate for Haste and Mastery. These are the only Gloves that offer both while not being in an elevated item level slot.[/tooltip]\r\n\r\n[tooltip name=\"Cata_5\"]Perfect stats [i]and[/i] has an elevated 344 Item Level, so nothing comes close.[/tooltip]\r\n\r\n[html]<style>.archon-logo-inline {\r\n   width: 20px;\r\n   height: 20px;\r\n   display: inline;\r\n   margin-bottom: -3px;\r\n}\r\n\r\n\r\n.archon-section__banner {\r\n   position: relative;\r\n   width: 100%;\r\n   height: 90px;\r\n   border: 1px solid #242424;\r\n   background: linear-gradient(140deg, #060606 0%, #141414 100%);\r\n   font-size: 1.25rem;\r\n   font-weight: 700;\r\n   text-align: center;\r\n   text-wrap: balance;\r\n   text-shadow: rgba(0, 0, 0, 0) 0px 0px 1px, rgba(0, 0, 0, 0.8) 0px 1px 2px;\r\n   text-decoration: underline;\r\n   text-underline-offset: 5px;\r\n   text-decoration-thickness: 1px;\r\n   display: flex;\r\n   align-items: center;\r\n   justify-content: center;\r\n}\r\n\r\n\r\n@media (min-width: 1024px) {\r\n   .archon-section__banner {\r\n       font-size: 1.75rem;\r\n   }\r\n}\r\n\r\n\r\n.archon-section__banner-bg-1, .archon-section__banner-bg-2 {\r\n   position: absolute;\r\n   top: 0;\r\n   left: 0;\r\n   bottom: 0;\r\n   right: 0;\r\n   background-position: center;\r\n}\r\n\r\n\r\n.archon-section__banner-bg-1 {\r\n   mask-image: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(0, 0, 0, 1));\r\n   right: 70%;\r\n   background-position-x: 20px;\r\n   background-size: auto;\r\n   background-repeat: no-repeat;\r\n}\r\n\r\n\r\n.archon-section__banner-bg-2 {\r\n   background-size: cover;\r\n   transform: scaleX(-1);\r\n   mask-image: linear-gradient(to left, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 1));\r\n   filter: blur(4px);\r\n   left: 10%;\r\n}\r\n\r\n\r\n.archon-section__banner-content {\r\n   z-index: 1;\r\n   padding: 0 50px;\r\n}</style>\r\n[/html]\r\n\r\n\n[h2 toc=\"Raid Drops\" type=bar][icon name=8039569 color=c7 inline=true size=medium type=round][/icon] Best Raid Items for Enhancement Shaman in Midnight Season 2[/h2]\r\n[pad]\r\nRaids often contain some of the strongest Best-in-Slot pieces in each Season, and this is especially true for Season 2. While previously in Midnight strong items were sourced from a few different places, The Venomous Abyss contains all of our big ticket \"chase\" items that provide far more power than alternatives, with powerful trinkets, unique effects and [b][color=necrolord]Venomcursed[/color][/b] procs. The items below are things you should be on the lookout for, and hopefully you can pick them up!\r\n[wrapper width=80%]\r\n[center]\r\n[grid fit-columns=true column-width=180]\r\n[span][b][icon-badge=268209;13848 quality=4 tooltip=\"Raid_1_Tooltip\"][/b][/span]\r\n[span][b][icon-badge=270175;13848 quality=4 tooltip=\"Raid_2_Tooltip\"][/b][/span]\r\n[span][b][icon-badge=268265;13848:13708:10835 quality=4 tooltip=\"Raid_3_Tooltip\"][/b][/span]\r\n[span][b][icon-badge=270173;13848 quality=4 tooltip=\"Raid_4_Tooltip\"][/b][/span]\r\n[span][b][icon-badge=271876;13848:13708 quality=4 tooltip=\"Raid_5_Tooltip\"][/b][/span]\r\n[/grid]\r\n[/center]\r\n[/wrapper]\r\n\r\n[tooltip name=\"Raid_1_Tooltip\"]\r\nNot only is this a main-hand weapon with an elevated 344 item level (which by itself makes it the best option by far), but it also has a free cantrip on top, perfect stats [i]and[/i] interacts with a strong trinket. The strongest upgrade available if you can get one on Mythic.\r\n[/tooltip]\r\n\r\n[tooltip name=\"Raid_2_Tooltip\"]\r\nThe single strongest on-use trinket available in the season, with no other option coming remotely close.\r\n\r\nDespite being a 90-second cooldown, we hold it to align with cooldowns, and the ramping Agility is perfect for [symbol=wow-hero-talent-stormbringer] [color=q9]Stormbringer[/color]'s burst focus.\r\n[/tooltip]\r\n\r\n[tooltip name=\"Raid_3_Tooltip\"]\r\nWhile Crit isn't necessarily our go to stat, this is just too strong to skip. Higher item level, an extra socket [i]and[/i] a strong bonus effect.\r\n\r\nThis is one of the strongest items in the Season, primarily because of the the [color=necrolord]Venomcursed[/color] secondary proc, which provides more bulk stats due to it being a jewellery piece.\r\n[/tooltip]\r\n\r\n[tooltip name=\"Raid_4_Tooltip\"]\r\nWhile direct damage isn't normally our style, this deals [i]really[/i] high damage, and the 2-set actually has a meaningful impact on how strong the weapon cantrip is.\r\n\r\nFalls slightly behind at very high target counts compared to stat trinkets, but has a massive lead in single-target and cleave.\r\n[/tooltip]\r\n\r\n[tooltip name=\"Raid_5_Tooltip\"]\r\nSimilar to the neck, Crit may not be our go to but the [color=necrolord]Venomcursed[/color] effect is absolutely worth using this for.\r\n[/tooltip]\r\n\r\n\n[h2 toc=\"Mythic+ Drops\" type=bar][icon name=inv_relics_hourglass color=c7 inline=true size=medium type=round][/icon] Best Mythic+ Items for Enhancement Shaman in Midnight Season 2[/h2]\r\n[pad]\r\nMythic+ provide a way to farm gear all the way up to Hero Item Level with no weekly lockout, meaning they're a great source of gear to fill out any slots that are currently lacking in your gear setup. While in Season 2 the offerings aren't as good as previously - especially compared to what The Venomous Abyss contains - they're still a great source of early gear with a few key pickups:\r\n\r\n[pad]\r\n[wrapper width=80%]\r\n[center]\r\n[grid fit-columns=true column-width=180]\r\n[span][b][icon-badge=273796;12854 quality=4 tooltip=\"Dung_1_Tooltip\"][/b][/span]\r\n[span][b][icon-badge=252258;12854 quality=4 tooltip=\"Dung_3_Tooltip\"][/b][/span]\r\n[span][b][icon-badge=251220;12854 quality=4 tooltip=\"Dung_2_Tooltip\"][/b][/span]\r\n[span][b][icon-badge=160213;12854 quality=4 tooltip=\"Dung_4_Tooltip\"][/b][/span]\r\n[/grid]\r\n[/center]\r\n[/wrapper]\r\n\r\n[tooltip name=\"Dung_1_Tooltip\"]\r\nWhile not as strong as Voracious Heart as your on-use, this can serve as a good stopgap while you wait to get hold of one.\r\n[/tooltip]\r\n\r\n[tooltip name=\"Dung_2_Tooltip\"]\r\nOne of the few Haste/Mastery jewellery pieces available, and does a lot of heavy lifting to cover some of our stat needs. Extremely high value pickup that's used in endgame gear setups.\r\n[/tooltip]\r\n\r\n[tooltip name=\"Dung_3_Tooltip\"]\r\nThe best Catalyst Helm available, providing Haste and Mastery that gearsets struggle to pick up from The Venomous Abyss.\r\n[/tooltip]\r\n\r\n[tooltip name=\"Dung_4_Tooltip\"]\r\nSimilar to the Helm, a great piece for the Catalyst to cover the high Haste and Mastery needs of our gearset in Season 2.\r\n[/tooltip]\r\n\r\n", "guide-body", { allow: WH.markup.CLASS_GUIDE });</script>
</body></html>
