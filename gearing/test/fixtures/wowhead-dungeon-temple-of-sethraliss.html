<script>WH.markup.printHtml("[toc]\r\n[zone=9527] is one of three legacy dungeons featured in the dungeon rotation for Midnight: Season 2 Mythic+. Learn the essentials of this dungeon, including its location, Mythic+ tips, loot, and more!\r\n\r\n[div class=clear][/div]\r\n[center][wrapper width=70%]\r\n[nav]\r\n[nav-item=/guide/midnight/mythic-plus-season-overview icon=inv_121_crest_adventurer]Mythic+ Season 2[/nav-item]\r\n[nav-item=/guide/midnight/season-mythic-plus-rewards-loot-drops-mounts-achievements icon=inv_windserpent3mount_skeletal_green]Mythic+ Rewards Season 2[/nav-item]\r\n[nav-item=/guide/mythic-keystones-and-dungeons icon=inv_relics_hourglass_02]About Mythic+[/nav-item]\r\n[/nav][/wrapper]\r\n[wrapper width=90%]\r\n[nav]\r\n[nav-item=/guide/midnight/altar-of-fangs-dungeon-overview-location-rewards icon=inv_achievement_dungeon_altaroffangs]Altar of Fangs Dungeon[/nav-item]\r\n[nav-item=/guide/midnight/den-of-nalorakk-dungeon-overview-location-rewards icon=inv_achievement_dungeon_proveyourworth]Den of Nalorakk[/nav-item]\r\n[nav-item=/guide/midnight/murder-row-dungeon-overview-location-rewards icon=inv_achievement_dungeon_murderrow]Murder Row[/nav-item]\r\n[nav-item=/guide/midnight/the-blinding-vale-dungeon-overview-location-rewards icon=inv_achievement_dungeon_lightbloom]The Blinding Vale[/nav-item]\r\n[nav-item=/guide/midnight/voidscar-arena-dungeon-overview-location-rewards icon=inv_achievement_dungeon_voidscararena]Voidscar Arena[/nav-item]\r\n[nav-item=/guide/midnight/ruby-life-pools-dungeon-overview-mythic-plus icon=achievement_dungeon_lifepools]Ruby Life Pools[/nav-item]\r\n[nav-item=/guide/midnight/temple-of-sethraliss-dungeon-overview-mythic-plus icon=achievement_dungeon_templeofsethraliss]Temple of Sethraliss[/nav-item]\r\n[nav-item=/guide/midnight/kings-rest-dungeon-overview-mythic-plus icon=achievement_dungeon_kingsrest]King's Rest[/nav-item]\r\n[/nav]\r\n[/wrapper][/center][div class=clear][/div]\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n[grid column-width=800 align=centered]\r\n[div style=\"background:#222222;padding:10px; border:2px solid #8c1515;  border-radius: 10px;\"]\r\n[h2 type=bar toc=\"Overview\"]Temple of Sethraliss in Patch 12.1[/h2]\r\n[b]Where:[/b] [zone=8501]\r\n[b]Dungeon Bosses:[/b] 4\r\n[b]Required Level:[/b] 90\r\n[b]Available Difficulties:[/b] Heroic, Mythic, Mythic+\r\n[b]Mythic+ Dungeon Timer:[/b]  33 minutes \r\n[/div][/grid]\r\n\r\n[h2 type=bar toc=\"Dungeon Location\"]Temple of Sethraliss Dungeon Location in Patch 12.1[/h2]\r\nThe Temple of Sethraliss Dungeon is located in northern [zone=8501]. For convenient travel, players can use the Timeways portal in Silvermoon City (/way #2393 42.4, 58.3) for quick access to Temple of Sethraliss. The Timeways Portal to Temple of Sethraliss is located on the rightmost side. \r\n\r\nIf you have timed Temple of Sethraliss on a +10 or higher, you can also teleport directly to the dungeon entrance using the [spell=1286828] spell located in your general Spellbook.\r\n\r\n[grid column-width=500 align=centered]\r\n[div][center]/way #864 51.9 26.7 Temple of Sethraliss Entrance\r\n[map zone=8501]\r\n[pin x=51.9 y=26.7 type=1]Temple of Sethraliss Entrance[/pin]\r\n[/map][/center]\r\n[/div]\r\n[div]\r\n[pad][pad][pad][center][screenshot id=1292049 height=325 size=normal border=2 alt=\"Temple of Sethraliss\"][/screenshot][/center][/div][/grid]\r\n\r\n[h2 type=bar toc=\"Overview\"]Temple of Sethraliss Overview in Patch 12.1[/h2]\r\n[tabs name=\"bossinfo\" size=\"thin\"]\r\n[tab name=\"Mythic+ Strategy\"]\r\n[pad]\r\n[h4 type=bar]Important Interrupts and Dispels[/h4]\r\n[center][table class=\"grid\" width=750px]\r\n[tr][td width=250px][b]Important Interrupts[/b][/td][td width=250px][b]Important Dispels[/b][/td][td width=250px][b]Important Purges[/b][/td][/tr]\r\n[tr][td][ul][li][spell=1308100]\r\n[i]Shrouded Fang (T1)[/i][/li]\r\n[li][spell=1314082]\r\n[i]Faithless Subjugator (T2)[/i][/li]\r\n[li][spell=267027]\r\n[i]Merektha (B2)[/i][/li]\r\n[li][spell=1303535]\r\n[i]Temple Disruptor (T4)[/i][/li]\r\n[li][spell=268013]\r\n[i]Twisted Hexxer (T4/B4)[/i][/li]\r\n\r\n[/ul]\r\n[/td]\r\n\r\n[td][ul][li][symbol=wow-atlas-icons_64x64_poison] [spell=1308100]*\r\n[i]Shrouded Fang (T1)[/i][/li]\r\n[li][symbol=wow-atlas-icons_64x64_poison] [spell=1308148]\r\n[i]Poisonous Viper (T2)[/i][/li]\r\n[li][symbol=wow-atlas-icons_64x64_curse] [spell=1314082]*\r\n[i]Faithless Subjugator (T2)[/i][/li]\r\n[li][symbol=wow-atlas-icons_64x64_poison] [spell=267027]*\r\n[i]Merektha (B2)[/i][/li]\r\n[li][symbol=wow-atlas-icons_64x64_magic] [spell=1296052]\r\n[i]Imbued Stormcaller (T3)[/i][/li]\r\n\r\n[/ul][/td]\r\n\r\n[td][ul][li][symbol=wow-atlas-icons_64x64_magic] [spell=1310739]\r\n[i]Agitated Nimbus (T3)[/i][/li]\r\n[/ul]\r\n\r\n\r\n[/td][/tr]\r\n[tr][td colspan=3][b]Legend[/b]: T# (Trash Before # Boss), B# (Boss #), * Dispel only if failed mechanic.[/td][/tr][/table][/center]\r\n\r\n[h4 type=bar]Boss Quick Strategy[/h4]\r\n[center][table class=\"grid\" width=1200px]\r\n[tr][td width=300px][b]Adderis and Aspix[/b][/td][td width=300px][b]Merektha[/b][/td][td width=300px][b]Galvazzt[/b][/td][td width=300px][b]Avatar of Sethraliss[/b][/td][/tr]\r\n[tr]\r\n[td][b]Don't Get Pushed Too Far![/b]\r\n[ul][li][spell=1288864] - [b]Drop Away[/b]\r\n[i]Drops Silence zones on the ground[/i][/li]\r\n[li][spell=1289062] - [b]Spread[/b]\r\n[i]Pushes players away.[/i][/li]\r\n[li][spell=1288235] - [b]Stack[/b]\r\n[i]Group soak, then run out.[/i][/li]\r\n[li][spell=1289229] - [b]Swap Targets[/b]\r\n[i]Grants immunity to one of the bosses.[/i][/li][/ul][/td]\r\n\r\n[td][b]Break Knot of Snakes Using CC![/b]\r\n[ul][li][spell=1290031] - [b]CC Adds[/b]\r\n[i]Stuns players, broken using CC.[/i][/li]\r\n[li][spell=1289602] - [b]Keep Moving[/b]\r\n[i]Makes players poop out lightning.[/i][/li]\r\n[li][spell=1289205] - [b]Kills Adds[/b]\r\n[i]Summons adds to deal with.[/i][/li]\r\n[li][spell=264172] - [b]Dodge[/b]\r\n[i]Tunnels across the arena.[/i][/li][/ul][/td]\r\n\r\n[td][b]Soak the Beams![/b]\r\n[ul][li][spell=274006] - [b]Soak[/b]\r\n[i]Fires beams into the boss.[/i][/li]\r\n[li][spell=1290531] - [b]Move Boss[/b]\r\n[i]Drops a large void zone under the boss.[/i][/li][/ul][/td]\r\n\r\n[td][b]Soak After Guardian Dies![/b]\r\n[ul][li][spell=1300871] - [b]DPS Soak Purple[/b]\r\n[i]Summons three zones that need to be soaked.[/i][/li]\r\n[li][spell=1302153] - [b]Place Away[/b]\r\n[i]Void zones that hex players inside.[/i][/li]\r\n[li][spell=1301199] - [b]Don't Heal Boss[/b]\r\n[i]Prevents healing to the boss.[/i][/li]\r\n[li][npc=268317] - [b]AoE Down[/b]\r\n[i]Every add defeated heals boss.[/i][/li][/ul][/td]\r\n[/tr]\r\n[/table][/center]\r\n\r\n[h4 type=bar]Tips and Tricks[/h4]\r\n\r\n[ul][li]You need a decent amount of extra trash in Temple of Sethraliss to hit trash count.[/li]\r\n[li]Watch your knockback on [b]Adderis and Aspix[/b] as there's a group soak shortly after![/li]\r\n[li][b]Sand-Sworn Riders[/b] are deadly as they constantly summon extra adds that randomly bleed players. [/li]\r\n[li]On [b]Merektha[/b], there's a blue arrow that indicates who gets stunned so you can group up to use AoE CC.[/li]\r\n[li]The [b]Temple Disruptors[/b] only try to channel on the Eye of Sethraliss orb while it's active. CC the mob to finish the orb and have it follow you.[/li]\r\n[li]For the [b]Avatar of Sethraliss[/b], soaking the purple soaks stacks a healing done and a Physical damage taken debuff, so DPS should soak it.[/li]\r\n[li]The faster you AoE adds down on [b]Avatar of Sethraliss[/b] during the healing phase, the more adds will spawn.[/li]\r\n[/ul]\r\n[/tab]\r\n[tab name=\"Dungeon Journal\"]\r\nTemple of Sethraliss contains four dungeon bosses, starting with Adderis and Aspix, and ending with Avatar of Sethraliss. Each boss's dungeon journal entry is included in the tabs below.\r\n[pad]\r\n[tabs name=\"Temple of Sethralissbosses\"]\r\n[tab name=\"Adderis and Aspix\"]\r\n[html]\r\n<h3><img class=\"bossicons\" width=\"128\" height=\"64\" src=\"http://wow.zamimg.com/images/wow/journal/ui-ej-boss-adderisandaspix.png\" style=\"float:left;padding:10px\">Adderis and Aspix</h3><p>A pair of powerful sethrak that are blessed by the storm and charged with guarding the temple's entrance.</p>[/html]\r\n[pad]\r\n[tabs name=\"Adderis and Aspix-2142-details\"]\r\n[tab name=\"Overview\"][html]<ul>\r\n<li><div><span><b> Overview</b></span>: Adderis is a fearsome warrior, unleashing deadly electric attacks like his twofold strike <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1288049/thunder-and-lightning\">[Thunder and Lightning]</a></span>.<br />Aspix is a relentless caster, creating powerful winds that damage and disrupt.<br />Adderis and Aspix alternate being <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1310311/storm-blessed\">[Storm Blessed]</a></span>, which grants them immunity to damage.</div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Damage Dealers</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1310311/storm-blessed\">[Storm Blessed]</a></span> alternates between the sethrak duo which grants damage immunity.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1288049/thunder-and-lightning\">[Thunder and Lightning]</a></span> is a two part attack, the first of which inflicts damage divided evenly between players hit.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1310712/gale-force\">[Gale Force]</a></span> violently pushes players backwards.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Healers</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1288864/tempest-winds\">[Tempest Winds]</a></span> inflict damage to players upon creation.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1288049/thunder-and-lightning\">[Thunder and Lightning]</a></span> is a two part attack, the first of which inflicts damage divided evenly between players hit.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1310712/gale-force\">[Gale Force]</a></span> violently pushes players backwards.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Tanks</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1288428/overload\">[Overload]</a></span> causes Adderis to rapidly inflict additional Nature damage with each attack.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1288049/thunder-and-lightning\">[Thunder and Lightning]</a></span> is a two part attack, the first of which inflicts damage divided evenly between players hit.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1310712/gale-force\">[Gale Force]</a></span> violently pushes players backwards.</div></li>\r\n</ul>\r\n[/html][/tab]\r\n[tab name=\"Abilities\"][html]<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -84px;width:16px;height:19px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1310311\">Storm Blessed</a></b></span>: Adderis and Aspix call upon the power of the storm, granting them immunity to damage.<br />The duo will transfer this blessing between themselves as they get injured.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1292035\">Frenzy</a></b></span>: The loss of one partner sends the other into a wild frenzy, casting abilities with reckless abandon.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/npc=133379\">Adderis</a></b></span></div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1288049\">Thunder and Lightning</a></b></span>: <a href=\"/spell=1288092/thunder-and-lightning\" target=\"_blank\">Adderis dashes forward with his arcing blade, inflicting <!--pts1:0:0:1288092-->581894<!----> Nature damage divided evenly between all players within 8 yards.<br /><br />He then winds up a massive peal of thunder, inflicting <!--pts1:0:0:1288235-->40<!----> Nature damage to all enemies within 20 yards.</a></div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1288428\">Overload</a></b></span>: Adderis overloads with power for 8 sec, increasing his attack speed by <!--pts3:0:0:1308738-->100<!---->% and causing each of his melee strikes to inflict <!--pts1:0:0:1308740-->25<!---->% of their damage as additional Nature damage.</div></li>\r\n</ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/npc=133944\">Aspix</a></b></span></div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1288864\">Tempest Winds</a></b></span>: <a href=\"/spell=1288885/tempest-winds\" target=\"_blank\">Aspix targets players with furious winds, inflicting <!--pts1:0:0:1311808-->12<!----> Nature damage to players within <!--pts1:0:0:1288873-->8<!----> yards of the impacts.<br /><br />These winds build over time, coalescing into tempest zones for <!--difficulty:1--><!--difficulty--><!--difficulty:2--><!--difficulty--><!--difficulty:8--><!--difficulty--><!--difficulty:23-->2 min<!--difficulty--><!--difficulty:24--><!--difficulty--> that silence and pacify any players who contact them for 4 sec.</a> (Normal, Heroic)</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1288864\">Tempest Winds</a></b></span>: <a href=\"/spell=1288885/tempest-winds\" target=\"_blank\">Aspix targets players with furious winds, inflicting <!--pts1:0:0:1311808-->12<!----> Nature damage to players within <!--pts1:0:0:1288873-->8<!----> yards of the impacts.<br /><br />These winds build over time, coalescing into tempest zones for <!--difficulty:1--><!--difficulty--><!--difficulty:2--><!--difficulty--><!--difficulty:8--><!--difficulty--><!--difficulty:23-->2 min<!--difficulty--><!--difficulty:24--><!--difficulty--> that silence and pacify any players who contact them for 4 sec.</a><!--difficulty:8,23--><p class=\"ej-difficult\">On Mythic difficulty, Aspix targets multiple players with Tempest Winds.<br /></p><!--difficulty--> (Mythic+, Mythic)</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1289059\">Gale Force</a></b></span>: <a href=\"/spell=1310712/gale-force\" target=\"_blank\">Aspix launches gale force winds at players, inflicting <!--pts1:0:0:1310712-->77586<!----> Nature damage and pushing them away.</a></div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1288455\">Gust</a></b></span>: <a href=\"/spell=1288457/gust\" target=\"_blank\">Aspix blasts a player for <!--pts1:0:0:1288457-->58189<!----> Nature damage and an additional <!--pts2:0:0:1288457-->24246<!----> Nature damage every 1 sec for 4 sec.</a></div></li>\r\n</ul>\r\n</ul>[/html][/tab][/tabs][/tab]\r\n[tab name=\"Merektha\"]\r\n[html]\r\n<h3><img class=\"bossicons\" width=\"128\" height=\"64\" src=\"http://wow.zamimg.com/images/wow/journal/ui-ej-boss-merektha.png\" style=\"float:left;padding:10px\">Merektha</h3><p>Merektha is the product of foul experiments to produce an army of unstoppable beasts. With her clutch of eggs beginning to hatch, this mother is on the hunt for victims to serve as food for her ravenous children.</p>[/html]\r\n[pad]\r\n[tabs name=\"Merektha-2143-details\"]\r\n[tab name=\"Overview\"][html]<ul>\r\n<li><div><span><b> Overview</b></span>: <!--difficulty:8,23--><p>Merektha emerges and attacks players with <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289109/thunder-spit\">[Thunder Spit]</a></span> and <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1293048/serpentstorm\">[Serpentstorm]</a></span>. Occasionally, she sends out <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=263958/a-knot-of-snakes\">[Knots of Snakes]</a></span> to constrict players. Merektha eventually <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289205/hatch\">[Hatches]</a></span> snakes that attack players while she <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=264206/burrow\">[Burrows]</a></span> across the playspace.</p><!--difficulty--><!--difficulty:1,2,19,24,150,205,216,236--><p>Merektha emerges and attacks players with <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289109/thunder-spit\">[Thunder Spit]</a></span> and <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1293048/serpentstorm\">[Serpentstorm]</a></span>. She eventually <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289205/hatch\">[Hatches]</a></span> snakes that attack players while she <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=264206/burrow\">[Burrows]</a></span> across the playspace.</p><!--difficulty--></div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Damage Dealers</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289205/hatch\">[Hatch]</a></span> releases snakes that join the fight.<br />Toxic Viper's <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=267027/poison-spit\">[Poison Spit]</a></span> can be interrupted. (Normal, Heroic)</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Damage Dealers</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289205/hatch\">[Hatch]</a></span> releases snakes that join the fight.<br />Toxic Viper's <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=267027/poison-spit\">[Poison Spit]</a></span> can be interrupted.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=263958/a-knot-of-snakes\">[A Knot of Snakes]</a></span> stuns allies until destroyed or incapacitated. (Mythic+, Mythic)</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Healers</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1293048/serpentstorm\">[Serpentstorm]</a></span> inflicts significant damage to all players.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300227/burrowquake\">[Burrowquake]</a></span> damages the party while Merektha <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=264206/burrow\">[Burrows]</a></span>. (Normal, Heroic)</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Healers</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1293048/serpentstorm\">[Serpentstorm]</a></span> inflicts significant damage to all players.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=263958/a-knot-of-snakes\">[A Knot of Snakes]</a></span> damages allies while active.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300227/burrowquake\">[Burrowquake]</a></span> damages the party while Merektha <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=264206/burrow\">[Burrows]</a></span>. (Mythic+, Mythic)</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Tanks</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1290797/lightning-bite\">[Lightning Bite]</a></span> inflicts significant damage to Merektha's current target.<br />Storm Serpent's <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1291622/storm-catalyst\">[Storm Catalyst]</a></span> leaves <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289589/lingering-storm\">[Lingering Storm]</a></span> underneath the creature. (Normal, Heroic)</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Tanks</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1290797/lightning-bite\">[Lightning Bite]</a></span> inflicts significant damage to Merektha's current target.<br />Storm Serpent's <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1291622/storm-catalyst\">[Storm Catalyst]</a></span> leaves <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289589/lingering-storm\">[Lingering Storm]</a></span> underneath the creature.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1289205/hatch\">[Hatch]</a></span> releases snakes that join the fight. (Mythic+, Mythic)</div></li>\r\n</ul>\r\n[/html][/tab]\r\n[tab name=\"Abilities\"][html]<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -84px;width:16px;height:19px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1289205\">Hatch</a></b></span>: Snakes emerge from eggs within Merektha's chamber that attack players.</div></li>\r\n<ul>\r\n<li><div><span><b> Toxic Viper</b></span></div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -345px;width:17px;height:17px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=267027\">Poison Spit</a></b></span>: The Toxic Viper spits poison at a player, inflicting <!--pts1:0:0:267027-->116379<!----> Nature damage and an additional <!--pts2:0:0:267027-->29095<!----> Nature damage every 1 sec for 8 sec.</div></li>\r\n</ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/npc=62265\">Storm Serpent</a></b></span></div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1291622\">Storm Catalyst</a></b></span>: The Storm Serpent calls down a lightning strike at its location, inflicting <!--pts2:0:0:1291622-->290947<!----> Nature damage to all players within 4 yards of the impact zone and leaving behind <span style=\"color:#FFFFFF\">Lingering Storm</span>.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1289589\">Lingering Storm</a></b></span>: The pool of electricity inflicts <!--pts1:0:0:1289589-->96982<!----> Nature damage every 1 sec.</div></li>\r\n</ul>\r\n</ul>\r\n</ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=264206\">Burrow</a></b></span>: Merektha burrows through the ground, inflicting <!--pts1:0:0:264206-->290947<!----> Nature damage to any players caught in her path. Victims are knocked up and stunned for 4 sec.<br />A <span style=\"color:#FFFFFF\">Burrowquake</span> occurs while Merektha burrows.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1300227\">Burrowquake</a></b></span>: While burrowing, Merektha causes the ground to violently tremble, inflicting <!--pts1:0:0:1300227-->24246<!----> Nature damage to all players every 1 sec.</div></li>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=263958\">A Knot of Snakes</a></b></span>: Many small snakes wrap around the target, preventing any action and slowly suffocating the victim for <!--pts1:0:0:263958-->29095<!----> Physical damage every 1 sec.<br />Destroying or incapacitating the knot of snakes frees the victim, causing the clump to unravel and attack players. (Mythic, Mythic+)</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1290797\">Lightning Bite</a></b></span>: Merektha sinks her crackling fangs into her current target, inflicting <!--pts1:0:0:1290797-->533403<!----> Physical damage and an additional <!--pts1:0:0:1308838-->6<!----> Nature damage every 1 sec for 7 sec.</div></li>\r\n<li><div><span><b><img style=\"display:inline-block;vertical-align:-20%;\" alt=\"Spell Icon\" class=\"icons\" width=\"18\" height=\"18\" src=\"http://wow.zamimg.com/images/wow/icons/tiny/spell_shadow_plaguecloud.gif\" /> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1289109\">Thunder Spit</a></b></span>: Merektha spits volatile energy at players, inflicting <!--pts1:0:0:1298329-->6<!----> Nature damage and causing lightning to strike their location every 1 sec for 4 sec.<br />Each strike inflicts <!--pts2:0:0:1291734-->30<!----> Nature damage to all players within the impact zone and leaves behind <span style=\"color:#FFFFFF\">Lingering Storm</span>.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1289589\">Lingering Storm</a></b></span>: The pool of electricity inflicts <!--pts1:0:0:1289589-->96982<!----> Nature damage every 1 sec. (Mythic+, Mythic)</div></li>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1293048\">Serpentstorm</a></b></span>: Merektha exhales, knocking back all players and inflicting <!--pts1:0:0:1293048-->116379<!----> Nature damage and an additional <!--pts3:0:0:1293048-->29095<!----> Nature damage every 1 sec for 8 sec.<br /><span style=\"color:#FFFFFF\">Storm Strikes</span> occur across the chamber.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1296912\">Storm Strikes</a></b></span>: Lightning strikes across the chamber, inflicting <!--pts1:0:0:1296912-->290947<!----> Nature damage to players within 4 yards of the impacts.</div></li>\r\n</ul>\r\n</ul>[/html][/tab][/tabs][/tab]\r\n[tab name=\"Galvazzt\"]\r\n[html]\r\n<h3><img class=\"bossicons\" width=\"128\" height=\"64\" src=\"http://wow.zamimg.com/images/wow/journal/ui-ej-boss-galvazzt.png\" style=\"float:left;padding:10px\">Galvazzt</h3><p>With the corruption of her temple, Sethraliss' command of lightning has created twisted elementals that roam the sunken chambers. Formed by this aberrant energy, Galvazzt seeks to grow in power by any means.</p>[/html]\r\n[pad]\r\n[tabs name=\"Galvazzt-2144-details\"]\r\n[tab name=\"Overview\"][html]<ul>\r\n<li><div><span><b> Overview</b></span>: Galvazzt attempts to accumulate energy with <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1291598/lightning-spire\">[Lightning Spires]</a></span>. Players standing between Galvazzt and these spires become <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=266923/galvanized\">[Galvanized]</a></span>, preventing energy from flowing to Galvazzt.</div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Damage Dealers</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1291598/lightning-spire\">[Lightning Spires]</a></span> form at targeted locations, inflicting damage and knocking away any players struck.<br />Standing between Galvazzt and his <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1291598/lightning-spire\">[Lightning Spires]</a></span> prevents Galvazzt from unleashing <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=266512/consume-charge\">[Consume Charge]</a></span>.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Healers</b></span>: <br />Standing between Galvazzt and his <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1291598/lightning-spire\">[Lightning Spires]</a></span> prevents Galvazzt from unleashing <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=266512/consume-charge\">[Consume Charge]</a></span>.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=266923/galvanized\">[Galvanized]</a></span> inflicts significant damage to players.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Tanks</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1291598/lightning-spire\">[Lightning Spires]</a></span> form at targeted locations, inflicting damage and knocking away any players struck.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=266923/galvanized\">[Galvanized]</a></span> significantly increases Physical damage taken.</div></li>\r\n</ul>\r\n[/html][/tab]\r\n[tab name=\"Abilities\"][html]<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -84px;width:16px;height:19px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1291618\">Lightning Spire</a></b></span>: <a href=\"/spell=1291598/lightning-spire\" target=\"_blank\">Galvazzt coalesces electric energy at locations within his chamber, causing lightning strikes that inflict <!--pts1:0:0:1291598-->290947<!----> Nature damage to players within 5 yards and knock them back.<br /><br />A <span style=\"color:#FFFFFF\">Lightning Spire</span> forms from each strike that attempts to <span style=\"color:#FFFFFF\">Energize</span> Galvazzt. Players standing between the spire and Galvazzt become <span style=\"color:#FFFFFF\">Galvanized</span>.</a><!--difficulty:8,23--><p class=\"ej-difficult\">On Mythic difficulty, Galvazzt creates multiple <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1291618/lightning-spire\">[Lightning Spires]</a></span>.<br /></p><!--difficulty--></div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=265973\">Energize</a></b></span>: Each <span style=\"color:#FFFFFF\">Lightning Spire</span> increases the energy level of Galvazzt unless its connection with him becomes blocked.<br />If Galvazzt reaches 100 energy, he unleashes <span style=\"color:#FFFFFF\">Consume Charge</span>. He passively loses energy over time.</div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -46px;width:18px;height:18px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=266512\">Consume Charge</a></b></span>: Galvazzt consumes his energy to shock all players, inflicting <!--pts1:0:0:266512-->164870<!----> Nature damage and reducing their damage done by <!--pts4:0:0:266512-->50<!---->% for 20 sec.<br />Consuming the energy also grants Galvazzt a stack of <span style=\"color:#FFFFFF\">Capacitance</span>.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=266511\">Capacitance</a></b></span>: With each release of energy, Galvazzt's damage done increases by <!--pts1:0:0:266511-->25<!---->%.</div></li>\r\n</ul>\r\n</ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=266923\">Galvanized</a></b></span>: Galvazzt's spire inflicts <!--pts1:0:0:266923-->24246<!----> Nature damage every 0.5 sec but cannot <span style=\"color:#FFFFFF\">Energize</span> Galvazzt.<br />While afflicted, the victim takes <!--pts2:0:0:266923-->250<!---->% increased Physical damage.</div></li>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1290531\">Induction</a></b></span>: Galvazzt releases a pulse of electric energy, inflicting <!--pts1:0:0:1290531-->145473<!----> Nature damage to all enemies and creating an <span style=\"color:#FFFFFF\">Induction Field</span>.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1291815\">Induction Field</a></b></span>: A static field inflicts <!--pts1:0:0:1291815-->96982<!----> Nature damage every 1 sec to players standing within it.</div></li>\r\n</ul>\r\n</ul>[/html][/tab][/tabs][/tab]\r\n[tab name=\"Avatar of Sethraliss\"]\r\n[html]\r\n<h3><img class=\"bossicons\" width=\"128\" height=\"64\" src=\"http://wow.zamimg.com/images/wow/journal/ui-ej-boss-avatarofsethraliss.png\" style=\"float:left;padding:10px\">Avatar of Sethraliss</h3><p>The Heart of Sethraliss is in the grips of a terrible power that seeks to corrupt her. Her avatar must be restored before this evil takes root and she is reborn as a dark loa capable of destroying the whole of Vol'dun.</p>[/html]\r\n[pad]\r\n[tabs name=\"Avatar of Sethraliss-2145-details\"]\r\n[tab name=\"Overview\"][html]<ul>\r\n<li><div><span><b> Overview</b></span>: Essence Defilers arrive to channel <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1301199/defiling-taint\">[Defiling Taint]</a></span> upon the Avatar of Sethraliss until their defeat. As part of their assault, Corrupted Guardians appear whose <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300871/corrupted-lifeforce\">[Corrupted Lifeforce]</a></span> can be cleansed to heal the Avatar. Upon removal of <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1301199/defiling-taint\">[Defiling Taint]</a></span>, Faithless Tormentors fixate on the party's healer and attempt to strike them with <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300714/shadowlash\">[Shadowlash]</a></span>. The battle ends once players fully restore the Avatar.</div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Damage Dealers</b></span>: <br />Defeating all Essence Defilers cleanses the Avatar of <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1301199/defiling-taint\">[Defiling Taint]</a></span>.<br />The Avatar consumes <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300871/corrupted-lifeforce\">[Corrupted Lifeforce]</a></span> from Corrupted Guardians once purified.<br />After damaging Faithless Tormentors, the Avatar <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1302296/siphon-the-weak\">[Siphons the Weak]</a></span>.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Healers</b></span>: <br />The battle ends in victory once the Avatar reaches full health.<br />Essence Defilers' <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1301199/defiling-taint\">[Defiling Taint]</a></span> and Faithless Tormentors' <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300714/shadowlash\">[Shadowlash]</a></span> thwart healing.<br />The Avatar consumes <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300871/corrupted-lifeforce\">[Corrupted Lifeforce]</a></span> from Corrupted Guardians once purified.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Tanks</b></span>: <br />Corrupted Guardians inflict significant Physical and Shadow damage with <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300803/tainted-strike\">[Tainted Strike]</a></span>.<br />The Avatar consumes <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300871/corrupted-lifeforce\">[Corrupted Lifeforce]</a></span> from Corrupted Guardians once purified.<br />Essence Defilers' <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1301199/defiling-taint\">[Defiling Taint]</a></span> and Faithless Tormentors' <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300714/shadowlash\">[Shadowlash]</a></span> thwart healing.</div></li>\r\n</ul>\r\n[/html][/tab]\r\n[tab name=\"Abilities\"][html]<ul>\r\n<li><div><span><b> Stage One: Defiler's Corruption</b></span>: <br />Jakra'zet's allies arrive to prevent healing energy from reaching the Avatar.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/npc=166913\">Corrupted Guardian</a></b></span></div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -84px;width:16px;height:19px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302761\">Unstable Corruption</a></b></span>: Polluted energy erupts from the Corrupted Guardian, inflicting <!--pts1:0:0:1302761-->484663<!----> Shadow damage to players within 20 yards and forming <span style=\"color:#FFFFFF\">Corrupted Lifeforce</span>.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1300871\">Corrupted Lifeforce</a></b></span>: Touching <span style=\"color:#FFFFFF\">Corrupted Lifeforce</span> cleanses it, transferring <span style=\"color:#FFFFFF\">Corruption</span> to the player and releasing a <span style=\"color:#FFFFFF\">Corruption Burst</span>.<br />The Avatar can <span style=\"color:#FFFFFF\">Consume Lifeforce</span> once cleansed. Otherwise, a <span style=\"color:#FFFFFF\">Corruption Burst</span> occurs upon expiration of <span style=\"color:#FFFFFF\">Corrupted Lifeforce</span><span style=\"color:#FFFFFF\">Corrupted Lifeforce</span>. (Normal, Heroic)</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1300877\">Corruption</a></b></span>: The dark energy inflicts <!--pts1:0:0:1312214-->29095<!----> Shadow damage every 1 sec, reduces healing done by <!--pts2:0:0:1300877-->33<!---->%, and increases Physical damage taken by <!--pts3:0:0:1300877-->300<!---->% for 15 sec. This effect stacks.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302826\">Corruption Burst</a></b></span>: Dark energy explodes from the <span style=\"color:#FFFFFF\">Corrupted Lifeforce</span>, inflicting <!--pts1:0:0:1302826-->193965<!----> Shadow damage to all players and increasing damage taken from this ability by <!--pts2:0:0:1302826-->100<!---->% for 3 sec.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302895\">Consume Lifeforce</a></b></span>: The Avatar of Sethraliss consumes <span style=\"color:#FFFFFF\">Cleansed Lifeforce</span>, healing herself for <!--pts2:0:0:1300907-->2<!---->% of her maximum health and regenerating (<!--pts1:0:0:1300907-->1<!----> / 10)% of her maximum health every 2 sec. This effect stacks.</div></li>\r\n</ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1300871\">Corrupted Lifeforce</a></b></span>: Touching <span style=\"color:#FFFFFF\">Corrupted Lifeforce</span> cleanses it, transferring <span style=\"color:#FFFFFF\">Corruption</span> to the player and releasing a <span style=\"color:#FFFFFF\">Corruption Burst</span>.<br />The Avatar can <span style=\"color:#FFFFFF\">Consume Lifeforce</span> once cleansed. Otherwise, a <span style=\"color:#FFFFFF\">Corruption Burst</span> occurs upon expiration of <span style=\"color:#FFFFFF\">Corrupted Lifeforce</span><span style=\"color:#FFFFFF\">Corrupted Lifeforce</span>.<!--difficulty:8,23--><p class=\"ej-difficult\">On Mythic difficulty, multiple orbs of <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1300871/corrupted-lifeforce\">[Corrupted Lifeforce]</a></span> form.<br /></p><!--difficulty--> (Mythic+, Mythic)</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1300877\">Corruption</a></b></span>: The dark energy inflicts <!--pts1:0:0:1312214-->29095<!----> Shadow damage every 1 sec, reduces healing done by <!--pts2:0:0:1300877-->33<!---->%, and increases Physical damage taken by <!--pts3:0:0:1300877-->300<!---->% for 15 sec. This effect stacks.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302826\">Corruption Burst</a></b></span>: Dark energy explodes from the <span style=\"color:#FFFFFF\">Corrupted Lifeforce</span>, inflicting <!--pts1:0:0:1302826-->193965<!----> Shadow damage to all players and increasing damage taken from this ability by <!--pts2:0:0:1302826-->100<!---->% for 3 sec.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302895\">Consume Lifeforce</a></b></span>: The Avatar of Sethraliss consumes <span style=\"color:#FFFFFF\">Cleansed Lifeforce</span>, healing herself for <!--pts2:0:0:1300907-->2<!---->% of her maximum health and regenerating (<!--pts1:0:0:1300907-->1<!----> / 10)% of her maximum health every 2 sec. This effect stacks.</div></li>\r\n</ul>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1300803\">Tainted Strike</a></b></span>: The Corrupted Guardian attacks their current target with a brutal slash, inflicting <!--pts1:0:0:1300803-->484912<!----> Physical damage and an additional <!--pts1:0:0:1303446-->58189<!----> Shadow damage every 1 sec for 10 sec. This effect stacks.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302616\">Vile Charge</a></b></span>: The Corrupted Guardian charges to a player and strikes them, inflicting <!--pts1:0:0:1302618-->67888<!----> Shadow damage and an additional <!--pts2:0:0:1302618-->38793<!----> Shadow damage every 1 sec for 8 sec.</div></li>\r\n</ul>\r\n<li><div><span><b> Twisted Hexxer</b></span></div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -231px;width:16px;height:19px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302158\">Flame Shock</a></b></span>: The creature sears a player with fire, inflicting <!--pts1:0:0:1302158-->242456<!----> Fire damage and an additional <!--pts2:0:0:1302158-->77586<!----> Fire damage every 1 sec for 8 sec.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302153\">Latent Hex</a></b></span>: The creature afflicts a player for 4 sec, inflicting <!--pts1:0:0:1311979-->3<!----> Shadow damage every 1 sec.<br />Upon removal, shadowy energy inflicts <!--pts1:0:0:1311964-->8<!----> Shadow damage to players within <!--pts2:0:0:1302153-->10<!----> yards of the victim and releases <span style=\"color:#FFFFFF\">Hex Muck</span>.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1300684\">Hex Muck</a></b></span>: A mire of hex magic transforms players within it into a frog, rendering them unable to attack or cast spells and inflicting <!--pts5:0:0:1300684-->96982<!----> Nature damage every 2 sec.</div></li>\r\n</ul>\r\n</ul>\r\n<li><div><span><b> Essence Defiler</b></span></div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1301199\">Defiling Taint</a></b></span>: The Essence Defiler channels dark energy into the Avatar of Sethraliss, preventing all external healing.</div></li>\r\n</ul>\r\n</ul>\r\n<li><div><span><b> Stage Two: Tormentor's Fixation</b></span>: <br />Faithless Tormentors attempt to disrupt the Avatar's restoration.</div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Faithless Tormentor</b></span></div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1300714\">Shadowlash</a></b></span>: <a href=\"/spell=1300702/shadowlasher\" target=\"_blank\">The creature attempts to fixate upon the closest enemy healer and reduces their healing done upon striking by <!--pts1:0:0:1300714-->5<!---->%. This effect stacks.</a></div></li>\r\n</ul>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/npc=133392\">Avatar of Sethraliss</a></b></span>: The battle concludes upon full restoration of the Avatar of Sethraliss.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1302296\">Siphon the Weak</a></b></span>: The Avatar of Sethraliss siphons essence from Faithless Tormentors below <!--pts1:0:0:1302292-->25<!---->% health, killing them instantly and healing for (<!--pts1:0:0:1302298-->7<!----> / 10)% of her maximum health.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/ptr/spell=1301253\">Agony of Sethraliss</a></b></span>: The chamber of Sethraliss lashes out with an electric jolt, inflicting <!--pts1:0:0:1301253-->242456<!----> Nature damage to players within 4.5 yards of impact.</div></li>\r\n</ul>\r\n</ul>[/html][/tab][/tabs]\r\n[/tab]\r\n[/tabs]\r\n[/tab]\r\n[/tabs]\r\n\r\n\r\n[h2 type=bar toc=\"Gear Drops\"]All Gear Drops from Temple of Sethraliss in Patch 12.1[/h2]\r\nEach boss in Temple of Sethraliss drops particular gear, including weapons, trinkets, and more. The tabs below detail the available gear drops from Temple of Sethraliss, along with the item levels of drops in Mythic+. \r\n[pad]\r\n[tabs name=\"Templegear\"]\r\n[tab name=\"Gear Drops\"]\r\n[center][table class=\"grid\" width=60%]\r\n[tr background=black][td][b]Item[/b][/td][td][b]Slot[/b][/td][td][b]Boss Drop[/b][/td][/tr]\r\n[tr][td][item=159263 bonus=9024][/td][td]Cloth Wrist[/td][td]Adderis and Aspix[/td][/tr]\r\n[tr][td][item=159259 bonus=9024][/td][td]Cloth Feet[/td][td]Adderis and Aspix[/td][/tr]\r\n[tr][td][item=159255 bonus=9024][/td][td]Cloth Waist[/td][td]Merektha[/td][/tr]\r\n[tr][td][item=159247 bonus=9024][/td][td]Cloth Hands[/td][td]Galvazzt[/td][/tr]\r\n[tr][td][item=239031 bonus=9024][/td][td]Cloth Shoulder[
