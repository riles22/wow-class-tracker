<script>WH.markup.printHtml("[toc]\r\n[npc=252959] is the Lair boss of the [zone=16671] raid featured in Patch 12.1 of the Midnight expansion. Learn all of the essentials for defeating this Lair boss, including a handy boss strategy cheat sheet, all rewards, and more.\r\n\r\n[pad]\r\n[grid column-width=1000 align=centered]\r\n[div style=\"background:#222222;padding:10px; border:2px solid #8c1515;  border-radius: 10px;\"]\r\n[h2 type=bar toc=\"Release Date\"]The Tidebound Grotto Release Dates[/h2]\r\n[ul]\r\n[li][b]Week of August 11:[/b] World Difficulty Available[/li]\r\n[li][b]Week of August 18:[/b] Normal, Heroic, and Flexible Mythic Available[/li]\r\n[/ul]\r\n[/div][/grid]\r\n\r\n\r\n[div class=clear][/div]\r\n[center][wrapper width=90%]\r\n[nav]\r\n[nav-item=/guide/midnight/patch-12-1-overview-features-activities-rewards icon=inv_121_trinket_dungeon_ulatek_writhe]Patch 12.1 Overview[/nav-item]\r\n[nav-item=/guide/midnight/the-coiled-isle-zone-rares-treasures-unlock-location icon=inv_achievement_zone_zulaman]The Coiled Isle[/nav-item]\r\n[nav-item=/guide/midnight/zuljarras-forces-renown-reputation-farming-rewards icon=inv_glaive_1h_outdooramaniloa_c_01]Zul'jarra's Forces Renown[/nav-item]\r\n[nav-item=/guide/midnight/vaults-of-atalutek-patch-12-1-zone-activities-rewards-player-power icon=8032876]The Vaults of Atal'Utek[/nav-item]\r\n[nav-item=/guide/midnight/cursed-surges-fishing-captain-tokka-reputation-patch-12-1 icon=inv_faction_tortollanseekers]Cursed Surges & Capt. Tokka[/nav-item]\r\n[nav-item=/guide/midnight/raids/the-venomous-abyss-overview-location-rewards-bosses icon=8039569]The Venomous Abyss Raid[/nav-item]\r\n[nav-item=/guide/midnight/altar-of-fangs-dungeon-overview-location-rewards icon=inv_achievement_dungeon_altaroffangs]Altar of Fangs Dungeon[/nav-item]\r\n[nav-item=/guide/midnight/nymrissa-wavecaller-tidebound-grotto-lair-boss-strategy-rewards icon=achievement_boss_elitenagamale]The Tidebound Grotto Lair[/nav-item]\r\n[nav-item=/guide/midnight/mythic-plus-season-overview icon=inv_achievement_raid_fungarian]Delves[/nav-item]\r\n[nav-item=/guide/midnight/mounts-patch-12-1-models-locations icon=inv_flyingserpentmount]Patch 12.1 Mounts[/nav-item]\r\n[nav-item=/guide/midnight/housing-and-decor-updates icon=7808368]Patch 12.1 Decor[/nav-item]\r\n[/nav]\r\n[/wrapper][/center][div class=clear][/div]\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n[h2 type=bar toc=\"Location\"]The Tidebound Grotto Lair Location in Patch 12.1[/h2]\r\nThe Tidebound Grotto Lair is located in [zone=16365], in the bed of water towards the eastern part of the zone. Players must swim down to the Lair entrance, so have an aquatic mount ready for easy travel! \r\n[grid column-width=500 align=centered]\r\n[div][center]/way #2512 59.9 66.3 The Tidebound Grotto Lair Entrance\r\n[map zone=16365]\r\n[pin x=59.9 y=66.3 type=1]The Tidebound Grotto Lair Entrance[/pin]\r\n[/map][/center]\r\n[/div]\r\n[div]\r\n[pad][pad][pad][center][screenshot id=1291433 height=325 size=normal border=2 alt=\"The Tidebound Grotto\"][/screenshot][/center][/div][/grid]\r\n\r\n[h2 type=bar toc=\"Queueing\"]How to Queue for The Tidebound Grotto in Patch 12.1[/h2]\r\nQueueing for The Tidebound Grotto Lair functions similarly to Delves. Solo players can queue into a group on [b]World Difficulty only[/b], with the recommended item level being 230. \r\n\r\nAfter selecting Enter, you're put into the instance while other players join. While the group fills, players will take down trash and elite mobs until the Boss appears, allowing a healthy number of players to join the instance before the boss fight starts. World difficulty allows up to 40 players to join an instance.\r\n\r\n[center][screenshot id=1292574 width=500 size=normal border=2 alt=\"Tidebound Grotto UI Menu\"][/screenshot][/center]\r\n\r\nPremade groups can take on the Tidebound Grotto on Normal, Heroic, and Mythic difficulties, but are limited to 30 players for Normal and Heroic, and 25 players for Mythic. For premade groups, the leader must choose the difficulty and enter the instance before others can. Once the leader is inside, the rest of the group can enter. \r\n\r\n[h2 type=bar toc=\"Strategy & Abilities\"]Nymrissa Wavecaller Strategy and Abilities for The Tidebound Grotto in Patch 12.1[/h2]\r\n[npc=252959] is the boss of [zone=16671] Lair and can be fought on multiple difficulties, from World up to Mythic Flex. Nymrissa Wavecaller is the only boss in Midnight: Season 2 that offers the Flexible Mythic difficulty and counts towards the [b]Raid row of the Great Vault[/b] when defeated.\r\n\r\nNymrissa Wavecaller has one phase of mechanics that cycles until the boss is defeated. \r\n[pad]\r\n[tabs name=\"bossinfo\" size=\"thin\"]\r\n[tab name=\"Boss Cheat Sheet\"]\r\n[center][b][i]Boss Cheat Sheet Coming Soon![/i][/b][/center]\r\n[/tab]\r\n[tab name=\"Dungeon Journal\"]\r\n[html]\r\n<h3><img class=\"bossicons\" width=\"128\" height=\"64\" src=\"http://wow.zamimg.com/images/wow/journal/ui-ej-boss-nagasorcerer.png\" style=\"float:left;padding:10px\">Nymrissa Wavecaller</h3><p>Nymrissa Wavecaller commands the restless sea itself, concealing her lair beneath shifting tides. Those who dare uncover her sanctuary find her murloc minions eager to answer their mistress' call.</p>[/html]\r\n[pad]\r\n[tabs name=\"Nymrissa Wavecaller-2849-details\"]\r\n[tab name=\"Overview\"][html]<ul>\r\n<li><div><span><b> Overview</b></span>: Nymrissa Wavecaller creates an <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1257717/alluring-bubble\">[Alluring Bubble]</a></span> within the grotto that lures nearby murlocs into her grasp. She then summons <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1258668/swirling-whirlpools\">[Swirling Whirlpools]</a></span> to break the bubble, empowering murlocs within.</div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Tank</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1258901/water-jet\">[Water Jet]</a></span> inflicts sustained damage to Nymrissa Wavecaller's current target, and removes icy patches of <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1257654/lingering-frost\">[Lingering Frost]</a></span>.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1257717/alluring-bubble\">[Alluring Bubble]</a></span> attracts a large group of Bubblefin Shorerunners to rush toward the giant bubble.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -123px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Tank</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1282937/iceblade-flurry\">[Iceblade Flurry]</a></span> inflicts sustained damage to Nymrissa Wavecaller's current target.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1257717/alluring-bubble\">[Alluring Bubble]</a></span> attracts a large group of Bubblefin Shorerunners to rush toward the giant bubble. (Normal, Heroic)</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Healer</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1260837/abyssal-rain\">[Abyssal Rain]</a></span> inflicts significant damage to all players.<br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1257717/alluring-bubble\">[Alluring Bubble]</a></span> inflicts a large burst of damage to all players when it <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1258150/pop\">[Pops!]</a></span></div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Damage Dealers</b></span>: <br /><span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1257717/alluring-bubble\">[Alluring Bubble]</a></span> attracts a large group of Bubblefin Shorerunners to rush toward the giant bubble.<br />Murlocs that enter a <span style=\"color: #2959D3\"><a style=\"color:#2959D3\" href=\"/spell=1257717/alluring-bubble\">[Alluring Bubble]</a></span> become empowered.</div></li>\r\n</ul>\r\n[/html][/tab]\r\n[tab name=\"Abilities\"][html]<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -84px;width:16px;height:19px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1257717\">Alluring Bubble</a></b></span>: Nymrissa gathers water from the grotto and forms a massive bubble of swirling liquid.<br />The bubble entrances curious murlocs, drawing them in.<!--difficulty:16--><p class=\"ej-difficult\">On Mythic difficulty, Bubblefin Frostscales emerge from the grotto's depths.</p><!--difficulty--> (Heroic, Normal)</div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Bubblefin Shorerunner</b></span>: Murlocs heed the call of the bubble and swarm toward it.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -46px;width:18px;height:18px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Bubblefin Berserker</b></span>: Murlocs that enter the bubble transform into Bubblefin Berserkers.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1258894\">Pulsing Tides</a></b></span>: <a href=\"/spell=1271380/pulsing-tides\" target=\"_blank\">Bubblefin Berserkers pulse with the power of the deeps, inflicting <!--pts1:0:0:1271380-->494351<!----> Frost damage to all players every 3 sec.</a></div></li>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1258150\">Pop!</a></b></span>: The bubble pops, unleashes a surge of pressurized water that inflicts <!--pts1:0:0:1266340-->50<!----> Frost damage to all players and knocks them away.</div></li>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -84px;width:16px;height:19px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1257717\">Alluring Bubble</a></b></span>: Nymrissa gathers water from the grotto and forms a massive bubble of swirling liquid.<br />The bubble entrances curious murlocs, drawing them in.<!--difficulty:16--><p class=\"ej-difficult\">On Mythic difficulty, Bubblefin Frostscales emerge from the grotto's depths.</p><!--difficulty--></div></li>\r\n<ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Bubblefin Shorerunner</b></span>: Murlocs heed the call of the bubble and swarm toward it.</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -159px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Bubblefin Frostscale</b></span>: A deepwater murloc that protects nearby allies.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1273091\">Waterfog Shield</a></b></span>: The Bubblefin Frostscale projects a watery membrane that reduces the damage taken by nearby murlocs by <!--pts1:0:0:1273150-->99<!---->%.</div></li>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -46px;width:18px;height:18px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  Bubblefin Berserker</b></span>: Murlocs that enter the bubble transform into Bubblefin Berserkers.</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1258894\">Pulsing Tides</a></b></span>: <a href=\"/spell=1271380/pulsing-tides\" target=\"_blank\">Bubblefin Berserkers pulse with the power of the deeps, inflicting <!--pts1:0:0:1271380-->494351<!----> Frost damage to all players every 3 sec.</a></div></li>\r\n</ul>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -195px;width:16px;height:16px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1258150\">Pop!</a></b></span>: The bubble pops, unleashes a surge of pressurized water that inflicts <!--pts1:0:0:1266340-->50<!----> Frost damage to all players and knocks them away.</div></li>\r\n</ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1258668\">Swirling Whirlpools</a></b></span>: Nymrissa awakens whirlpools within the grotto that surge toward the <span style=\"color:#FFFFFF\">Alluring Bubble</span>.<br />The whirlpools inflict <!--pts1:0:0:1258677-->100<!----> Frost damage to players in their path. (Normal)</div></li>\r\n<li><div><span><b><span style=\"background:url(http://wow.zamimg.com/images/wow/journal/ejiconsprite.png) no-repeat -10px -46px;width:18px;height:18px;display:inline-block;vertical-align:-20%;\" class=\"icons\"></span>  <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1258668\">Swirling Whirlpools</a></b></span>: Nymrissa awakens whirlpools within the grotto that surge toward the <span style=\"color:#FFFFFF\">Alluring Bubble</span>.<br />The whirlpools inflict <!--pts1:0:0:1258677-->100<!----> Frost damage to players in their path. (Heroic)</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1313393\">Chilling Frost</a></b></span>: Nymrissa chills players to the bone, inflicting <!--pts3:0:0:1313393-->98870<!----> Frost damage every 1.5 sec and decreasing their movement speed by <!--pts2:0:0:1313393-->15<!---->% for <!--difficulty:14--><!--difficulty--><!--difficulty:15-->6 sec<!--difficulty--><!--difficulty:233--><!--difficulty--><!--difficulty:250--><!--difficulty-->.<br />Each impact leaves behind a <span style=\"color:#FFFFFF\">Frost Orb</span> at the player's location. (Normal)</div></li>\r\n<ul>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1313402\">Frost Orb</a></b></span>: A frozen orb that clings to the player when touched, inflicting <!--pts1:0:0:1313448-->20<!----> Frost damage and an additional <!--pts2:0:0:1313448-->15<!----> Frost damage every 2 sec for 16 sec. <!--difficulty:15--><!--difficulty--><!--difficulty:16-->Increases damage taken from <span style=\"color:#FFFFFF\">Frost Orb</span> by <!--pts3:0:0:1313448-->15<!---->% for 16 sec. These effects stacks.<!--difficulty--><br />Leaves behind <span style=\"color:#FFFFFF\">Lingering Frost</span>.</div></li>\r\n<li><div><span><b> <a target=\"_blank\" href=\"https://www.wowhead.com/spell=1257654\">Lingering Frost</a></b></span>: Inflicting <!--pts1:0:0:1257654-->24718<!---
