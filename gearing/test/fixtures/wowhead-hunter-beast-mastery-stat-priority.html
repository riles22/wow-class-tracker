<script>WH.markup.printHtml("[db=live]Stats are a key component of customizing your Beast Mastery Hunter in Midnight. Having the right distribution of stats on your gear can be critical towards optimizing your performance. \r\n\r\nThis guide details the best stat priority for your Beast Mastery Hunter, as well as covering how to determine Beast Mastery Hunter stat priorities personalized for your character in [b]Midnight Season 2[/b], as well as how to check whether an item Best-in-Slot, an upgrade, or outright bad.\r\n\r\nIt also covers Beast Mastery Hunter's preferred stats in-depth, accounting for nuances and synergies for niche situations that go beyond a generic priority.\r\n\r\n[pad]\r\n[center][wrapper width=80%]\r\n[nav]\r\n[nav-item=guide/classes/hunter/beast-mastery/overview-pve-dps]Overview[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/bis-gear]BiS Gear[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/rotation-cooldowns-pve-dps]Rotation[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/talent-builds-pve-dps]Talent Builds[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/enchants-gems-pve-dps]Consumables[/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/stat-priority-pve-dps][color=white]Stats[/color][/nav-item]\r\n[nav-item=guide/classes/hunter/beast-mastery/basics icon=Inv_misc_groupneedmore]Basics[/nav-item]\r\n[/nav][/wrapper][/center]\r\n[pad]\r\n[toc]\r\n[pad]\r\n\r\n[h2 toc=\"Stat Recommendations\" type=bar][icon name=ability_hunter_posthaste color=c3 inline=true size=medium type=round][/icon] Best Stats for Beast Mastery Hunter[/h2]\r\n[pad]\r\n\r\n\r\nThe stat priority is almost identical in all situations. [symbol=wow-hero-talent-pack-leader] [color=orange-gem]Pack Leader[/color] wants [b]Weapon Damage[/b], followed by [b]Agility[/b], then [b]Mastery[/b], [b]Critical Strike[/b], [b]Haste[/b] and finally [b]Versatility[/b], in every situation. This same priority can be applied to [symbol=wow-hero-talent-dark-ranger] [color=purple-gem]Dark Ranger[/color] in AoE. [symbol=wow-hero-talent-dark-ranger] [color=purple-gem]Dark Ranger[/color] single-target swaps [b]Mastery[/b] and [b]Critical Strike[/b] as the most important secondary stat.\r\n\r\nIt's important to note that the gap between your two highest secondary stats and [b]Haste[/b] is much larger on AoE than on single-target. It's also important to know that gear from [url guide=34252]Ula'tek[/url] provide a large amount of [b]Critical Strike[/b], while sacrificing other stats. Thus, having or not having that gear can make a large impact on your general stat priority.\r\n\r\nThis priority does not indicate you should aim for exclusively items with your two strongest secondary stats, but only that you should have more of those two than the rest. You should always aim to [url=https://www.raidbots.com/simbot/topgear]sim yourself[/url] to figure out the best setup for your particular scenario.\r\n\r\n[grid column-width=300 align=centered]\r\n[div style=\"border:1px solid #F48905; padding:10px;\"]\r\n[center][symbol=wow-hero-talent-pack-leader] [b][color=orange-gem]Pack Leader[/color] Stat Priority[/b][/center]\r\n[b]All Situations:[/b]\r\n[ol]\r\n[li]Weapon Damage[/li]\r\n[li]Agility[/li]\r\n[li]Mastery[/li]\r\n[li]Critical Strike[/li]\r\n[li]Haste[/li]\r\n[li]Versatility[/li]\r\n\r\n[/ol]\r\n\r\n\r\n[/div][div style=\"border:1px solid #B957FC; padding:10px;\"]\r\n[center][symbol=wow-hero-talent-dark-ranger] [b][color=purple-gem]Dark Ranger[/color] Stat Priority[/b][/center]\r\n[b]Single-Target:[/b]\r\n[ol]\r\n[li]Weapon Damage[/li]\r\n[li]Agility[/li]\r\n[li]Critical Strike[/li]\r\n[li]Mastery[/li]\r\n[li]Haste[/li]\r\n[li]Versatility[/li]\r\n[/ol]\r\n\r\n[b]AoE:[/b]\r\n[ol]\r\n[li]Weapon Damage[/li]\r\n[li]Agility[/li]\r\n[li]Mastery[/li]\r\n[li]Critical Strike[/li]\r\n[li]Haste[/li]\r\n[li]Versatility[/li]\r\n[/ol]\r\n[/div][/grid]\r\n\r\nWhile not unlimited, gearing provides considerable freedom when customizing stats. Following the suggestions below, we've tailored recommendations of best-in-slot gear to seek during [b]Midnight Season 2[/b] for [color=hunter]Beast Mastery Hunter[/color] in our Gearing Guide. \r\n[pad]\r\n[center][cta-button=guide/classes/hunter/beast-mastery/bis-gear color=hunter icon=inv_chest_chain_03]Beast Mastery Hunter Gearing Guide[/cta-button][/center]\r\n\r\n[h2 type=bar][icon name=ability_hunter_bestialdiscipline color=c3 inline=true size=medium type=round][/icon] Stats Explained[/h2]\r\n\r\n[ul][li][b]Agility[/b] is your Primary stat. Agility increases your Attack Power and damage done on abilities. [/li]\r\n[li] [b]Weapon DPS[/b] increases the damage done by your weapon and abilities that scale off weapon damage, which will be most of your abilities. This stat will generally mean that increasing the item level of your weapon is highly impactful.[/li][/ul]\r\n\r\nFor Secondary stats, the [color=hunter]Beast Mastery Hunter[/color] has the following:\r\n\r\n[ul]\r\n[li][b]Critical Strike[/b]: Gives abilities a chance to strike for twice as much damage. In addition, Critical Strike also has special interactions with the [spell=392054], [spell=468701] and [spell=459550] talents. All of your pets inherit your Critical Strike chance. [/li]\r\n[li][b]Haste[/b]: Haste increases your passive Focus regeneration and reduces the cooldown of [spell=217200] and [spell=34026]. It also increases your auto-attack speed (which means more [spell=1264781] and [spell=468695] procs). Finally, Haste reduces the time of your global cooldown (GCD). This means that the more Haste you have, the smoother your rotation will be. All of your pets inherit your Haste for their attack speed.[/li]\r\n[li][b]Mastery[/b]: [spell=76657] is a simple damage increase to all of your pets (including talents that summon any kind of beast, like [spell=120679]). This also includes AoE damage that comes from your pets, such as [spell=199530] and [spell=115939]. It also increases the damage of your shots by half of that value. [/li]\r\n[li][b]Versatility[/b]: Increases all damage dealt and reduces all damage taken. This has increased value when using traits and trinkets that deal direct damage.[/li]\r\n[/ul]\r\n\r\n\r\n\r\n\r\n[h2 toc=\"Simulations\" type=bar][icon name=inv_worserobot color=c3 inline=true size=medium type=round][/icon] Sim Your Beast Mastery Hunter[/h2]\r\nThe suggestions for stat priorities mentioned above are generic; exact values will change based on your gear. To gain a proper understanding of your optimal stats, we recommend [b]simming your character[/b] using various tools available in the community, such as [url guide=4885]SimulationCraft[/url]. You can easily sim your character and identify your stat priority with Raidbots, an online platform! Explore more about Raidbots in our [url guide=6050]comprehensive guide[/url]. \r\n[pad]\r\n[h4]Simulate Your Character Now[/h4]\r\n[center][raid-bots-form=gear][/center]\r\n[pad]\r\nComplete the fields above to go to [url=https://www.raidbots.com]Raidbots[/url] and find out the best stats for your character right now!\r\n\r\n[h2 toc=\"Diminishing Returns\" type=bar][icon name=spell_chargenegative color=c3 inline=true size=medium type=round][/icon] Diminishing Returns in Midnight[/h2]\r\n[pad]\r\nAccumulating too much of one Secondary stat from your gear leads to diminishing returns. This means that adding more of the same stat beyond certain thresholds results in reduced benefits. These thresholds are fixed and reduce the amount gained from more of that stat rating by 10% per breakpoint. Each stat has a different rating threshold where the reduction begins:\r\n\r\n[ul]\r\n[li][b]Critical Strike[/b] - Above 1380 rating[/li]\r\n[li][b]Haste[/b] - Above 1320 rating[/li]\r\n[li][b]Mastery[/b] - Above 1380 rating[/li]\r\n[li][b]Versatility[/b] - Above 1620 rating[/li]\r\n[/ul]\r\n[pad]\r\n\r\n[quote]\r\n[b]Example[/b]\r\nLet's assume you gain 1% Haste for 10 Haste Rating. When above the diminishing return breakpoint, 10 Haste Rating would give you 0.9% Haste instead, resulting in a 10% reduction from what you gained previously.\r\n[/quote]\r\n\r\nNote that this system [b]only counts stat rating[/b], meaning that percentage-based procs and effects like [spell=2825] aren't factored in and will always grant their full benefit.\r\n\r\nYou can learn more about stat diminishing returns in our detailed guide: [br][pad][br][center][cta-button guide=11052]What are Stat Diminishing Returns[/cta-button][/center]\r\n\r\n \r\n\r\n[hr]\r\nOur Beast Mastery Hunter guides are always updated with the latest information from in-game experience, simulations, and logs. Make sure to check our changelog for this page by clicking on [b]View Changelog[/b] in the Quick Facts column or on the book icon at the top of the page. If you are interested in more in-depth Beast Mastery Hunter guides for [b]Midnight Season 2[/b], make sure to browse the [i]Navigation Bar[/i] at the top of the page.\r\n[pad]\r\n\r\n\r\n[ul]\r\n\r\n[minibox float=left][url=https://www.wowhead.com/beast-mastery-hunter-rotation-guide]Previous Page:\r\nRotation, Priority, and Abilities[/url][/minibox]\r\n[minibox float=right][url=https://www.wowhead.com/beast-mastery-hunter-gear-guide]Next Page:\r\nGear[/url][/minibox]\r\n[/ul]\r\n[br]\r\n[br]\r\n[pad]\r\n[hr]\r\n[h2 toc=false]Feedback[/h2]\r\n\r\nThanks for reading our class guides! If you have any feedback, feel free to leave a comment in the section below, and we will reply as quickly as possible. If you'd like to talk with any of our writers directly, you can do so by joining our [url=http://discord.gg/wowhead]Discord server[/url] and finding them there!\r\n\r\n[pad][br][pad]", "guide-body", { allow: WH.markup.CLASS_GUIDE });</script>
</body></html>
