r\n\r\n[grid column-width=1000 align=centered]\r\n[div style=\"background:#222222;padding:10px; border:2px solid #8c1515;  border-radius: 10px;\"]\r\n\r\n[grid column-width=470 align=centered]\r\n[div]\r\n[b]Gear Drops:[/b]\r\n[ul]\r\n[li]There are eight bosses in The Venomous Abyss raid, with later bosses dropping gear with higher item levels.[/li]\r\n[li]Gear drops from raids follow the Group Loot system, where players roll \"Need\" or \"Greed\" on gear based on their class and specialization.[/li]\r\n[/ul]\r\n[b]Bonus Loot Rolls:[/b]\r\n[ul]\r\n[li]After defeating a raid boss, players can spend their [currency=3418][color=white][u]s[/u][/color] on Bonus Loot, earning an additional piece of gear from a separate Bonus Loot table for their class.[/li]\r\n[li]Once a certain piece of gear is earned, it is removed from the Bonus Loot table and cannot be earned again.[/li]\r\n[/ul]\r\n[/div][div]\r\n[b]Great Vault Drops:[/b]\r\n[ul]\r\n[li]Defeating raid bosses fills the [b]Raid[/b] row of the Great Vault.[/li] \r\n[li]To maximize raid Great Vault loot, players must defeat 6 raid bosses.[/li]\r\n[li]Great Vault loot is randomized from the loot pools of bosses you have defeated.[/li]\r\n[/ul]\r\n[b]Tier Set Armor Drops:[/b]\r\n[ul]\r\n[li]Tier Set armor drops from bosses 2-6 in The Venomous Abyss raid.[/li]\r\n[li]The last boss, [npc=268956], drops a Curio token for all classes to roll on. This Curio token can be exchanged for a Tier Set armor piece of the player's choice.[/li]\r\n[/ul]\r\n[/div][/grid]\r\n[/div][/grid]\r\n\r\n[h2 type=bar toc=\"Raid Rewards Buffed\"]Raid Rewards Buffed in Midnight Patch 12.1[/h2]\r\nThe Venomous Abyss sees a few buffs to its rewards in Patch 12.1:\r\n[ul]\r\n[li]The item level of Raid rewards in the Great Vault is increased across all difficulties:[/li]\r\n[ul][li]LFR gear choices drop at Champion 1/6 item level (292).[/li]\r\n[li]Normal gear choices drop at Hero 1/6 item level (305).[/li]\r\n[li]Heroic gear choices drop at Myth 1/6 item level (318).[/li]\r\n[li]Mythic gear choices drop at Myth 6/6 item level (334).[/li]\r\n[/ul]\r\n[li]Very Rare items and items from the last two bosses on Mythic difficulty drop at Myth 9 item level (344).[/li]\r\n[li]The bonus roll token is available on the Great Vault vendor immediately.[/li]\r\n[li]Starting on Week 8 of the patch, one Bonus Roll will be available from Orin Straylight near the Catalyst in Silvermoon each week, meaning you don't have to head to Voidstorm.[/li]\r\n[li]Bonus Rolls used in Raids now cost 1 Bonus Roll token rather than 2.[/li]\r\n[/ul]\r\n\r\n[h2 type=bar toc=\"Gear Drops\"]All Gear Drops For The Venomous Abyss Raid in Midnight Patch 12.1[/h2]\r\nEach tab details the gear drops from each boss in The Venomous Abyss raid, including the item level of drops, Tier Set armor, and Mistcrest drops by difficulty.\r\n[pad][pad]\r\n[tabs name=\"geardrops\" size=\"thin\"]\r\n[tab name=\"Nek'zali the Soulcoiler\"]\r\n[center][table class=grid width=55%]\r\n[tr background=black][td align=center][b]Difficulty[/b][/td][td align=center background=black][b]Item Level of Drops[/b][/td][td align=center][b]Mistcrests[/b][/td][/tr]\r\n[tr][td align=center][pad]LFR[/td][td align=center]279\r\n[i]Veteran 1/6[/i][/td][td align=center][pad][currency=3443][/td][/tr]\r\n[tr][td align=center][pad]Normal[/td][td align=center]292\r\n[i]Champion 1/6[/i][/td][td align=center][pad][currency=3444][/td][/tr]\r\n[tr][td align=center][pad]Heroic[/td][td align=center]305\r\n[i]Hero 1/6[/i][/td][td align=center][pad][currency=3445][/td][/tr]\r\n[tr][td align=center][pad]Mythic[/td][td align=center]318\r\n[i]Myth 1/6[/i][/td][td align=center][pad][currency=3446][/td][/tr]\r\n[/table][/center]\r\n\r\n[center][table class=\"grid\" width=55%]\r\n[tr background=black][td width=45%][b]Item[/b][/td][td][b]Slot[/b][/td][/tr]\r\n[tr][td][item=268236 bonus=13335:12854][/td][td]Cloth Legs[/td][/tr]\r\n[tr][td][item=268218 bonus=13335:12854][/td][td]Cloth Feet[/td][/tr]\r\n[tr][td][it 854][/td][td]Mail Feet[/td][/tr]\r\n[tr][td][item=271444 bonus=13335:12854][/td][td]Plate Shoulders[/td][/tr]\r\n[tr][td][item=271445 bonus=13335:12854][/td][td]Plate Waist[/td][/tr]\r\n[tr][td][item=271638 bonus=13335:12854][/td][td]Necklace[/td][/tr]\r\n[/table][/center]\r\n[/tab]\r\n[/tabs]\r\n\r\n[h3 toc=false]How Many Gear Pieces Drop Per Boss?[/h3]\r\nThe number of gear pieces that drop from a boss is proportional to the number of players in the raid. With 10 players, the raid is guaranteed 2 drops per boss, with each additional player adding a 20% chance for an additional piece of loot to drop. In other words, every 5 players drops another guaranteed piece of gear.\r\n\r\nTier set token drops follow a similar formula, but instead of a 20% increase, it is 10%. Starting with 10 players, raid bosses will drop one tier set token, with every 10 additional players guaranteeing another tier token to drop.\r\n\r\n[h2 type=bar toc=\"Tier Set Armor\"]Tier Set Armor From The Venomous Abyss Raid in Midnight Patch 12.1[/h2]\r\nIn The Venomous Abyss, bosses 2 through 6 drop Tier Set armor tokens, while the final boss, Ula'tek, drops a [item=270909] for all classes to roll on. Slumbering Coil Curios can be exchanged for a Tier Set armor piece of the player's choice. \r\n\r\nTier tokens are shared by armor class, except the Slumbering Coil Curio. \r\n\r\n[center][table class=grid width=95%]\r\n[tr background=black][td][b]Boss[/b][/td][td][b]Armor Slot[/b][/td][td][b]Cloth[/b][/td][td][b]Leather[/b][/td][td][b]Mail[/b][/td][td][b]Plate[/b][/td][/tr]\r\n[tr][td]Entombed Sentinels[/td][td]Hands[/td][td][item=270910][/td][td][item=270911][/td][td][item=270912][/td][td][item=270913][/td][/tr]\r\n[tr][td]The Lost Explorers[/td][td]Shoulders[/td][td][item=270922][/td][td][item=270923][/td][td][item=270924][/td][td][item=270925][/td][/tr]\r\n[tr][td]Vashnik the Malignant[/td][td]Chest[/td][td][item=270926][/td][td][item=270927][/td][td][item=270928][/td][td][item=270929][/td][/tr]\r\n[tr][td]Sszorak[/td][td]Legs[/td][td][item=270918][/td][td][item=270919][/td][td][item=270920][/td][td][item=270921][/td][/tr]\r\n[tr][td]The Twin Fangs[/td][td]Helm[/td][td][item=270914][/td][td][item=270915][/td][td][item=270916][/td][td][item=270917][/td][/tr]\r\n[tr][td]Ula'tek[/td][td]Any[/td][td colspan=4][item=270909][/td][/tr]\r\n[/table][/center]\r\n\r\n[h3 toc=false]Curio Token Vendor[/h3]\r\nPlayers can exchange their Slumbering Coil Curio with [npc=254436] in [zone=15969]. Kirana is located off to the right of the Matrix Catalyst.\r\n\r\n[grid column-width=500 align=centered]\r\n[div][center]/way #2393 40.2 64.7 Kirana\r\n[map zone=15969]\r\n[pin x=40.2 y=64.7 type=3]Kirana[/pin]\r\n[/map][/center]\r\n[/div]\r\n[div]\r\n[pad][pad][pad][center][screenshot id=1292951 height=325 size=normal border=2 alt=\"Kirana\"][/screenshot][/center][/div][/grid]\r\n\r\nCheck out Midnight Season 2 Tier Set models and bonuses in our Tier Set guide:\r\n\r\n[center][cta-button guide=34180 icon=inv_helm_cloth_raidpriestulatek_d_01]Midnight Season 2 Tier Sets[/cta-button][/center]\r\n\r\n[h2 type=bar toc=\"Rewards\"]All Rewards for The Venomous Abyss Raid in Midnight Patch 12.1[/h2]\r\n[tabs name=\"rewards\" size=\"thin\"]\r\n[tab name=\"Mounts\"]\r\nPlayers can earn the [item=275658] mount by defeating Ula'tek on Mythic difficulty.\r\n\r\n[center][screenshot id=1289160 width=800 border=2 size=normal alt=\"Primeval Skyfriend\"][/screenshot]\r\n[model npc=144856 slot=0 img=https://wow.zamimg.com/images/news/view-in-model-viewer-800.jpg][/model][/center]\r\n\r\nPlayers can earn the [item=275652] mount by completing the Glory of the Venomous Raider achievement.\r\n\r\n[center][img src=https://wow.zamimg.com/modelviewer/ptr/webthumbs/npc-row/200/144840.jpg width=800 border=2 alt=\"Crimson Venomfang\"]\r\n[model npc=144840 slot=0 img=https://wow.zamimg.com/images/news/view-in-model-viewer-800.jpg][/model][/center]\r\n[/tab]\r\n[tab name=\"Decor\"]\r\nEach boss drops lootable Player Housing decor when defeated on any difficulty. Additionally, players earn Vanquisher Trophy decor for defeating Ula'tek on certain difficulties.\r\n[ul]\r\n[li][b]Argent Trophy:[/b] LFR/Normal[/li]\r\n[li][b]Aureate Trophy:[/b] Heroic[/li]\r\n[li][b]Gleaming Trophy:[/b] Mythic[/li]\r\n[/ul]\r\n\r\n[center]\r\n[decor=26205 card] [decor=16093 card]\r\n[decor=26374 card] [decor=1426 card]\r\n[decor=25813 card] [decor=25812 card]\r\n[decor=27043 card] [decor=25131 card]\r\n[decor=25132 card] [decor=25133 card]\r\n[/center]\r\n[/tab]\r\n[tab name=\"Pet\"]\r\nNek'zali the Soulcoiler has a chance to drop a Player Housing decor piece when defeated on any difficulty.\r\n\r\n[grid column-width=500 align=centered]\r\n[div]\r\n[center][item=280305]\r\n[screenshot id=1291439 width=500 size=normal border=2 alt=\"Soulcoil Remnant Companion\"][/screenshot]\r\n[model npc=142350 slot=0 img=https://wow.zamimg.com/images/news/view-in-model-viewer-600.jpg][/model][/center]\r\n[/div]\r\n[/grid]\r\n[/tab]\r\n[tab name=\"Transmog\"]\r\nThere are three Helm transmog options available from The Venomous Abyss raid.\r\n\r\n[grid column-width=300 align=centered]\r\n[div]\r\n[center][item=281227]\r\n[img src=https://wow.zamimg.com/modelviewer/ptr/webthumbs/item/159/732063.png border=1 size=normal width=300 alt=\"Soulcoiler's Rush'kah\"]\r\n[model item=732063 slot=1 img=https://wow.zamimg.com/images/news/view-in-model-viewer-400.jpg][/model]\r\n[b]Boss:[/b] [npc=253563][/center]\r\n[/div]\r\n[div]\r\n[center][item=275937]\r\n[img src=https://wow.zamimg.com/modelviewer/ptr/webthumbs/item/97/740961.png border=1 size=normal width=300 alt=\"Hex Lord's Visage\"]\r\n[model item=740961 slot=1 img=https://wow.zamimg.com/images/news/view-in-model-viewer-400.jpg][/model]\r\n[b]Boss:[/b] [url=/npc=259447/]The Coiled Altar[/url][/center]\r\n[/div]\r\n[div]\r\n[center][item=275938]\r\n[img src=https://wow.zamimg.com/modelviewer/ptr/webthumbs/item/98/740962.png border=1 size=normal width=300 alt=\"Hex Lord
