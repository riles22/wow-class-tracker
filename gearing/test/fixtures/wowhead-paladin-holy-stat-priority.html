<script>WH.markup.printHtml("[db=live]Stats are a key component of customizing your Holy Paladin in Midnight. Having the right distribution of stats on your gear can be critical towards optimizing your performance. \r\n\r\nThis guide details the best stat priority for your Holy Paladin, as well as covering how to determine Holy Paladin stat priorities personalized for your character in [b]Midnight Season 2[/b], as well as how to check whether an item Best-in-Slot, an upgrade, or outright bad.\r\n\r\nIt also covers Holy Paladin's preferred stats in-depth, accounting for nuances and synergies for niche situations that go beyond a generic priority.\r\n\r\n[pad]\r\n[center][wrapper width=80%]\r\n[nav]\r\n[nav-item=guide/classes/paladin/holy/overview-pve-healer]Overview[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/bis-gear]BiS Gear[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/rotation-cooldowns-pve-healer]Rotation[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/talent-builds-pve-healer]Talent Builds[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/enchants-gems-pve-healer]Consumables[/nav-item]\r\n[nav-item=guide/classes/paladin/holy/stat-priority-pve-healer][color=white]Stats[/color][/nav-item]\r\n[nav-item=guide/classes/paladin/holy/basics icon=Inv_misc_groupneedmore]Basics[/nav-item]\r\n[/nav][/wrapper][/center]\r\n[pad]\r\n[toc]\r\n[pad]\r\n\r\n[h2 toc=\"Stat Recommendations\" type=bar][icon name=achievement_guildperk_fasttrack_rank2 color=c2 inline=true size=medium type=round][/icon] Best Stats for Holy Paladin[/h2]\r\n[pad]\r\n\r\n[b] All our secondary stats are good[/b] and close in value. Don't worry about optimizing stats until you have near maximum Item Level. Increases in Item Level are generally better than trying to optimize secondary stats, but ideally try to keep your Crit and Haste rating somewhat similar.\r\n\r\nYou should always use [url=https://questionablyepic.com/live/]Questionably Epic Live[/url] Top Gear to build your best set out of your available items. There's a quick start guide to it [url guide=19098]here[/url]. \r\n[center]\r\n[table class=responsive-table]\r\n[tr]\r\n[td width=50%]\r\n[box border=true]\r\n[center][b][symbol=wow-hero-talent-herald-of-the-sun] [color=c11]Herald of the Sun[/color] Stat Priority[/b][/center]\r\n[hr]\r\n[ol]\r\n[li][b]Intellect[/b][/li]\r\n[li][b]Mastery[/b][/li]\r\n[li][b]Haste = Crit[/b][/li]\r\n[li][b]Versatility[/b][/li]\r\n[/ol]\r\n[/box]\r\n\r\n[/td]\r\n[td width=50%]\r\n[box border=true]\r\n[center][symbol=wow-hero-talent-lightsmith] [b][color=mage]Lightsmith[/color] Stat Priority[/b][/center]\r\n[hr]\r\n[ol]\r\n[li][b]Intellect[/b][/li]\r\n[li][b]Mastery[/b][/li]\r\n[li][b]Haste = Crit[/b][/li]\r\n[li][b]Versatility[/b][/li]\r\n[/ol]\r\n\r\n[/box]\r\n\r\n[/td]\r\n[/tr]\r\n[/table]\r\n[/center]\r\n\r\n\r\nThough limited, gearing provides considerable freedom when customizing stats. Following the suggestions below, we've tailored recommendations of best-in-slot gear to seek during [b]Midnight Season 2[/b] for Holy Paladin in our Gearing Guide. \r\n[pad]\r\n[center][cta-button=guide/classes/paladin/holy/bis-gear color=paladin icon=inv_chest_chain_03]Holy Paladin Gearing Guide[/cta-button][/center]\r\n\r\n[h2 type=bar][icon name=spell_holy_searinglight color=c2 inline=true size=medium type=round][/icon] Stats Explained[/h2]\r\n\r\n[pad]\r\n[b]Intellect[/b] is your primary stat, found on all plate gear and weapons you'll acquire. Intellect increases the healing and damage that all your abilities do.\r\n\r\nFor Secondary stats, Holy Paladin gains the following from each stat:\r\n\r\n[ul]\r\n[li][b]Critical Strike[/b]: Chance for spells and abilities to do twice as much healing or damage. Scales well for us due to talents such as [spell=431413] and [spell=417855].[/li]\r\n[li][b]Haste[/b]:  Increases cast speed, reduces your Global Cooldown, and reduces the cooldown of our rotational abilities such as [spell=20473] and [spell=20271], which in turn grants us more overall Holy Power.[/li]\r\n[li][b]Versatility[/b]: Increases all healing and damage, while also reducing damage taken.[/li]\r\n[li][b]Mastery[/b]: Increases the effectiveness of [spell=183997]. This increases the healing you do based on how close your target is to you or your Beacon targets. It has 100% effectiveness within 10 yards, then falls off linearly to 0% at 40 yards.\r\n[/li]\r\n[/ul]\r\n\r\n[center][img src=https://wow.zamimg.com/uploads/guide/images/32080.png][/center]\r\n\r\n[h2 toc=\"Diminishing Returns\" type=bar][icon name=spell_chargenegative color=c2 inline=true size=medium type=round][/icon] Diminishing Returns in Midnight[/h2]\r\n[pad]\r\nAccumulating too much of one Secondary stat from your gear leads to diminishing returns. This means that adding more of the same stat beyond certain thresholds results in reduced benefits. These thresholds are fixed and reduce the amount gained from more of that stat rating by 10% per breakpoint. Each stat has a different rating threshold where the reduction begins:\r\n\r\n[ul]\r\n[li][b]Critical Strike[/b] - Above 1380 rating[/li]\r\n[li][b]Haste[/b] - Above 1320 rating[/li]\r\n[li][b]Mastery[/b] - Above 1380 rating[/li]\r\n[li][b]Versatility[/b] - Above 1620 rating[/li]\r\n[/ul]\r\n[pad]\r\n\r\n[quote]\r\n[b]Example[/b]\r\nLet's assume you gain 1% Haste for 10 Haste Rating. When above the diminishing return breakpoint, 10 Haste Rating would give you 0.9% Haste instead, resulting in a 10% reduction from what you gained previously.\r\n[/quote]\r\n\r\nNote that this system [b]only counts stat rating[/b], meaning that percentage-based procs and effects like [spell=2825] aren't factored in and will always grant their full benefit.\r\n\r\nYou can learn more about stat diminishing returns in our detailed guide: [br][pad][br][center][cta-button guide=11052]What are Stat Diminishing Returns[/cta-button][/center]\r\n\r\n \r\n\r\n[hr]\r\nOur Holy Paladin guides are always updated with the latest information from in-game experience, simulations, and logs. Make sure to check our changelog for this page by clicking on [b]View Changelog[/b] in the Quick Facts column or on the book icon at the top of the page. If you are interested in more in-depth Holy Paladin guides for [b]Midnight Season 2[/b], make sure to browse the [i]Navigation Bar[/i] at the top of the page.\r\n[pad]\r\n\r\n\r\n[ul]\r\n\r\n[minibox float=left][url=https://www.wowhead.com/holy-paladin-rotation-guide]Previous Page:\r\nRotation, Priority, and Abilities[/url][/minibox]\r\n[minibox float=right][url=https://www.wowhead.com/holy-paladin-gear-guide]Next Page:\r\nGear[/url][/minibox]\r\n[/ul]\r\n[br]\r\n[br]\r\n[pad]\r\n[hr]\r\n[h2 toc=false]Feedback[/h2]\r\n\r\nThanks for reading our class guides! If you have any feedback, feel free to leave a comment in the section below, and we will reply as quickly as possible. If you'd like to talk with any of our writers directly, you can do so by joining our [url=http://discord.gg/wowhead]Discord server[/url] and finding them there!\r\n\r\n[pad][br][pad]", "guide-body", { allow: WH.markup.CLASS_GUIDE });</script>
