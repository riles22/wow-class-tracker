<script>WH.markup.printHtml("[tabs uniform=true name=bis_items]\r\n\t[tab name=\"Overall BiS\" icon=8039569]\r\n\t[h3 toc=false][color=c11]Best in Slot Gear for Restoration Druid [/color][/h3]\r\n\r\n\t\tThe Restoration best-in-slot set aims to combine overbudget items from the raid (such as [item=271092]), with mastery and haste-heavy offpieces. You should end up with mastery and haste in most slots. There are a lot of special items in the raid this season, and to maximize your character you will want to clear them on heroic at least.\r\n\r\nNote that early crafts and later crafts might differ, so make sure you read the crafts section later in the guide.\r\n\r\n[center][table class=grid width=900px]\r\n[tr]\r\n[td background=c11][b]Slot[/b][/td]\r\n[td background=c11][b]Item[/b][/td]\r\n[td background=c11][b]Source[/b][/td]\r\n[/tr]\r\n[tr][td]Helm[/td][td][color=q4][item=271528 original-item=271875][/color][/td][td][icon name=inv_121_raid_achievement_ulatek][/icon][url guide=34252]Ula'tek[/url] [i](Raid)[/i] & [icon name=inv_radientazeritematrix][/icon][url guide=33219] Catalyst[/url][/td][/tr]\r\n[tr][td]Neck[/td][td][color=q4][item=268251][/color][/td][td][icon name=inv_121_raid_achievement_twins][/icon][url guide=34250]The Twin Fangs[/url]  [i](Raid)[/i][/td][/tr]\r\n[tr][td]Shoulders[/td][td][color=q4][item=244572][/color][/td][td][skill=165][/td][/tr]\r\n[tr][td]Cape[/td][td][color=q4][item=268253][/color][/td][td][icon name=inv_121_raid_achievement_zuljinmalacrass][/icon][url guide=34251]The Coiled Alter[/url]  [i](Raid)[/i][/td][/tr]\r\n[tr][td]Chest[/td][td][color=q4][item=271531 original-item=268235][/color][/td][td][icon name=inv_121_raid_achievement_priestess][/icon][url guide=34244]Nek'zali the Soulcoiler[/url] (Raid) & [icon name=inv_radientazeritematrix][/icon][url guide=33219] Catalyst[/url][/td][/tr]\r\n[tr][td]Bracers[/td][td][color=q4][item=244576][/color][/td][td][skill=165][/td][/tr]\r\n[tr][td]Gloves[/td][td][color=q4][item=271529][/color][/td][td][icon name=inv_121_raid_achievement_golems][/icon][url guide=34245]Entomed Sentinels[/url] [i](Raid)[/i][/td][/tr]\r\n[tr][td]Belt[/td][td][color=q4][item=268256][/color][/td][td][icon name=inv_121_raid_achievement_zuljinmalacrass][/icon][url guide=34251]The Coiled Alter[/url]  [i](Raid)[/i][/td][/tr]\r\n[tr][td]Legs[/td][td][color=q4][item=271527 original-item=268225][/color][/td][td][icon name=inv_121_raid_achievement_zuljinmalacrass][/icon][url guide=34251]The Coiled Alter[/url]  [i](Raid)[/i] & [icon name=inv_radientazeritematrix][/icon][url guide=33219] Catalyst[/url][/td][/tr]\r\n[tr][td]Boots[/td][td][color=q4][item=244569][/color][/td][td][skill=165][/td][/tr]\r\n[tr][td]Ring[/td][td][color=q4][item=268266][/color][/td][td][icon name=achievement_boss_elitenagamale][/icon][url guide=34240]Nymrissa Wavebinder[/url] [i](Raid)[/i][/td][/tr]\r\n[tr][td]Ring[/td][td][color=q4][item=252258][/color][/td][td][icon name=inv_achievement_dungeon_voidscararena][/icon][url guide=33183]Voidscar Arena[/url][/td][/tr]\r\n[tr][td]Trinkets[/td][td][color=q4][item=270167][/color][/td][td][icon name=achievement_boss_elitenagamale][/icon][url guide=34240]Nymrissa Wavebinder[/url] [i](Raid)[/i][/td][/tr]\r\n[tr][td]Trinkets[/td][td][color=q4][item=270162][/color][/td][td][icon name=inv_121_raid_achievement_priestess][/icon][url guide=34244]Nek'zali the Soulcoiler[/url]  [i](Raid)[/i][/td][/tr]\r\n[tr][td]1h Weapon[/td][td][color=q4][item=271092][/color][/td][td][icon name=inv_121_raid_achievement_ulatek][/icon][url guide=34252]Ula'tek[/url] [i](Raid)[/i][/td][/tr]\r\n[tr][td]Offhand[/td][td][color=q4][item=268197][/color][/td][td][icon name=inv_121_raid_achievement_golems][/icon][url guide=34245]Entomed Sentinels[/url]  [i](Raid)[/i][/td][/tr]\r\n[/table][/center]\r\n\t\t[h3 toc=false][color=c11]Best Gear to Catalyze for Restoration Druid [/color][/h3]\r\nThe Matrix Catalyst is a powerful in-game system that converts non-tier set armor pieces into tier set armor pieces of the same type. [b]In Season 2, catalyzed items will retain their stats, allowing players to target specific pieces of gear to catalyze[/b]. [b][color=orange-gem]All shoulder options are bad and you should craft Shoulders as part of your eventual BiS setup.[/color][/b] Below are the best items to catalyze for Restoration Druid:\r\n\r\n\r\n\t\t[grid align=centered no-margin=true column-width=300]\r\n[p]\r\n[large][b][color=c11]Head[/color][/b][/large]\r\n[center][icon-badge=271875 quality=4 tooltip=\"Cata_1_Tooltip\"][url guide=34252][large][b]Ula'tek[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c11]Shoulders[/color][/b][/large]\r\n[center][icon-badge=251223 quality=4 tooltip=\"Cata_2_Tooltip\"][url guide=33183][large][b]Voidscar Arena[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c11]Chest[/color][/b][/large]\r\n[center][icon-badge=268235 quality=4 tooltip=\"Cata_3_Tooltip\"][large][b]Nez'kali the Soulcoiler[/b][/large][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c11]Gloves[/color][/b][/large]\r\n[center][icon-badge=271529 quality=4 tooltip=\"Cata_4_Tooltip\"][url guide=34245][large][b]Entombed Sentinels[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c11]Legs[/color][/b][/large]\r\n[center][icon-badge=268225 quality=4 tooltip=\"Cata_5_Tooltip\"][url guide=34251][large][b]The Coiled Altar[/b][/large][/url][/center]\r\n[/p]\r\n\r\n\r\n[/grid]\r\n\t[/tab]\r\n[tab name=\"Mythic+ Only\" icon=achievement_dungeon_kingsrest]\r\n\t[h3 toc=false][color=c11]Best in Slot Mythic+-Only Gear for Restoration Druid [/color][/h3]\r\n\r\n[b][color=honored]The following set includes no raid gear.[/color][/b] Unfortunately, it is missing some key pieces this season. If you can get one raid item, get [item=270162]. It drops off the first boss, which makes it reasonably available and it will make a big difference to your keys. \r\n\r\n\r\n[center][table class=grid width=900px]\r\n[tr]\r\n[td background=c11][b]Slot[/b][/td]\r\n[td background=c11][b]Item[/b][/td]\r\n[td background=c11][b]Source[/b][/td]\r\n[/tr]\r\n[tr][td]Helm[/td][td][color=q4][item=271528 original-item=251140][/color][/td][td][icon name=inv_achievement_dungeon_murderrow][/icon][url guide=33189]Murder Row[/url] & [icon name=inv_radientazeritematrix][/icon][url guide=33219] Catalyst[/url][/td][/tr]\r\n[tr][td]Neck[/td][td][color=q4][item=251142][/color][/td][td][icon name=inv_achievement_dungeon_murderrow][/icon][url guide=33189]Murder Row[/url][/td][/tr]\r\n[tr][td]Shoulders[/td][td][color=q4][item=244572][/color][/td][td][skill=165][/td][/tr]\r\n[tr][td]Cape[/td][td][color=q4][item=251190][/color][/td][td][icon name=inv_achievement_dungeon_lightbloom][/icon][url guide=33193]The Blinding Vale[/url][/td][/tr]\r\n[tr][td]Chest[/td][td][color=q4][item=271531 original-item=251159][/color][/td][td][icon name=inv_achievement_dungeon_proveyourworth][/icon][url guide=33190]Den of Nalorakk[/url] & [icon name=inv_radientazeritematrix][/icon][url guide=33219] Catalyst[/url][/td][/tr]\r\n[tr][td]Bracers[/td][td][color=q4][item=244576][/color][/td][td][skill=165][/td][/tr]\r\n[tr][td]Gloves[/td][td][color=q4][item=271529 original-item=159337][/color][/td][td][icon name=achievement_dungeon_templeofsethraliss][/icon][url guide=33272]Temple of Sethraliss[/url] & [icon name=inv_radientazeritematrix][/icon][url guide=33219] Catalyst[/url][/td][/tr]\r\n[tr][td]Belt[/td][td][color=q4][item=159317][/color][/td][td][icon name=achievement_dungeon_templeofsethraliss][/icon][url guide=33272]Temple of Sethraliss[/url][/td][/tr]\r\n[tr][td]Legs[/td][td][color=q4][item=271527 original-item=159313][/color][/td][td][icon name=achievement_dungeon_kingsrest][/icon][url guide=33272]Kings Rest[/url] & [icon name=inv_radientazeritematrix][/icon][url guide=33219] Catalyst[/url][/td][/tr]\r\n[tr][td]Boots[/td][td][color=q4][item=251153][/color][/td][td][icon name=inv_achievement_dungeon_proveyourworth][/icon][url guide=33190]Den of Nalorakk[/url][/td][/tr]\r\n
