<script>WH.markup.printHtml("Gear represents one of the most important avenues towards strengthening your Protection Warrior by providing the majority of your stats, armor, and other gameplay elements such as procs and set bonuses.\r\n\r\nThis guide explains how to obtain the best gear for your Protection Warrior in [b]Midnight Season 2[/b] and how to determine whether an item is Best-in-Slot, an upgrade, or outright bad. It will help you identify the best pieces of gear from dungeons and raids in Midnight, whether they be weapons, trinkets, or armor. \r\n[center][wrapper width=80%]\r\n[nav]\r\n[nav-item=guide/classes/warrior/protection/overview-pve-tank]Overview[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/bis-gear]BiS Gear[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/rotation-cooldowns-pve-tank]Rotation[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/talent-builds-pve-tank]Talent Builds[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/enchants-gems-pve-tank]Consumables[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/stat-priority-pve-tank]Stats[/nav-item]\r\n[nav-item=guide/classes/warrior/protection/basics icon=Inv_misc_groupneedmore]Basics[/nav-item]\r\n[/nav][/wrapper][/center]\r\nFor other Warrior specs, you can check our [url=guide/classes/warrior/fury/bis-gear]Fury Warrior BiS[/url] and [url=guide/classes/warrior/arms/bis-gear]Arms Warrior BiS[/url] pages for the best.\r\n\r\n\r\n[toc]\r\n\r\n[h2 type=bar toc=\"Recommended Gear\"][icon name=inv_misc_orb_blue color=c1 inline=true size=medium type=round][/icon] Recommended Gear for Protection Warrior in Midnight Season 2[/h2]\r\nGearing and itemization are one of the most important aspects towards improving your character. Gear mainly comes from [url guide=33180]Raids[/url] on a weekly lockout, [url guide=33272]Mythic+ Dungeons[/url], or the [url guide=17592]Vault System[/url].\r\n[h3 toc=\"BiS Gear\"]What is the BiS Protection Warrior gear?[/h3]\r\nWhile raid drops are generally the most reliable way to obtain high item level gear, items from other sources can be just as good, if not better. As such, you should reference the [url=guide/classes/warrior/protection/stat-priority-pve-tank]stat priorities for Protection Warrior[/url] to help determine your own upgrade path based on what is available to you. [html]<a href=\"https://www.archon.gg/wow/builds/classes-and-specs\"><img\r\n       alt=\"\"\r\n       height=\"15\"\r\n       src=\"https://assets.rpglogs.com/img/archon/logo-64.svg\"\r\n       class=\"archon-logo-inline\"/> Archon</a>[/html] is a tool that can help determine which alternative gear options are available in any given slot, especially if you're unable to obtain a best-in-slot piece.\r\n\r\n\r\n\r\nAs a rough guideline, follow the stat priority of: [b]Haste > Versatility = Critical Strike > Mastery[/b]. Don't neglect the value of [b]Strength[/b], as a substantial increase in item level is generally worth it compared to optimized stats. It is always recommended that you use [url=https://www.raidbots.com/simbot/topgear]Raidbots[/url] to sim your own character, since every character has different circumstances. \r\n\r\n[tabs uniform=true name=bis_items]\r\n\t[tab name=\"Overall BiS\" icon=8039569]\r\n\t[h3 toc=false][color=c1]Best in Slot Gear for Protection Warrior [/color][/h3]\r\n\r\nProt warrior will generally focus on completing their tier set bonus, alongside picking up both offensive and defensive trinkets incase we need them to survive. Prot can also be quite flexible with trinket cooldowns as [spell=107574] is up very frequently.\r\n\r\n\t\t[center]\r\n\t\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c1][b]Slot[/b][/td]\r\n\t\t\t[td background=c1][b]Item[/b][/td]\r\n\t\t\t[td background=c1][b]Source[/b][/td]\r\n\t\t[/tr]\r\n\t\t[tr][td]Weapon[/td][td][item=268209][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Shield[/td][td][item=268196][/td][td][url guide=34247]The Lost Explorers[/url][/td][/tr]\r\n\t\t[tr][td]Head[/td][td][item=271456] [span class=tip tooltip=Bis_Cata_Helm_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34180]Tier Set[/url][/td][/tr]\r\n\t\t[tr][td]Neck[/td][td][item=268265][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[tr][td]Shoulders[/td][td][item=271454] [span class=tip tooltip=Bis_Cata_Shoulder_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34180]Tier Set[/url][/td][/tr]\r\n\t\t[tr][td]Cloak[/td][td][item=268253][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Chest[/td][td][item=271459] [span class=tip tooltip=Bis_Cata_Chest_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34180]Tier Set[/url][/td][/tr]\r\n\t\t[tr][td]Wrist[/td][td][item=237834][/td][td][url guide=15942]Crafting Blacksmithing[/url][/td][/tr]\r\n\t\t[tr][td]Gloves[/td][td][item=271457] [span class=tip tooltip=Bis_Cata_Gloves_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34180]Tier Set[/url][/td][/tr]\r\n\t\t[tr][td]Belt[/td][td][item=268259][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Legs[/td][td][item=271878] [span class=tip tooltip=Bis_Cata_Legs_Tooltip][symbol=wow-atlas-quest-wrapper-turnin][/span][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[tr][td]Boots[/td][td][item=237828][/td][td][url guide=15942]Crafting Blacksmithing[/url][/td][/tr]\r\n\t\t[tr][td]Ring[/td][td][item=268252][/td][td][url guide=34249]Sszorak[/url][/td][/tr]\r\n\t\t[tr][td]Ring 2[/td][td][item=268249][/td][td][url guide=34248]Vashnik the Malignant[/url][/td][/tr]\r\n\t\t[tr][td]Trinket[/td][td][item=270173][/td][td][url guide=34251]The Coiled Altar[/url][/td][/tr]\r\n\t\t[tr][td]Trinket 2[/td][td][item=270175][/td][td][url guide=34252]Ula'tek[/url][/td][/tr]\r\n\t\t[/table]\r\n\t\t[/center]\r\n\t\t[h3 toc=false][color=c1]Best Gear to Catalyze for Protection Warrior [/color][/h3]\r\nThe Matrix Catalyst is a powerful in-game system that converts non-tier set armor pieces into tier set armor pieces of the same type. In Season 2, catalyzed items will retain their stats, allowing players to target specific pieces of gear to catalyze. Below are the best items to catalyze for Protection Warrior:\r\n\t\t[grid align=centered no-margin=true column-width=300]\r\n[p]\r\n[large][b][color=c1]Head[/color][/b][/large]\r\n[center][icon-badge=268229 quality=4 tooltip=\"Cata_1_Tooltip\"][url guide=34244][large][b]Nek'zali the Soulcoiler[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c1]Shoulder[/color][/b][/large]\r\n[center][icon-badge=239037 quality=4 tooltip=\"Cata_2_Tooltip\"][url guide=34262][large][b]Temple of Sethraliss[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c1]Chest[/color][/b][/large]\r\n[center][icon-badge=251193 quality=4 tooltip=\"Cata_3_Tooltip\"][url guide=33193][large][b]Blinding Vale[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c1]Gloves[/color][/b][/large]\r\n[center][icon-badge=251214 quality=4 tooltip=\"Cata_4_Tooltip\"][url guide=33190][large][b]Den of Nalorakk[/b][/large][/url][/center]\r\n[/p]\r\n\r\n[p]\r\n[large][b][color=c1]Legs[/color][/b][/large]\r\n[center][icon-badge=271878 quality=4 tooltip=\"Cata_5_Tooltip\"][url guide=34252][large][b]Ula'tek[/b][/large][/url][/center]\r\n[/p]\r\n\r\n\r\n[/grid]\r\n\t[/tab]\r\n[/tabs]\r\n[pad]\r\nWondering which Enchants you should apply to your gear? Check out our Enchants & Consumables page for Protection Warrior.\r\n\r\n[center][cta-button=guide/classes/warrior/protection/enchants-gems-pve-tank color=c1 colortext icon=ui_profession_enchanting]Enchants and Consumables[/cta-button][/center]\r\n[html]<style>.archon-logo-inline {\r\n   width: 20px;\r\n   height: 20px;\r\n   display: inline;\r\n   margin-bottom: -3px;\r\n}\r\n\r\n\r\n.archon-section__banner {\r\n   position: relative;\r\n   width: 100%;\r\n   height: 90px;\r\n   border: 1px solid #242424;\r\n   background: linear-gradient(140deg, #060606 0%, #141414 100%);\r\n   font-size: 1.25rem;\r\n   font-weight: 700;\r\n   text-align: center;\r\n   text-wrap: balance;\r\n   text-shadow: rgba(0, 0, 0, 0) 0px 0px 1px, rgba(0, 0, 0, 0.8) 0px 1px 2px;\r\n   text-decoration: underline;\r\n   text-underline-offset: 5px;\r\n   text-decoration-thickness: 1px;\r\n   display: flex;\r\n   align-items: center;\r\n   justify-content: center;\r\n}\r\n\r\n\r\n@media (min-width: 1024px) {\r\n   .archon-section__banner {\r\n       font-size: 1.75rem;\r\n   }\r\n}\r\n\r\n\r\n.archon-section__banner-bg-1, .archon-section__banner-bg-2 {\r\n   position: absolute;\r\n   top: 0;\r\n   left: 0;\r\n   bottom: 0;\r\n   right: 0;\r\n   background-position: center;\r\n}\r\n\r\n\r\n.archon-section__banner-bg-1 {\r\n   mask-image: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(0, 0, 0, 1));\r\n   right: 70%;\r\n   background-position-x: 20px;\r\n   background-size: auto;\r\n   background-repeat: no-repeat;\r\n}\r\n\r\n\r\n.archon-section__banner-bg-2 {\r\n   background-size: cover;\r\n   transform: scaleX(-1);\r\n   mask-image: linear-gradient(to left, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 1));\r\n   filter: blur(4px);\r\n   left: 10%;\r\n}\r\n\r\n\r\n.archon-section__banner-content {\r\n   z-index: 1;\r\n   padding: 0 50px;\r\n}</style>\r\n[/html]\r\n\r\n[h3 type=bar toc=false]Learn About Popular Gear With Archon[/h3]\r\n\r\nGearing is a process that takes time and effort, even with powerful items being available from multiple sources. Over the course of acquiring gear, you may not have the best item available for every slot. [html]<a href=\"https://www.archon.gg\"><img\r\n       alt=\"\"\r\n       src=\"https://assets.rpglogs.com/img/archon/logo-64.svg\"\r\n       class=\"archon-logo-inline\"/> Archon</a>[/html] is a tool that compiles log data from thousands of players and shows [url=https://www.archon.gg/wow/builds/protection/warrior/raid/overview/mythic/all-bosses]the most popular builds and alternatives[/url]. At a glance, you can see what other players have done for different types of content.\r\n\r\n[html]\r\n<a href=\"https://www.archon.gg/wow/builds/protection/warrior/raid/gear-and-tier-set/mythic/all-bosses\"\r\n  target=\"_blank\">\r\n   <div class=\"archon-section__banner\">\r\n       <div class=\"archon-section__banner-bg-1\"\r\n            style=\"background-image: url('https://assets.rpglogs.com/img/archon/logo-64.svg');\"></div>\r\n       <div class=\"archon-section__banner-bg-2\"\r\n            style=\"background-image: url('https://www.archon.gg/_next/image?url=https%3A%2F%2Fassets.rpglogs.com%2Fimg%2Fwarcraft%2Fbuilds%2Fspecs%2Fwarrior-3.jpg&amp;w=1080&amp;q=75');\"></div>\r\n       <div class=\"archon-section__banner-content\">Protection Warrior Popular Gear on Archon\r\n       </div>\r\n   </div>\r\n</a>\r\n[/html]\r\n\r\n[h2 toc=\"Raid Drops\" type=bar][icon name=Achievement_zone_frostfire color=c1 inline=true size=medium type=round][/icon] Best Gear from Raids for Protection Warrior in Midnight Season 2[/h2]\r\nRaids feature several powerful drops for Protection Warrior in Midnight Midnight Season 2 due to either having special item effects or being a powerful best-in-slot option. Below are the best items to target when entering [url guide=34224]The Venomous Abyss[/url] and [url guide=34240]The Tidebound Grotto[/url]:\r\n\r\n\t[center]\r\n\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c1][b][icon-badge=268265 quality=4 tooltip=\"Raid_1_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c1][b][icon-badge=270173  quality=4 tooltip=\"Raid_2_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c1][b][icon-badge=270175 quality=4 tooltip=\"Raid_3_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c1][b][icon-badge=268209 quality=4 tooltip=\"Raid_4_Tooltip\"][/b][/td]\r\n\t\t[/tr]\r\n\t[/table]\r\n\t[/center]\r\n[h2 toc=\"Mythic+ Drops\" type=bar][icon name=Inv_arathordungeon_fragment_color6 color=c1 inline=true size=medium type=round][/icon] Best Gear from Mythic+ for Protection Warrior in Midnight Season 2[/h2]\r\nMythic+ dungeons offer a method of target farming specific pieces of gear for Protection Warrior freely without a weekly lockout. Below are the best items to get from Mythic+:\r\n\r\n\t[center]\r\n\t[table class=grid width=900px]\r\n\t\t[tr]\r\n\t\t\t[td background=c1][b][icon-badge=273797 quality=3 tooltip=\"Dung_1_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c1][b][icon-badge=251195 quality=3 tooltip=\"Dung_2_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c1][b][icon-badge=251196 quality=3 tooltip=\"Dung_3_Tooltip\"][/b][/td]\r\n\t\t\t[td background=c1][b][icon-badge=251193 quality=3 tooltip=\"Dung_4_Tooltip\"][/b][/td]\r\n\t\t[/tr]\r\n\t[/table]\r\n\t[/center]\r\n[h2 toc=\"Trinkets\" type=bar][icon name=inv_10_dungeonjewelry_dragon_trinket_5_green color=c1 inline=true size=medium type=round][/icon] Best Protection Warrior Trinkets in Midnight Season 2[/h2]\r\n\r\nProtection Warrior is extremely flexible when it comes to trinkets. We are open to a wide array of passive proc trinkets or powerful defensive trinkets.\r\nWe generally aim for one strong on-use and one passive proc. We love haste and primary stat, so as much of those as we can get on trinkets.\r\n\r\n\r\n\t[center][box][color=c1]Hover over trinkets to see notes on complex interactions![/color][/box][/center]\r\n\t[center]\r\n\t[h3 toc=false type=bar][color=c1] Trinket Tier List[/color][/h3]\r\n\r\n\t[wrapper width=95%]\r\n\t[grid width=95% align=centered]\r\n\t\t[display-option=raid icon=8039569 checked color=4]Raid[/display-option]\r\n\t\t[display-option=dungeon icon=inv_relics_hourglass checked color=3]Mythic Plus[/display-option]\r\n\t\t[display-option=delves icon=ui_delves checked color=2]Delves[/display-option]\r\n\t\t[display-option=crafting icon=inv_10_blacksmithing_consumable_repairhammer_color2 checked color=5]Crafting[/display-option]\r\n\t[/grid]\r\n\t[pad]\r\n\t[tier-list=rows grid]\r\n\t\t\t[tier]\r\n\t\t\t[tier-label bg=q5]S[/tier-label]\r\n\t\t\t[tier-content]\r\n\t\t\t\t[icon-badge=270164 quality=4 display-options=raid tooltip=\"Trinket_1_Tooltip\"]\r\n\t\t\t\t[icon-badge=270173 quality=4 display-options=raid tooltip=\"Trinket_2_Tooltip\"]\r\n\t\t\t\t[icon-badge=270175 quality=4 display-options=raid]\r\n\t\t\t\t[icon-badge=270165 quality=4 display-options=raid]\r\n\t\t\t\t[icon-badge=270168 quality=4 display-options=raid]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q4]A[/tier-label]\r\n\t\t\t[tier-content]\r\n                       [icon-badge=273796 quality=3 display-options=dungeon]\r\n                        [icon-badge=270163 quality=4 display-options=raid]\r\n\t\t\t[icon-badge=273797 quality=3 display-options=dungeon]\r\n\t[icon-badge=158367 quality=3 display-options=dungeon]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q3]B[/tier-label]\r\n\t\t\t[tier-content]\r\n\t\t\t[icon-badge=250228 quality=3 display-options=dungeon]\r\n                         [icon-badge=273795 quality=3 display-options=dungeon]\r\n [icon-badge=250229 quality=3 display-options=dungeon]\r\n      [icon-badge=193762 quality=3 display-options=dungeon]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q2]C[/tier-label]\r\n\t\t\t[tier-content]\r\n\t\t\t[icon-badge=246304 quality=4 display-options=crafting]\r\n\t\t\t[icon-badge=246305 quality=4 display-options=crafting]\r\n\t\t\t[icon-badge=246306 quality=4 display-options=crafting]\r\n\t\t\t[icon-badge=246307 quality=4 display-options=crafting]\r\n\t\t\t[icon-badge=241340 quality=4 display-options=crafting]\r\n[icon-badge=250238 quality=3 display-options=dungeon]\r\n\t\t\t[icon-badge=193757 quality=3 display-options=dungeon]\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\r\n\r\n\t\t[tier]\r\n\t\t\t[tier-label bg=q1]D[/tier-label]\r\n\t\t\t[tier-content]\r\n\t                [icon-badge=250259 quality=3 display-options=dungeon]\r\n\t\t\t[icon-badge=250245 quality=3 display-options=dungeon]\r\n\r\n\t\t\t[/tier-content]\r\n\t\t[/tier]\r\n\t[/tier-list]\r\n\t[/wrapper]\r\n\t[/center]\r\n\r\n[h2 toc=\"Set Bonuses\" type=bar][icon name=Inv_chest_leather_draenorquest90_b_01 color=c1 inline=true size=medium type=round][/icon] Midnight Season 2 Tier Set Bonuses for Protection Warrior[/h2]\r\n\r\nThe Midnight Season 2 tier set for Protection Warrior is rather passive and buffs our regular rotational spells with little effort.\r\nIt does largely incentivize us to play the active version of [spell=228920], as it now has a shorter cooldown and applies a powerful bleed.\r\n\r\n[pad]\r\n[quote type=box]\r\n[large]Jade Warlord's Dominion[/large]\r\n[ul][li][spell=1296647] - Your free Revenges deal 15% additional damage and cause your next Shield Slam to deal 20% additional damage.\r\n[/li]\r\n[li][spell=1296648] - Ravager and your free Revenges cause all targets to bleed over 12 sec. Ravager's cooldown is reduced by 30 sec.[/li][/ul]\r\n[/quote]\r\n\r\n\r\n\r\n[center]\r\n[screenshot id=1291121 width=800 size=normal border=2 alt=\"Protection Warrior Tier Set Midnight Season 2\"][/screenshot]\r\n[/center]\r\n[br]\r\n\r\n[h2 type=bar toc=\"Crafted Gear\"][icon name=inv_12_profession_questandcrafting_sparkwhole_green size=medium type=round inline=true color=c1][/icon] Best Crafted Gear for Protection Warrior[/h2]\r\n[item=274476] is a weekly-gated resource that is required for crafting some of the most powerful equipment available from professions. You should spend them wisely, aiming to craft items that you intend to use long-term. You can use the [url guide=18537]recrafting system[/url] to further enhance these pieces later, so there's no need to hoard Sparks if there's a noteworthy item that you can obtain now.\r\n\r\n[center][box]\r\n[h3 toc=\"Crafting Order\"][color=c1] Recommended Crafting Order for Protection Warrior [/color][/h3]\r\n[tabs uniform=true name=crafted_gear]\r\n\t[tab name=\"Early Crafts\" icon=inv_tailoring_modifiedcraftingreagent_yellow]\r\n\t\tAt the start of the season, resources and gear are very limited, and the first few crafted pieces are crucial for progressing efficiently. Here is the best early crafting order for Protection Warrior using [item=274476], targetting the quickest power gains:\r\n\r\n\t\t[ol]\r\n\t\t\t[li]Craft [item=237839] with [item=245876] [toggler id=CRAFT_ORDER_1 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c1 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_1 hidden]\r\n\t\t\tCrafting a weapon/shield early is great for crest unlocks in the future and always provides excellent value. You can skip this if you were lucky enough to loot one.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Craft [item=237831] with [item=240166] [toggler id=CRAFT_ORDER_2 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c1 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_2 hidden]\r\n\t\t\tCrafting a weapon/shield early is great for crest unlocks in the future and always provides excellent value. You can skip this if you were lucky enough to loot one.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Craft [item=237828] with [item=240166] [toggler id=CRAFT_ORDER_3 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c1 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_3 hidden]\r\n\t\t\tBoots are a flexible slot that allow you to change/apply many different embellishments. It's also our weakest item from raid stat wise.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Replace Low Item Level Pieces.\r\n\t\t\t[/li]\r\n\t\t[/ol]\r\n\t[/tab]\r\n\r\n\t[tab name=\"Best In Slot Crafts\" icon=ui_profession_blacksmithing]\r\n\t\tHere is the best crafting order for Protection Warrior using [item=274476], especially when Sparks are no longer a limiting resource and more gear is available late in the Season:\r\n\r\n\t[ol]\r\n\t\t\t[li]Craft [item=237839] with [item=245876] [toggler id=CRAFT_ORDER_4 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c1 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_4 hidden]\r\n\t\t\tCrafting a weapon/shield early is great for crest unlocks in the future and always provides excellent value. You can skip this if you were lucky enough to loot one.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Craft [item=237831] with [item=240166] [toggler id=CRAFT_ORDER_5 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c1 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_5 hidden]\r\n\t\t\tCrafting a weapon/shield early is great for crest unlocks in the future and always provides excellent value. You can skip this if you were lucky enough to loot one.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Craft [item=237828][toggler id=CRAFT_ORDER_6 hidden]Explanation [icon name=ui_profession_inscription size=small type=round color=c1 inline=true][/icon][/toggler]\r\n\t\t\t[div id=CRAFT_ORDER_6 hidden]\r\n\t\t\tBoots are a flexible slot that allow you to change/apply many different embellishments. It's also our weakest item from raid stat wise.\r\n\t\t\t[/div][/li]\r\n\r\n\t\t\t[li]Replace Low Item Level Pieces.\r\n\t\t\t[/li]\r\n\t\t[/ol]\r\n\t[/tab]\r\n[/tabs]\r\n\r\n[pad]\r\n[h3 toc=\"Embellishments\"][color=c1]Best Embellishments for Protection Warrior[/color][/h3]\r\n[pad]\r\nFor Protection Warrior, the best Embellishments are:\r\n[ul]\r\n\t[li][item=245876][/li]\r\n\t[li][item=240166][/li]\r\n[/ul]\r\n\r\nWe love primary stat and haste. The more we can acquire of these from embellishments the better.\r\n\r\n[/box][/center]\r\n\r\nFor more information about crafting, recrafting, and modifying crafted items with embellishments, check out our Profession Recrafting Guide below.\r\n\r\n[center][cta-button guide=18537 icon=ability_repair]Recrafting Items in Midnight[/cta-button][/center] \r\n\r\n[h2 type=bar toc=\"Upgrading Gear\"][icon name=inv_121_crest_myth size=medium type=round inline=true color=c1][/icon] Gear Upgrade Priorities for Protection Warrior in Midnight[/h2]\r\nSeason 2 of Midnight features multiple ways to upgrade and obtain gear, including Mistcrests and Bonus Rolls that can be used to obtain powerful gear for your Protection Warrior.\r\n\r\n[pad]\r\n[tabs uniform=true name=upgrade_systems]\r\n[tab name=\"Mistcrests\" icon=inv_121_crest_myth]\r\n[h3 toc=\"Crest Upgrades\"][color=c1]Upgrading With Mistcrests[/color][/h3]\r\n\r\n[b]Mistcrests[/b] are used to both upgrade and craft gear, with a weekly cap on their acquisition. Because of the Crest cap, making good choices with your Crests is key to getting the most out of your gear. For precise recommendations based on your current situation, we recommend using [url=https://www.raidbots.com/simbot/topgear]Raidbots Top Gear[/url] to simulate your character.\r\n\r\nBelow are the best upgrade priorities for Protection Warrior, providing a general overview of the most impactful items to focus on to maximize output.\r\n\r\n[ol]\r\n\t[li][b]Weapon[/b]\r\n\t[ul][li icon=none]Generally the highest DPS choice.[/li][/ul][/li]\r\n\r\n\t[li][b]Strong Trinkets[/b]\r\n\t[ul][li icon=none]Flexible and allows upgrading of multiple trinkets.[/li][/ul][/li]\r\n\r\n\t[li][b]High Budget Pieces[/b]\r\n\t[ul][li icon=none]Items like Chest and Legs have a higher stat budget, therefore you get more stats immediately from your crests.[/li][/ul][/li]\r\n[/ol]\r\n\r\nFor more information about upgrading items in Midnight, check out our dedicated guides.\r\n\r\n[center][cta-button guide=33253 icon=inv_121_crest_myth]Upgrading Items in Midnight[/cta-button] [/center]\r\n[/tab]\r\n[tab name=\"Bonus Rolls\" icon=inv_1205_voidforge_fluctuatingvoidcores_cosmicvoid]\r\n\r\n[h3 toc=\"Bonus Rolls\"]Bonus Rolling with Nebulous Voidcores[/h3]\r\nIn Season 2, players will be able to use [currency=3418] to target specific equipment via Bonus Loot rolls. Usable after Midnight Season 2 Raid Bosses, Mythic+ Dungeons, Bountiful Delves, and Nightmare Prey Hunts, this will be a key way to obtain best-in-slot pieces slowly over the rest of the Season. Using a Bonus Roll will reward an item level equivalent to Great Vault rewards from that content, making it possible to obtain items at Myth track from completing dungeons at Keystone level +10 or Heroic Raid Bosses.\r\n\r\n\t[center]\r\n\t[table class=grid width=400px]\r\n\t\t[tr][td width=50px][center][b][large]1[/large][/b][/center][/td][td background=c1][b][icon-badge=270173 quality=4 tooltip=\"Bonus_1_Tooltip\"][/b][/td][/tr]\r\n\t\t[tr][td width=50px][center][b][large]2[/large][/b][/center][/td][td background=c1][b][icon-badge=268209 quality=4 tooltip=\"Bonus_2_Tooltip\"][/b][/td][/tr]\r\n\t\t[tr][td width=50px][center][b][large]3[/large][/b][/center][/td][td background=c1][b][icon-badge=271878 quality=4 tooltip=\"Bonus_3_Tooltip\"][/b][/td][/tr]\r\n\t[/table]\r\n\t[/center]\r\nFor more information about Bonus Rolls and the Great Vault, check out our dedicated guide.\r\n\r\n[center][cta-button guide=17592 icon=Inv_cape_special_treasure_c_01]The Great Vault System[/cta-button][/center]\r\n[tooltip name=Bonus_1_Tooltip]Strong Trinket and powerful 2 set[/tooltip]\r\n[tooltip name=Bonus_2_Tooltip]BiS Weapon and powerful 2 set[/tooltip]\r\n[tooltip name=Bonus_3_Tooltip]Great Cantrip Legs[/tooltip]\r\n[/tab]\r\n[/tabs]\r\n\r\n\r\n[h2 type=bar toc=\"Omnium Folio\"][icon name=ui_majorfaction_-sky_256 size=medium type=round inline=true color=c1][/icon] Omnium Folio Powers for Protection Warrior in Midnight[/h2]\r\nThe [b]Omnium Folio[/b] is a system available to players throughout the rest of the [i]Midnight[/i] expansion, granting additional power through repeated enhancements to a Core Rune. Available as an icon on the mini-map, this ancient artifact will accompany you everywhere you go, and is able to be changed at any time outside of combat. Upgrades are earned weekly through a quest from Magister Umbric and Grand Magister Rommath. \r\n\r\nFor Protection Warrior, the best Omnium Folio setup is:\r\n[rotation-timeline]\r\n[rt-step=1279599 text=\"Rune 1\"]\r\n[rt-step=1279603 text=\"Rune 2\"]\r\n[rt-step=1287555 text=\"Rune 3\"]\r\n[rt-step=1279609 text=\"Rune 4\"]\r\n[rt-step=1279614 text=\"Rune 5\"]\r\n[/rotation-timeline]\r\nFor more information about the Omnium Folio, check out our dedicated guide.\r\n\r\n[center][cta-button guide=34036 icon=ability_priest_halo_shadow]The Omnium Folio Guide[/cta-button][/center]\r\n[hr]\r\nOur Protection Warrior guides are always updated with the latest information from in-game experience, simulations, and logs. Make sure to check our changelog for this page by clicking on [b]View Changelog[/b] in the Quick Facts column or on the book icon at the top of the page. If you are interested in more in-depth Protection Warrior guides for [b]Midnight Season 2[/b], make sure to browse the [i]Navigation Bar[/i] at the top of the page, along with our list of [b]Related Guides[/b] just beneath the [i]Table of Contents[/i].\r\n\r\n\r\n[tooltip name=Raid_1_Tooltip]High Budget Cantrip Neck[/tooltip]\r\n[tooltip name=Raid_2_Tooltip]Very powerful for DPS alone and extra with set bonus[/tooltip]\r\n[tooltip name=Raid_3_Tooltip]Very Strong Trinket[/tooltip]\r\n[tooltip name=Raid_4_Tooltip]BiS Weapon[/tooltip]\r\n[tooltip name=Dung_1_Tooltip]Strong Trinket[/tooltip]\r\n[tooltip name=Dung_2_Tooltip]BiS Dungeon Wep[/tooltip]\r\n[tooltip name=Dung_3_Tooltip]BiS Dungeon Shield[/tooltip]\r\n[tooltip name=Dung_4_Tooltip]Great for Cata tier[/tooltip]\r\n\r\n[tooltip name=Trinket_1_Tooltip]Strong Trinket[/tooltip]\r\n[tooltip name=Trinket_2_Tooltip]Very Strong Trinket[/tooltip]\r\n\r\n[tooltip name=Cata_1_Tooltip]Similar stats to tier[/tooltip]\r\n[tooltip name=Cata_2_Tooltip]Much better stats than tier[/tooltip]\r\n[tooltip name=Cata_3_Tooltip]Much better stats than tier[/tooltip]\r\n[tooltip name=Cata_4_Tooltip]Similar stats to tier[/tooltip]\r\n[tooltip name=Cata_5_Tooltip]Bonus Cantrip Effect[/tooltip]\r\n\r\n[tooltip name=Bis_Cata_Helm_Tooltip]Natural Tier has great stats[/tooltip]\r\n[tooltip name=Bis_Cata_Shoulder_Tooltip]Ideally, Cata shoulders from Temple of Sethraliss[/tooltip]\r\n[tooltip name=Bis_Cata_Chest_Tooltip]Ideally, Cata Chest from Blinding Vale[/tooltip]\r\n[tooltip name=Bis_Cata_Gloves_Tooltip]Natural Tier has great stats[/tooltip]\r\n[tooltip name=Bis_Cata_Legs_Tooltip]Cata Cantrip legs from Ula'tek[/tooltip]", "guide-body", { allow: WH.markup.CLASS_GUIDE });</script>
